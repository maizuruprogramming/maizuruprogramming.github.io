name: Weekly Monday 06:30 JST Auto Menu Check

on:
  schedule:
    # 毎週月曜日 06:30 JST (日曜日 21:30 UTC) に自動実行
    - cron: '30 21 * * 0'
  # 画面から「今すぐ実行 (Run workflow)」するための設定
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'kakuyu-menu/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  auto-check-monthly-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kakuyu-menu/python/requirements.txt

      - name: Fetch official PDF menu and update JSON/YAML
        run: python kakuyu-menu/python/fetch_menu.py --trigger manual_run_workflow

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify C# menu viewer and status output
        run: dotnet run --project kakuyu-menu/csharp/KakuyuryoMonthlyMenu.csproj -- 2026-11-21

      - name: Commit and push updated menu data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kakuyu-menu/web/monthly_menu.json kakuyu-menu/data/menu.yaml
          git diff --cached --quiet || git commit -m "chore: update official monthly menu"
          git push