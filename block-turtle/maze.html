/* ========== 1. オリジナルのブロック ========== */

Blockly.common.defineBlocksWithJsonArray([

/* ========== 2. ブロック → JavaScript ========== */
const gen = javascript.javascriptGenerator;
gen.STATEMENT_PREFIX = 'highlight(%1);\n';   // いま うごいている ブロックを光らせる
gen.addReservedWords('highlight');

gen.forBlock['maze_forward'] = () => 'forward();\n';
gen.forBlock['maze_right']   = () => 'turnRight();\n';
gen.forBlock['maze_left']    = () => 'turnLeft();\n';
gen.forBlock['maze_until_goal'] = (b, g) =>
  `while (!atGoal()) {\n  loopGuard();\n${g.statementToCode(b, 'DO')}}\n`;
gen.forBlock['maze_if'] = (b, g) =>
  `if (isOpen('${b.getFieldValue('DIR')}')) {\n${g.statementToCode(b, 'DO')}}\n`;
gen.forBlock['maze_ifelse'] = (b, g) =>
  `if (isOpen('${b.getFieldValue('DIR')}')) {\n${g.statementToCode(b, 'DO')}} else {\n${g.statementToCode(b, 'ELSE')}}\n`;

/* ========== 3. チュートリアルの ステージ ==========
   map の きごう：S=スタート  G=ゴール  #=いわ  .=みち

   mode：'test' は ランダムな めいろ 30こで テスト、'free' は じゆうに あそぶ */

const ALL  = [...MOVE, 'controls_repeat_ext', 'maze_until_goal', 'maze_if', 'maze_ifelse'];

const LEVELS = [

/* ---------- ステージの こたえ（ブロック）：先生モード（URLに ?sensei）で よみこめる ---------- */
const A = (() => {
  const chain = (list) => list.reduceRight((next, b) => next ? { ...b, next: { block: next } } : b, null);
  return {
    f: () => ({ type: 'maze_forward' }),
    r: () => ({ type: 'maze_right' }),
    l: () => ({ type: 'maze_left' }),
    repeat: (n, body) => ({ type: 'controls_repeat_ext',
      inputs: { TIMES: { shadow: { type: 'math_number', fields: { NUM: n } } }, DO: { block: chain(body) } } }),
    untilGoal: (body) => ({ type: 'maze_until_goal', inputs: { DO: { block: chain(body) } } }),
    ifElse: (dir, yes, no) => ({ type: 'maze_ifelse', fields: { DIR: dir },
      inputs: { DO: { block: chain(yes) }, ELSE: { block: chain(no) } } }),
    program: (body) => ({ blocks: { languageVersion: 0, blocks: [{ ...chain(body), x: 30, y: 30 }] } })
  };
})();
{ // こたえの データ（ここだけで つかう みじかい なまえ）
const f = A.f, r = A.r, l = A.l;
const RIGHT_HAND = [A.untilGoal([A.ifElse('R', [r(), f()], [A.ifElse('F', [f()], [l()])])])];

const ANSWER_BLOCKS = [
  A.program([f(), f(), f(), f()]),
  A.program([f(), f(), r(), f(), f()]),
  A.program([f(), f(), f(), f(), r(), f(), f(), r(), f(), f(), f(), f()]),
  A.program([A.repeat(4, [f()]), r(), A.repeat(4, [f()])]),
  A.program([A.repeat(4, [f(), r(), f(), l()])]),
  A.program([A.untilGoal([A.ifElse('F', [f()], [r()])])]),
  A.program([A.untilGoal([A.ifElse('F', [f()], [A.ifElse('R', [r()], [l()])])])]),
  A.program(RIGHT_HAND),
  A.program(RIGHT_HAND)
];
LEVELS.forEach((lv, i) => { lv.answer = ANSWER_BLOCKS[i]; });
}

/* ========== 5. めいろ ========== */
const N = 5, CELL = 80;
const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];   // 0:うえ 1:みぎ 2:した 3:ひだり
let rocks = [], START = { r: 0, c: 0, dir: 1 }, GOAL = { r: 4, c: 4 };

function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }
function free(r, c)   { return inside(r, c) && !rocks[r][c]; }

function loadMap(map, dir) {
  rocks = map.map((row, r) => [...row].map((ch, c) => {
    if (ch === 'S') START = { r, c, dir };
    if (ch === 'G') GOAL = { r, c };
    return ch === '#';
  }));
}

// スタートから ゴールまで いけるか（はばゆうせん たんさく）
function solvable(rk) {
  const ok = (r, c) => inside(r, c) && !rk[r][c];
  const seen = Array.from({ length: N }, () => Array(N).fill(false));
  const q = [[0, 0]]; seen[0][0] = true;
  while (q.length) {
    const [r, c] = q.shift();
    if (r === N - 1 && c === N - 1) return true;
    for (let d = 0; d < 4; d++) {
      const nr = r + DR[d], nc = c + DC[d];
      if (ok(nr, nc) && !seen[nr][nc]) { seen[nr][nc] = true; q.push([nr, nc]); }
    }
  }
  return false;
}

// ランダムな めいろ（スタート ひだりうえ・みぎむき、ゴール みぎした）
function randomRocks(k) {
  let rk;
  do {
    rk = Array.from({ length: N }, () => Array(N).fill(false));
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const nearStart = (r + c <= 1);
      if (!nearStart && !(r === N - 1 && c === N - 1)) cells.push([r, c]);
    }
    for (let i = 0; i < k; i++) {
      const [r, c] = cells.splice(Math.floor(Math.random() * cells.length), 1)[0];
      rk[r][c] = true;
    }
  } while (!solvable(rk));
  return rk;
}

function setRandomMaze(rk) {
  rocks = rk; START = { r: 0, c: 0, dir: 1 }; GOAL = { r: N - 1, c: N - 1 };
  store.set('-random', rk);
  resetRobot();
}

/* ========== 6. プログラムを しらべて、うごきの きろくを つくる ========== */
const MAX_MOVES = 200, MAX_LOOPS = 1000;
class Stop { constructor(kind, text, why) { this.kind = kind; this.text = text; this.why = why; } }

function simulate(code) {
  const s = { ...START };
  const frames = [];
  let blockId = null, loops = 0;
  const rec = (event) => {
    frames.push({ r: s.r, c: s.c, dir: s.dir, id: blockId, event });
    if (frames.length > MAX_MOVES) throw new Stop('ng', t('tooManyMoves', MAX_MOVES));
  };
  const api = {
    highlight: (id) => { blockId = id; },
    forward: () => {
      const nr = s.r + DR[s.dir], nc = s.c + DC[s.dir];
      if (!free(nr, nc)) { rec('crash'); throw new Stop('ng', t('crash'), 'crash'); }
      s.r = nr; s.c = nc; rec('move');
      if (s.r === GOAL.r && s.c === GOAL.c) throw new Stop('ok', 'goal');
    },
    turnRight: () => { s.dir = (s.dir + 1) % 4; rec('turn'); },
    turnLeft:  () => { s.dir = (s.dir + 3) % 4; rec('turn'); },
    isOpen: (which) => {
      const d = (s.dir + { F: 0, R: 1, L: 3 }[which]) % 4;
      return free(s.r + DR[d], s.c + DC[d]);
    },
    atGoal: () => s.r === GOAL.r && s.c === GOAL.c,
    loopGuard: () => { if (++loops > MAX_LOOPS) throw new Stop('ng', t('endless')); }
  };
  let result;
  try {
    new Function(...Object.keys(api), code)(...Object.values(api));
    result = new Stop('ng', t('noGoal'));
  } catch (e) {
    result = e instanceof Stop ? e : new Stop('ng', '⚠ ' + e.message);
  }
  return { frames, result };
}

/* ========== 7. えを かく（ドット絵） ==========
   1マスを 16×16 ドットで かき、5ばいに ひろげて ひょうじする */
const ctx = document.getElementById('board').getContext('2d');
ctx.imageSmoothingEnabled = false;
const PX = CELL / 16;
let robot = { ...START }, trail = [], crashed = false, timer = null;

// マスごとに いつも おなじに なる らんすう（もようが ちらつかないように）
function rand(r, c, i) {
  let h = (r * 73856093) ^ (c * 19349663) ^ (i * 83492791);
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function dot(x, y, px, py, color) { ctx.fillStyle = color; ctx.fillRect(x + px * PX, y + py * PX, PX, PX); }
function noiseTile(x, y, r, c, salt, colors) {
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++)
    dot(x, y, px, py, colors[Math.floor(rand(r * 16 + py, c * 16 + px, salt) * colors.length)]);
}

// くさの じめん
function grassTile(x, y, r, c) {
  noiseTile(x, y, r, c, 1, ['#5fa83a', '#5fa83a', '#58a034', '#6cbb45', '#4e9a2f']);
  for (let k = 0; k < 4; k++) dot(x, y, Math.floor(rand(r, c, 10 + k) * 16), Math.floor(rand(r, c, 20 + k) * 16), '#7fd055');
}
// とおった みち（つち）
function dirtTile(x, y, r, c) {
  noiseTile(x, y, r, c, 2, ['#8b5a2b', '#7a4e25', '#966434', '#8b5a2b', '#6e4520']);
}
// いしブロック（いわ）：まるい いしを ならべた もよう
function stoneTile(x, y, r, c) {
  noiseTile(x, y, r, c, 3, ['#7f7f7f', '#8a8a8a', '#757575', '#828282']);
  const stones = [[1, 1, 6, 5], [8, 0, 7, 4], [0, 7, 4, 4], [5, 6, 6, 5], [12, 5, 4, 6], [1, 12, 7, 4], [9, 12, 6, 4]];
  for (const [sx, sy, w, h] of stones) {
    for (let i = 0; i < w; i++) { dot(x, y, sx + i, sy + h - 1, '#555555'); dot(x, y, sx + i, sy, '#a5a5a5'); }
    for (let j = 0; j < h; j++) { dot(x, y, sx + w - 1, sy + j, '#555555'); }
  }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x, y + CELL - PX * 2, CELL, PX * 2);   // したに かげ
}
// スタート：もくざいの いた
function plankTile(x, y, r, c) {
  noiseTile(x, y, r, c, 4, ['#b8945f', '#ae8a55', '#c19d68']);
  for (let row = 3; row < 16; row += 4) for (let px = 0; px < 16; px++) dot(x, y, px, row, '#7a5a30');
  [[3, 0], [11, 4], [6, 8], [13, 12]].forEach(([px, py]) => { for (let j = 0; j < 3; j++) dot(x, y, px, py + j, '#7a5a30'); });
}
// ゴール：ダイヤの こうせき
const GEM = [
  '................', '..DD........dd..', '.DdkD......DdD..', '..Dk.........k..', '........DD......',
  '.......DddD.....', '......DdkkD.....', '.......Dkk......', '..k.....D.......', '.DD.........DD..',
  'DddD.......DdkD.', '.Dkk........Dk..', '..k....DD.......', '......DdkD......', '.......Dk.......', '................'];
function diamondTile(x, y, r, c) {
  stoneTile(x, y, r, c);
  const col = { D: '#4ee8e0', d: '#d3fffb', k: '#1b9e98' };
  GEM.forEach((row, py) => [...row].forEach((ch, px) => { if (col[ch]) dot(x, y, px, py, col[ch]); }));
}

// たんけんか（オリジナル キャラ）：うえむきで かいて、むきに あわせて まわす
const HERO = [
  '................', '................', '......LLLL......', '....hhLLLLhh....',
  '....hHHHHHHh....', '....hHHHHHHh....', '....hHHHHHHh....', '..BBhHHHHHHhBB..',
  '.SBBhHHHHHHhBBS.', '.SBBhhhhhhhhBBS.', '.SBBBBBBBBBBBBS.', '.SBBBBBBBBBBBBS.',
  '..BBBBBBBBBBBB..', '..bbbbbbbbbbbb..', '................', '................'];
function drawHero() {
  const cx = robot.c * CELL + CELL / 2, cy = robot.r * CELL + CELL / 2;
  const col = crashed
    ? { L: '#fff59d', h: '#8b0000', H: '#e53935', B: '#e53935', b: '#8b0000', S: '#e0b48a' }
    : { L: '#fff59d', h: '#c66a00', H: '#ff9800', B: '#3f8fd2', b: '#2c6aa0', S: '#e0b48a' };
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(robot.dir * Math.PI / 2);
  ctx.fillStyle = 'rgba(255,245,157,.45)';            // ライトの ひかり（まえの むき）
  ctx.beginPath(); ctx.moveTo(-PX * 2, -PX * 6); ctx.lineTo(PX * 2, -PX * 6);
  ctx.lineTo(PX * 5, -CELL * 0.75); ctx.lineTo(-PX * 5, -CELL * 0.75); ctx.fill();
  HERO.forEach((row, py) => [...row].forEach((ch, px) => {
    if (col[ch]) { ctx.fillStyle = col[ch]; ctx.fillRect((px - 8) * PX, (py - 8) * PX, PX, PX); }
  }));
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  const walked = new Set(trail.map(([r, c]) => r + ',' + c));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = c * CELL, y = r * CELL;
    if (rocks[r][c]) stoneTile(x, y, r, c);
    else if (r === GOAL.r && c === GOAL.c) diamondTile(x, y, r, c);
    else if (r === START.r && c === START.c) plankTile(x, y, r, c);
    else if (walked.has(r + ',' + c)) dirtTile(x, y, r, c);
    else grassTile(x, y, r, c);
  }
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(400, i * CELL + .5); ctx.stroke();
  }
  drawHero();
}

/* ========== 8. ステージの きりかえ ========== */
const msg = document.getElementById('msg');
const levelSelect = document.getElementById('levelSelect');
const clearDialog = document.getElementById('clearDialog');
function showClearDialog() {
  const next = LEVELS[levelIndex + 1];
  document.getElementById('dlgQuestion').innerHTML =
    `${t('dlgQuestion')}<br><span style="font-size:15px">${LANG === 'en' ? '(' : '（'}${L(next, 'title')}${LANG === 'en' ? ')' : '）'}</span>`;
  clearDialog.classList.add('show');
  document.getElementById('dlgYes').focus();
}
let dialogTimer = null;
function hideClearDialog() { clearTimeout(dialogTimer); dialogTimer = null; clearDialog.classList.remove('show'); }
let cleared = store.get('-cleared') || [];

function refreshLevelList() {
  levelSelect.innerHTML = '';
  LEVELS.forEach((lv, i) => levelSelect.add(new Option((cleared[i] ? '✅ ' : '') + L(lv, 'title'), i)));
  levelSelect.value = levelIndex;
}

function setLevel(i) {
  levelIndex = i;
  const lv = LEVELS[i];
  store.set('-level', i);
  refreshLevelList();
  document.getElementById('lessonText').textContent = L(lv, 'text');
  document.getElementById('limitText').textContent = lv.limit ? t('limit', lv.limit) : '';
  const hint = document.getElementById('hintText');
  hint.textContent = L(lv, 'hint'); hint.style.display = 'none';
  document.getElementById('hintBtn').style.display = L(lv, 'hint') ? '' : 'none';
  document.getElementById('randomRow').style.display = lv.mode ? 'flex' : 'none';

  // つかえる ブロックと、この ステージで くんでいた プログラムを よみこむ
  loading = true;
  workspace.updateToolbox(flyout(lv.blocks));
  workspace.clear();
  const saved = store.get('-ws-' + i);
  if (saved) { try { Blockly.serialization.workspaces.load(saved, workspace); } catch (_) {} }
  loading = false;

  if (lv.mode) {
    const rk = store.get('-random');
    if (Array.isArray(rk) && rk.length === N && solvable(rk)) setRandomMaze(rk);
    else setRandomMaze(randomRocks(Number(document.getElementById('rockCount').value)));
  } else {
    loadMap(lv.map, lv.dir);
    resetRobot();
  }
  updateInfo();
}

// ぜんぶの ステージ（じゆうモード いがい）を クリアしたか
function allStagesCleared() { return LEVELS.every((lv, i) => lv.mode === 'free' || cleared[i]); }

// 📜 しゅうりょうしょう（とじたら、つぎの ステージの かくにんを だす）
function showCertificate(thenNext) {
  Certificate.show({ app: t('appTitle'), icons: ['⛏', '💎'],
    onClose: thenNext && levelIndex < LEVELS.length - 1 ? showClearDialog : null });
}

function markCleared() {
  const wasAll = allStagesCleared();
  cleared[levelIndex] = true;
  store.set('-cleared', cleared);
  refreshLevelList();
  if (!wasAll && allStagesCleared()) {   // いま ぜんぶ クリアに なった！
    dialogTimer = setTimeout(() => showCertificate(true), 900);
    return;
  }
  if (levelIndex < LEVELS.length - 1) dialogTimer = setTimeout(showClearDialog, 900);   // ファンファーレの あとに だす
}

/* ========== 9. じっこう ========== */
function resetRobot() {
  if (timer) clearTimeout(timer);
  timer = null;
  robot = { ...START }; trail = [[START.r, START.c]]; crashed = false;
  msg.textContent = ''; msg.className = '';
  hideClearDialog();
  workspace.highlightBlock(null);
  draw();
}

function blockCount() {
  return workspace.getAllBlocks(false).filter((b) => !b.isShadow()).length;
}

function updateInfo(moves) {
  document.getElementById('info').textContent =
    t('used', blockCount()) + (moves != null ? t('moves', moves) : '');
}

// ステージ8：ランダムな めいろ 30こで テスト
function testOnRandomMazes(code, times) {
  const keep = { rocks, START, GOAL };
  const k = Number(document.getElementById('rockCount').value);
  let ok = 0;
  START = { r: 0, c: 0, dir: 1 }; GOAL = { r: N - 1, c: N - 1 };
  for (let t = 0; t < times; t++) {
    rocks = randomRocks(k);
    if (simulate(code).result.kind === 'ok') ok++;
  }
  ({ rocks, START, GOAL } = keep);
  return ok;
}

/* ========== 効果音（Web Audio で その場で つくる 8ビットふうの おと） ========== */
const Sound = {
  ctx: null, master: null, muted: !!store.get('-muted'), stepFoot: 0,
  // ブラウザは ボタンを おすまで おとを ならせないので、さいしょの クリックで じゅんび
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.25;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  // 1つの おと：type=なみの かたち, f1→f2 に たかさを かえる, len=びょう
  tone(type, f1, f2, len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + len + 0.02);
  },
  noise(len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * len), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain(), lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.buffer = buf; src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t);
  },
  notes(list, type = 'square', vol = 0.6) {   // list: [[ヘルツ, はじまり(びょう), ながさ(びょう)], ...]
    for (const [f, at, len] of list) this.tone(type, f, f, len, at, vol);
  },

  // --- つかう おと ---
  step() {                                   // あしおと（ひだり・みぎで すこし たかさを かえる）
    this.stepFoot ^= 1;
    this.noise(0.07, 0, 0.5);
    this.tone('square', this.stepFoot ? 330 : 294, this.stepFoot ? 220 : 196, 0.07, 0, 0.35);
  },
  turnRight() { this.tone('triangle', 520, 880, 0.12, 0, 0.7); },   // ひゅっ↑
  turnLeft()  { this.tone('triangle', 880, 520, 0.12, 0, 0.7); },   // ひゅっ↓
  crash() {                                  // ゴンッ
    this.noise(0.35, 0, 1);
    this.tone('square', 140, 50, 0.35, 0, 0.8);
  },
  clear() {                                  // ステージ クリア：ドミソド〜
    this.notes([[523, 0, .12], [659, .12, .12], [784, .24, .12], [1047, .36, .45]]);
    this.notes([[392, .36, .45], [659, .36, .45]], 'triangle', 0.5);
  },
  goalSoSo() { this.notes([[784, 0, .12], [1047, .14, .25]]); },      // ゴールしたけど めやすオーバー
  fail()  { this.notes([[392, 0, .16], [330, .18, .16], [262, .36, .35]], 'square', 0.5); },  // ざんねん
  grandClear() {                             // チュートリアル ぜんぶ クリア
    const m = [[523, 0, .1], [523, .12, .1], [523, .24, .1], [523, .36, .3], [415, .7, .3], [466, 1.0, .3], [523, 1.3, .15], [466, 1.5, .1], [523, 1.62, .7]];
    this.notes(m);
    this.notes([[262, 1.3, 1.0], [330, 1.3, 1.0], [392, 1.3, 1.0]], 'triangle', 0.4);
  },
  toggle() {
    this.muted = !this.muted; store.set('-muted', this.muted);
    return this.muted;
  }
};


function finish(result, moves, code) {
  const lv = LEVELS[levelIndex];
  updateInfo(moves);
  if (result.kind !== 'ok') {
    msg.className = 'ng'; msg.textContent = result.text;
    if (result.why !== 'crash') Sound.fail();   // ぶつかった ときは もう おとが なっている
    return;
  }
  msg.className = 'ok';
  const n = blockCount();
  if (lv.mode === 'test') {
    const ok = testOnRandomMazes(code, 30);
    if (ok === 30) { msg.textContent = t('grand'); markCleared(); Sound.grandClear(); }
    else { msg.className = 'ng'; msg.textContent = t('testPartial', ok); Sound.goalSoSo(); }
  } else if (lv.mode === 'free') {
    msg.textContent = t('freeGoal');
    Sound.clear();
  } else if (lv.limit && n > lv.limit) {
    msg.textContent = t('overLimit', n, lv.limit);
    Sound.goalSoSo();
  } else {
    msg.textContent = t('stageClear');
    markCleared();
    Sound.clear();
  }
}

function run() {
  Sound.unlock();
  resetRobot();
  const code = gen.workspaceToCode(workspace);
  const { frames, result } = simulate(code);
  let i = 0;
  const tick = () => {
    if (i < frames.length) {
      const f = frames[i++];
      robot = { r: f.r, c: f.c, dir: f.dir };
      if (f.event === 'move') { trail.push([f.r, f.c]); Sound.step(); }
      if (f.event === 'turn') {
        const prev = i > 1 ? frames[i - 2].dir : START.dir;
        if ((prev + 1) % 4 === f.dir) Sound.turnRight(); else Sound.turnLeft();
      }
      if (f.event === 'crash') { crashed = true; Sound.crash(); }
      workspace.highlightBlock(f.id);
      draw();
      const speed = Number(document.getElementById('speed').value);
      timer = setTimeout(tick, 650 - speed * 60);
    } else {
      timer = null;
      workspace.highlightBlock(null);
      finish(result, frames.filter((f) => f.event !== 'crash').length, code);
    }
  };
  tick();
}

document.getElementById('run').addEventListener('click', run);
document.getElementById('reset').addEventListener('click', resetRobot);
document.getElementById('newMaze').addEventListener('click', () =>
  setRandomMaze(randomRocks(Number(document.getElementById('rockCount').value))));
document.getElementById('rockCount').addEventListener('change', () =>
  setRandomMaze(randomRocks(Number(document.getElementById('rockCount').value))));
levelSelect.addEventListener('change', () => setLevel(Number(levelSelect.value)));
// はい → つぎの ステージへ
document.getElementById('dlgYes').addEventListener('click', () => { hideClearDialog(); setLevel(levelIndex + 1); });
// いいえ → おなじ ステージを もういちど（ブロックは そのまま、たんけんかは スタートへ）
document.getElementById('dlgNo').addEventListener('click', () => {
  hideClearDialog();
  resetRobot();
  msg.className = 'ok';
  msg.textContent = t('retry');
});
document.addEventListener('keydown', (e) => {
  if (!clearDialog.classList.contains('show')) return;
  if (e.key === 'Escape') document.getElementById('dlgNo').click();
});
document.getElementById('hintBtn').addEventListener('click', () => {
  const h = document.getElementById('hintText');
  h.style.display = h.style.display === 'none' ? 'block' : 'none';
});
window.addEventListener('resize', () => Blockly.svgResize(workspace));

// ヘッダー：ボタンの ことば・アプリの リンク・ことばの きりかえ
setLabel(document.getElementById('run'), '▶', t('run'));
setLabel(document.getElementById('reset'), '↺', t('reset'));
setLabel(document.getElementById('answerBtn'), '📖', t('answer'));
buildNav(document.getElementById('nav'));
applyI18n(t);

setLevel(Math.min(Number(store.get('-level')) || 0, LEVELS.length - 1));

// つぎの ひとへ：ぜんぶの ステージの ブロック・クリアきろく・ランダムめいろを けして ステージ1へ
function resetForNextPerson() {
  try {
    Object.keys(localStorage)
      .filter((k) => k.startsWith(SAVE_KEY + '-ws-') || [SAVE_KEY + '-cleared', SAVE_KEY + '-level', SAVE_KEY + '-random'].includes(k))
      .forEach((k) => localStorage.removeItem(k));
  } catch (_) {}
  cleared = [];
  Certificate.clearName();
  loading = true; workspace.clear(); loading = false;
  setLevel(0);
  workspace.scrollCenter && workspace.scrollCenter();
  msg.className = 'ok';
  msg.textContent = t('resetDone');
}

// ⚙ きのう メニュー：おと・ことば・つぎの ひとへ（リセット）
let resetArmed = null;
const fnMenu = FnMenu(document.getElementById('fnBtn'), [
  { icon: () => Sound.muted ? '🔇' : '🔊',
    label: () => Sound.muted ? t('soundOff') : t('soundOn'),
    onClick: (m) => { Sound.unlock(); Sound.toggle(); m.render(); if (!Sound.muted) Sound.turnRight(); } },
  langMenuItem(),
  nightMenuItem(),
  calmMenuItem(),
  { icon: () => '📜', label: () => t('certItem'), visible: allStagesCleared,
    onClick: (m) => { m.close(); showCertificate(false); } },
  { icon: () => resetArmed ? '⚠' : '🔄',
    label: () => resetArmed ? t('armedItem') : t('nextPerson'),
    warn: () => !!resetArmed,
    onClick: (m) => {
      if (!resetArmed) {   // 2かい おして かくにん（まちがえて けさないように）
        msg.className = 'ng'; msg.textContent = t('armedMsg');
        resetArmed = setTimeout(() => { resetArmed = null; m.render(); }, 4000);
        m.render();
        return;
      }
      clearTimeout(resetArmed); resetArmed = null;
      m.close();
      resetForNextPerson();
    } }
]);


// 先生モード：URL の さいごに ?sensei を つけると「こたえ」ボタンが でる
const answerBtn = document.getElementById('answerBtn');
if (new URLSearchParams(location.search).has('sensei')) answerBtn.style.display = '';
answerBtn.addEventListener('click', () => {
  resetRobot();
  workspace.clear();
  Blockly.serialization.workspaces.load(LEVELS[levelIndex].answer, workspace);
  msg.className = ''; msg.textContent = t('answerLoaded');
});
