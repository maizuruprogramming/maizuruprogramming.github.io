<!DOCTYPE html>

<!-- Blockly 本体・標準ブロック・JavaScript変換（CDN） -->
<script src="https://unpkg.com/blockly@11/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@11/blocks_compressed.js"></script>

</head>
<body>
<header>

</header>
<main>

    </div>

    <div id="info"></div>

</main>

</div>

  en: {

    dlgTitle: '🎉 Stage clear!', dlgQuestion: 'Go to the next stage?', yes: 'Yes', no: 'No',
    kindB: 'a stone block', kindW: 'water', kindO: 'an open path',

    bMine: '⛏ break the block in front', bPlace: '🧱 place a block in front',
    bUntilGoal: 'repeat until goal', bIf: 'if the front is %1', bElse: 'else %1',
    inv: (n) => `Blocks you have: ${n}`,
    tooManyMoves: (n) => `Too many moves (max ${n})`, endless: 'The loop never ends!',
    bumpBlock: '💥 You bumped into a stone block! Break it with ⛏.', bumpWall: '💥 You bumped into a wall!',
    splash: '💦 Splash! You fell in the water. Place a block to make a bridge.',
    mineNothing: '⛏ There is no block to break in front of you.', mineBedrock: '⛏ This rock is too hard to break!',

    noGoal: "You didn't reach the goal.", limit: (n) => `🎯 Target: clear with ${n} blocks or fewer`,
    used: (n) => `Blocks used: ${n}`, moves: (n) => ` / Moves: ${n}`,
    freeGoal: '🎉 Treasure found! Try another world with 🎲',
    overLimit: (n, lim) => `Goal! But you used ${n} blocks. Can you do it with ${lim} or fewer?`,
    stageClear: '🎉 Treasure found! Stage clear!', retry: 'Try again! Fix your blocks and press ▶ Run.',
    armedItem: 'Tap again to reset', armedMsg: '⚠ Tap "Next player" again to reset everything.',
    certItem: 'View certificate', resetDone: '✨ All reset. Good luck, next player!', answerLoaded: '📖 Answer loaded. Press ▶ Run to check it.',
    noAnswer: 'Free mode has no answer.'
  }
};
const t = makeT(STR);
const L = (item, k) => (LANG === 'en' && item.en && item.en[k] !== undefined) ? item.en[k] : item[k];

if (LANG === 'ja') Object.assign(Blockly.Msg, { CONTROLS_REPEAT_TITLE: '%1 かい くりかえす', CONTROLS_REPEAT_INPUT_DO: '' });
else Object.assign(Blockly.Msg, { CONTROLS_REPEAT_INPUT_DO: '' });

/* ========== 1. オリジナルのブロック ========== */
const KINDS = [[t('kindB'), 'B'], [t('kindW'), 'W'], [t('kindO'), 'O']];
const COL = { move: '#4f8f2f', tool: '#a0662a', loop: '#8b5a2b', iff: '#3c5aa6' };

Blockly.common.defineBlocksWithJsonArray([
  { type: 'cr_forward', message0: t('bForward'), previousStatement: null, nextStatement: null, colour: COL.move },
  { type: 'cr_right', message0: t('bRight'), previousStatement: null, nextStatement: null, colour: COL.move },
  { type: 'cr_left', message0: t('bLeft'), previousStatement: null, nextStatement: null, colour: COL.move },
  { type: 'cr_mine', message0: t('bMine'), previousStatement: null, nextStatement: null, colour: COL.tool },
  { type: 'cr_place', message0: t('bPlace'), previousStatement: null, nextStatement: null, colour: COL.tool },
  { type: 'cr_until_goal', message0: t('bUntilGoal'),
    message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
    previousStatement: null, nextStatement: null, colour: COL.loop },
  { type: 'cr_if', message0: t('bIf'), args0: [{ type: 'field_dropdown', name: 'KIND', options: KINDS }],
    message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
    previousStatement: null, nextStatement: null, colour: COL.iff },
  { type: 'cr_ifelse', message0: t('bIf'), args0: [{ type: 'field_dropdown', name: 'KIND', options: KINDS }],
    message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
    message2: t('bElse'), args2: [{ type: 'input_statement', name: 'ELSE' }],
    previousStatement: null, nextStatement: null, colour: COL.iff }
]);

/* ========== 2. ブロック → JavaScript ========== */
const gen = javascript.javascriptGenerator;
gen.STATEMENT_PREFIX = 'highlight(%1);\n';   // いま うごいている ブロックを光らせる
gen.addReservedWords('highlight');
gen.forBlock['cr_forward'] = () => 'forward();\n';
gen.forBlock['cr_right']   = () => 'turnRight();\n';
gen.forBlock['cr_left']    = () => 'turnLeft();\n';
gen.forBlock['cr_mine']    = () => 'mine();\n';
gen.forBlock['cr_place']   = () => 'place();\n';
gen.forBlock['cr_until_goal'] = (b, g) => `while (!atGoal()) {\n  loopGuard();\n${g.statementToCode(b, 'DO')}}\n`;
gen.forBlock['cr_if'] = (b, g) => `if (frontIs('${b.getFieldValue('KIND')}')) {\n${g.statementToCode(b, 'DO')}}\n`;
gen.forBlock['cr_ifelse'] = (b, g) =>
  `if (frontIs('${b.getFieldValue('KIND')}')) {\n${g.statementToCode(b, 'DO')}} else {\n${g.statementToCode(b, 'ELSE')}}\n`;

/* ========== 3. ステージ ==========
   map の きごう：S=スタート  G=ゴール（たからばこ）  .=くさ  #=いしブロック（こわせる）
                 X=かたい いわ（こわせない）  ~=みず（ブロックを おくと はしに なる）
   dir（さいしょの むき）：0=うえ 1=みぎ 2=した 3=ひだり   inv：さいしょに もっている ブロック */
const MOVE = ['cr_forward', 'cr_right', 'cr_left'];
const TOOLS = ['cr_mine', 'cr_place'];
const ALL = [...MOVE, ...TOOLS, 'controls_repeat_ext', 'cr_until_goal', 'cr_if', 'cr_ifelse'];

const LEVELS = [
  { title: 'ステージ1　こわして すすもう',
    en: { title: 'Stage 1: Break and go', text: 'A stone block is in the way. Break it with "⛏ break the block in front", then go to the treasure chest!', hint: 'Forward 1 → break → forward 3' },
    text: 'いしブロックが じゃまを しているよ。「⛏ まえの ブロックを こわす」で こわして、たからばこまで すすもう！',
    hint: '1マス すすむ → こわす → 3マス すすむ',
    map: ['XXXXX', 'XXXXX', 'S.#.G', 'XXXXX', 'XXXXX'], dir: 1, inv: 0, blocks: ['cr_forward', 'cr_mine'] },
  { title: 'ステージ2　はしを かけよう',
    en: { title: 'Stage 2: Build a bridge', text: 'There is water ahead. You need a block to make a bridge. Break the stone first — then you will have a block!', hint: 'Break → forward → place → forward 3' },
    text: 'みずが あるよ。はしを つくるには ブロックが ひつよう。まず いしを こわすと、ブロックが 1こ もてるよ！',
    hint: 'こわす → すすむ → おく → 3マス すすむ',
    map: ['XXXXX', 'XXXXX', 'S#~.G', 'XXXXX', 'XXXXX'], dir: 1, inv: 0, blocks: ['cr_forward', ...TOOLS] },
  { title: 'ステージ3　くりかえして こわそう',
    en: { title: 'Stage 3: Break with a loop', text: 'Stone blocks in a row! Put "break → move" into a loop.', hint: '"repeat 3 (break → move forward)" → "move forward"' },
    text: 'いしブロックが ならんでいるよ。「こわす → すすむ」を くりかえしで まとめよう。',
    hint: '「3かい くりかえす（こわす → すすむ）」→「すすむ」',
    map: ['XXXXX', 'XXXXX', 'S###G', 'XXXXX', 'XXXXX'], dir: 1, inv: 0, blocks: [...MOVE, ...TOOLS, 'controls_repeat_ext'], limit: 4 },
  { title: 'ステージ4　ながい はし',
    en: { title: 'Stage 4: A long bridge', text: 'You have 3 blocks. Make a long bridge over the river.', hint: '"repeat 3 (place → move forward)" → "move forward"' },
    text: 'ブロックを 3こ もっているよ。かわに ながい はしを つくろう。',
    hint: '「3かい くりかえす（おく → すすむ）」→「すすむ」',
    map: ['XXXXX', 'XXXXX', 'S~~~G', 'XXXXX', 'XXXXX'], dir: 1, inv: 3, blocks: [...MOVE, ...TOOLS, 'controls_repeat_ext'], limit: 4 },
  { title: 'ステージ5　もし いしが あったら',
    en: { title: 'Stage 5: If there is stone', text: 'Some squares have stone and some don\'t. Breaking where there is no stone is a mistake! Use "if" to check first.', hint: '"repeat 4: if the front is a stone block, break it → move forward"' },
    text: 'いしが ある ところと ない ところが あるよ。ない ところで こわそうと すると しっぱい！「もし」で しらべよう。',
    hint: '「4かい くりかえす：もし まえが いしブロック だったら こわす → すすむ」',
    map: ['XXXXX', 'XXXXX', 'S#.#G', 'XXXXX', 'XXXXX'], dir: 1, inv: 0, blocks: [...MOVE, ...TOOLS, 'controls_repeat_ext', 'cr_if'], limit: 4 },
  { title: 'ステージ6　いしと みず',
    en: { title: 'Stage 6: Stone and water', text: 'Stone and water are mixed. Break stone, bridge water. Breaking stone gives you a block, and placing one uses it up. Watch how many you have!', hint: 'Repeat 4 times: if stone → break / if water → place / move forward' },
    text: 'いしと みずが まざっているよ。いしは こわす、みずには おく。こわすと ブロックが ふえて、おくと へるよ。もっている かずに ちゅうい！',
    hint: '4かい くりかえす：もし いしなら こわす ／ もし みずなら おく ／ すすむ',
    map: ['XXXXX', 'XXXXX', 'S#~#G', 'XXXXX', 'XXXXX'], dir: 1, inv: 0, blocks: [...MOVE, ...TOOLS, 'controls_repeat_ext', 'cr_if'], limit: 6 },
  { title: 'ステージ7　うずまきの どうくつ',
    en: { title: 'Stage 7: Spiral cave', text: 'A spiral cave full of stone and water. Use "repeat until goal" and decide what to do by checking the front.', hint: 'Inside the loop: if stone → break / if water → place / if the front is an open path → move, else turn right' },
    text: 'いしと みずの ある うずまきの どうくつ。「ゴールに つくまで くりかえす」で、まえを しらべながら すすもう。',
    hint: 'くりかえしの なかで：もし いしなら こわす ／ もし みずなら おく ／ もし すすめる みちなら すすむ、そうでなければ みぎを むく',
    map: ['S.#~.', 'XXXX.', '.~GX#', '#XXX.', '..~..'], dir: 1, inv: 0,
    blocks: [...MOVE, ...TOOLS, 'cr_until_goal', 'cr_if', 'cr_ifelse'], limit: 8 },
  { title: 'じゆうモード　ランダムせかい',
    en: { title: 'Free mode: Random world', text: 'Play freely in random worlds. 🎲 makes a new world. You start with as many blocks as there are water squares.', hint: '' },
    text: 'ランダムな せかいで じゆうに あそぼう。🎲で あたらしい せかいが でるよ。みずの かずだけ ブロックを もって スタート！',
    hint: '', mode: 'free', blocks: ALL }
];

/* ---------- ステージの こたえ（先生モード ?sensei で よみこめる） ---------- */
{
  const chain = (list) => list.reduceRight((next, b) => next ? { ...b, next: { block: next } } : b, null);
  const f = () => ({ type: 'cr_forward' }), r = () => ({ type: 'cr_right' });
  const m = () => ({ type: 'cr_mine' }), p = () => ({ type: 'cr_place' });
  const repeat = (n, body) => ({ type: 'controls_repeat_ext',
    inputs: { TIMES: { shadow: { type: 'math_number', fields: { NUM: n } } }, DO: { block: chain(body) } } });
  const iff = (k, body) => ({ type: 'cr_if', fields: { KIND: k }, inputs: { DO: { block: chain(body) } } });
  const ifElse = (k, yes, no) => ({ type: 'cr_ifelse', fields: { KIND: k }, inputs: { DO: { block: chain(yes) }, ELSE: { block: chain(no) } } });
  const until = (body) => ({ type: 'cr_until_goal', inputs: { DO: { block: chain(body) } } });
  const program = (body) => ({ blocks: { languageVersion: 0, blocks: [{ ...chain(body), x: 30, y: 30 }] } });
  const ANSWERS = [
    program([f(), m(), f(), f(), f()]),
    program([m(), f(), p(), f(), f(), f()]),
    program([repeat(3, [m(), f()]), f()]),
    program([repeat(3, [p(), f()]), f()]),
    program([repeat(4, [iff('B', [m()]), f()])]),
    program([repeat(4, [iff('B', [m()]), iff('W', [p()]), f()])]),
    program([until([iff('B', [m()]), iff('W', [p()]), ifElse('O', [f()], [r()])])]),
    null
  ];
  LEVELS.forEach((lv, i) => { lv.answer = ANSWERS[i]; });
}

/* ========== 4. ワークスペース ========== */
const flyout = (types) => ({
  kind: 'flyoutToolbox',
  contents: types.map((tp) => tp === 'controls_repeat_ext'
    ? { kind: 'block', type: tp, inputs: { TIMES: { shadow: { type: 'math_number', fields: { NUM: 3 } } } } }
    : { kind: 'block', type: tp })
});

const craftTheme = Blockly.Theme.defineTheme('craft2', {
  base: Blockly.Themes.Classic,
  blockStyles: {
    loop_blocks: { colourPrimary: COL.loop, colourSecondary: '#a8743f', colourTertiary: '#5e3b1a' },
    math_blocks: { colourPrimary: '#6b6b6b', colourSecondary: '#8a8a8a', colourTertiary: '#444444' }
  },
  componentStyles: {
    workspaceBackgroundColour: '#3b3b42', toolboxBackgroundColour: '#5a5a5a', flyoutBackgroundColour: '#6e6e6e',
    flyoutOpacity: 1, scrollbarColour: '#c6c6c6', insertionMarkerColour: '#ffff55'
  },
  fontStyle: { family: 'DotGothic16, monospace', size: 12 }
});

const workspace = Blockly.inject('blocklyDiv', {
  toolbox: flyout(ALL), renderer: 'geras', theme: craftTheme, trashcan: true,
  grid: { spacing: 24, length: 24, colour: '#34343a', snap: true },
  zoom: { controls: true, wheel: true, startScale: 1.0 },
  move: { scrollbars: true, drag: true, wheel: false }
});

const SAVE_KEY = 'block-craft';
const store = {
  get(k)    { try { return JSON.parse(localStorage.getItem(SAVE_KEY + k)); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(SAVE_KEY + k, JSON.stringify(v)); } catch (_) {} }
};

let levelIndex = 0, loading = false;
workspace.addChangeListener((e) => {
  if (e.isUiEvent || loading) return;
  store.set('-ws-' + levelIndex, Blockly.serialization.workspaces.save(workspace));
  updateInfo();
});

/* ========== 5. せかい（マスの しゅるい） ========== */
const N = 5, CELL = 80;
const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];   // 0:うえ 1:みぎ 2:した 3:ひだり
// マス：'.'くさ 'd'つち（こわした あと） 'b'はし '#'いし 'X'かたい いわ '~'みず 'S' 'G'
let world = [], START = { r: 0, c: 0, dir: 1 }, GOAL = { r: 4, c: 4 }, START_INV = 0;
const WALK = new Set(['.', 'd', 'b', 'S', 'G']);

function loadMap(map, dir, inv) {
  world = map.map((row, r) => [...row].map((ch, c) => {
    if (ch === 'S') START = { r, c, dir };
    if (ch === 'G') GOAL = { r, c };
    return ch;
  }));
  START_INV = inv || 0;
}

// ランダムな せかい：みち・いし・みずを つかえば かならず ゴールに いける
function randomWorld() {
  for (;;) {
    const w = Array.from({ length: N }, () => Array(N).fill('.'));
    w[0][0] = 'S'; w[N - 1][N - 1] = 'G';
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (r + c > 1 && !(r === N - 1 && c === N - 1)) cells.push([r, c]);
    const put = (ch, k) => { for (let i = 0; i < k; i++) { const [r, c] = cells.splice(Math.floor(Math.random() * cells.length), 1)[0]; w[r][c] = ch; } };
    put('X', 5); put('#', 4); put('~', 3);
    // いし・みずも とおれる として ゴールまで いけるか
    const seen = new Set(['0,0']); const q = [[0, 0]]; let ok = false;
    while (q.length) {
      const [r, c] = q.shift();
      if (r === N - 1 && c === N - 1) { ok = true; break; }
      for (let d = 0; d < 4; d++) {
        const nr = r + DR[d], nc = c + DC[d];
        if (nr < 0 || nc < 0 || nr >= N || nc >= N || w[nr][nc] === 'X' || seen.has(nr + ',' + nc)) continue;
        seen.add(nr + ',' + nc); q.push([nr, nc]);
      }
    }
    if (ok) return { map: w.map((row) => row.join('')), inv: 3 };
  }
}

/* ========== 6. プログラムを しらべて、うごきの きろくを つくる ========== */
const MAX_MOVES = 300, MAX_LOOPS = 2000;
class Stop { constructor(kind, text, why) { this.kind = kind; this.text = text; this.why = why; } }

function simulate(code) {
  const s = { ...START }, w = world.map((row) => row.slice());
  let inv = START_INV, blockId = null, loops = 0;
  const frames = [];
  const inside = (r, c) => r >= 0 && c >= 0 && r < N && c < N;
  const front = () => ({ r: s.r + DR[s.dir], c: s.c + DC[s.dir] });
  const atGoal = () => s.r === GOAL.r && s.c === GOAL.c;
  const rec = (event, extra) => {
    frames.push({ r: s.r, c: s.c, dir: s.dir, inv, id: blockId, event, ...extra });
    if (frames.length > MAX_MOVES) throw new Stop('ng', t('tooManyMoves', MAX_MOVES));
  };
  const api = {
    highlight: (id) => { blockId = id; },
    forward: () => {
      const { r, c } = front();
      const ch = inside(r, c) ? w[r][c] : 'X';
      if (ch === '#') { rec('crash'); throw new Stop('ng', t('bumpBlock'), 'crash'); }
      if (ch === '~') { s.r = r; s.c = c; rec('splash'); throw new Stop('ng', t('splash'), 'crash'); }
      if (!WALK.has(ch)) { rec('crash'); throw new Stop('ng', t('bumpWall'), 'crash'); }
      s.r = r; s.c = c; rec('move');
      if (atGoal()) throw new Stop('ok', 'goal');
    },
    turnRight: () => { s.dir = (s.dir + 1) % 4; rec('turn'); },
    turnLeft:  () => { s.dir = (s.dir + 3) % 4; rec('turn'); },
    mine: () => {
      const { r, c } = front();
      const ch = inside(r, c) ? w[r][c] : '';
      if (ch === 'X') { rec('miss'); throw new Stop('ng', t('mineBedrock'), 'miss'); }
      if (ch !== '#') { rec('miss'); throw new Stop('ng', t('mineNothing'), 'miss'); }
      w[r][c] = 'd'; inv++; rec('mine', { tr: r, tc: c, tile: 'd' });
    },
    place: () => {
      const { r, c } = front();
      const ch = inside(r, c) ? w[r][c] : '';
      if (inv <= 0) { rec('miss'); throw new Stop('ng', t('noBlocks'), 'miss'); }
      if (ch === '~') { w[r][c] = 'b'; inv--; rec('place', { tr: r, tc: c, tile: 'b' }); return; }
      if (ch === '.' || ch === 'd') { w[r][c] = '#'; inv--; rec('place', { tr: r, tc: c, tile: '#' }); return; }
      rec('miss'); throw new Stop('ng', t('cantPlace'), 'miss');
    },
    frontIs: (k) => {
      const { r, c } = front();
      if (!inside(r, c)) return false;
      const ch = w[r][c];
      return k === 'B' ? ch === '#' : k === 'W' ? ch === '~' : WALK.has(ch);
    },
    atGoal,
    loopGuard: () => { if (++loops > MAX_LOOPS) throw new Stop('ng', t('endless')); }
  };
  let result;
  try {
    new Function(...Object.keys(api), code)(...Object.values(api));
    result = atGoal() ? new Stop('ok', 'goal') : new Stop('ng', t('noGoal'));
  } catch (e) {
    result = e instanceof Stop ? e : new Stop('ng', '⚠ ' + e.message);
  }
  return { frames, result };
}

/* ========== 7. えを かく（ドット絵） ========== */
const ctx = document.getElementById('board').getContext('2d');
ctx.imageSmoothingEnabled = false;
const PX = CELL / 16;
let shown = [], robot = { ...START }, invShown = 0, crashed = false, splashed = false, opened = false, timer = null, tick = 0, burst = null;

function rand(r, c, i) {
  let h = (r * 73856093) ^ (c * 19349663) ^ (i * 83492791);
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function dotOn(g, x, y, px, py, color, size = PX) { g.fillStyle = color; g.fillRect(x + px * size, y + py * size, size, size); }
function dot(x, y, px, py, color) { dotOn(ctx, x, y, px, py, color); }
function noiseTile(x, y, r, c, salt, colors) {
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++)
    dot(x, y, px, py, colors[Math.floor(rand(r * 16 + py, c * 16 + px, salt) * colors.length)]);
}
function grassTile(x, y, r, c) {
  noiseTile(x, y, r, c, 1, ['#5fa83a', '#5fa83a', '#58a034', '#6cbb45', '#4e9a2f']);
  for (let k = 0; k < 4; k++) dot(x, y, Math.floor(rand(r, c, 10 + k) * 16), Math.floor(rand(r, c, 20 + k) * 16), '#7fd055');
}
function dirtTile(x, y, r, c) { noiseTile(x, y, r, c, 2, ['#8b5a2b', '#7a4e25', '#966434', '#8b5a2b', '#6e4520']); }
// いしブロック（こわせる）：まるい いしを ならべた もよう
const STONES = [[1, 1, 6, 5], [8, 0, 7, 4], [0, 7, 4, 4], [5, 6, 6, 5], [12, 5, 4, 6], [1, 12, 7, 4], [9, 12, 6, 4]];
function stonePattern(g, x, y, r, c, size = PX) {
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++)
    dotOn(g, x, y, px, py, ['#7f7f7f', '#8a8a8a', '#757575', '#828282'][Math.floor(rand(r * 16 + py, c * 16 + px, 3) * 4)], size);
  for (const [sx, sy, w, h] of STONES) {
    for (let i = 0; i < w; i++) { dotOn(g, x, y, sx + i, sy + h - 1, '#555555', size); dotOn(g, x, y, sx + i, sy, '#a5a5a5', size); }
    for (let j = 0; j < h; j++) dotOn(g, x, y, sx + w - 1, sy + j, '#555555', size);
  }
}
function stoneTile(x, y, r, c) {
  stonePattern(ctx, x, y, r, c);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x, y + CELL - PX * 2, CELL, PX * 2);
}
// かたい いわ（こわせない）：くろっぽく、ごつごつ
function bedrockTile(x, y, r, c) {
  noiseTile(x, y, r, c, 5, ['#2b2b2b', '#3d3d3d', '#1f1f1f', '#4a4a4a', '#333']);
  for (let k = 0; k < 6; k++) dot(x, y, Math.floor(rand(r, c, 30 + k) * 16), Math.floor(rand(r, c, 40 + k) * 16), '#666');
}
// みず（ゆらゆら）
function waterTile(x, y, r, c) {
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++) {
    const wave = Math.sin((px + py * 0.6 + tick / 4 + c * 3) / 2.2);
    dot(x, y, px, py, wave > 0.6 ? '#5aa0ff' : wave > -0.2 ? '#3a78e0' : '#2d62c4');
  }
}
// はし（いたの はし）
function bridgeTile(x, y, r, c) {
  waterTile(x, y, r, c);
  for (let py = 1; py < 15; py++) for (let px = 0; px < 16; px++) {
    const plank = Math.floor((py - 1) / 3.5);
    dot(x, y, px, py, (py - 1) % 4 === 3 ? '#6b4a22' : ['#b8945f', '#ae8a55', '#c19d68', '#a8854f'][plank % 4]);
  }
  for (let px of [1, 14]) for (let py = 1; py < 15; py++) dot(x, y, px, py, '#5a3d1a');
}
// スタート
function startTile(x, y, r, c) {
  dirtTile(x, y, r, c);
  for (let i = 2; i < 14; i++) { dot(x, y, i, 2, '#d8c27a'); dot(x, y, i, 13, '#d8c27a'); dot(x, y, 2, i, '#d8c27a'); dot(x, y, 13, i, '#d8c27a'); }
}
// ゴール：たからばこ
function chestTile(x, y, r, c, open) {
  grassTile(x, y, r, c);
  const B = '#7a4a1a', M = '#a8682a', L = '#c98a3a', K = '#2a1a0a', Y = '#ffd84a';
  for (let py = 4; py < 14; py++) for (let px = 2; px < 14; px++) {
    let col = M;
    if (px === 2 || px === 13 || py === 13) col = K;
    else if (py === 4) col = K;
    else if (py === 8 && !open) col = K;
    else if (py < 8) col = open ? '#3a240e' : L;
    dot(x, y, px, py, col);
  }
  if (open) { for (let px = 3; px < 13; px++) dot(x, y, px, 5, Y); dot(x, y, 6, 6, '#4ee8e0'); dot(x, y, 9, 6, '#4ee8e0'); }
  else { dot(x, y, 7, 8, Y); dot(x, y, 8, 8, Y); dot(x, y, 7, 9, Y); dot(x, y, 8, 9, Y); }
}

const HERO = [
  '................', '................', '......LLLL......', '....hhLLLLhh....',
  '....hHHHHHHh....', '....hHHHHHHh....', '....hHHHHHHh....', '..BBhHHHHHHhBB..',
  '.SBBhHHHHHHhBBS.', '.SBBhhhhhhhhBBS.', '.SBBBBBBBBBBBBS.', '.SBBBBBBBBBBBBS.',
  '..BBBBBBBBBBBB..', '..bbbbbbbbbbbb..', '................', '................'];
function drawHero() {
  const cx = robot.c * CELL + CELL / 2, cy = robot.r * CELL + CELL / 2;
  const col = (crashed || splashed)
    ? { L: '#fff59d', h: '#8b0000', H: '#e53935', B: '#e53935', b: '#8b0000', S: '#e0b48a' }
    : { L: '#fff59d', h: '#c66a00', H: '#ff9800', B: '#3f8fd2', b: '#2c6aa0', S: '#e0b48a' };
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(robot.dir * Math.PI / 2);
  ctx.fillStyle = 'rgba(255,245,157,.45)';
  ctx.beginPath(); ctx.moveTo(-PX * 2, -PX * 6); ctx.lineTo(PX * 2, -PX * 6);
  ctx.lineTo(PX * 5, -CELL * 0.75); ctx.lineTo(-PX * 5, -CELL * 0.75); ctx.fill();
  // つるはし（みぎて）
  ctx.fillStyle = '#7a5a30'; ctx.fillRect(PX * 5, -PX * 6, PX, PX * 6);
  ctx.fillStyle = '#9adfe0'; ctx.fillRect(PX * 3, -PX * 7, PX * 5, PX);
  HERO.forEach((row, py) => [...row].forEach((ch, px) => {
    if (col[ch]) { ctx.fillStyle = col[ch]; ctx.fillRect((px - 8) * PX, (py - 8) * PX, PX, PX); }
  }));
  ctx.restore();
}

function draw() {
  tick++;
  ctx.clearRect(0, 0, 400, 400);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = c * CELL, y = r * CELL, ch = shown[r][c];
    if (ch === '#') stoneTile(x, y, r, c);
    else if (ch === 'X') bedrockTile(x, y, r, c);
    else if (ch === '~') waterTile(x, y, r, c);
    else if (ch === 'b') bridgeTile(x, y, r, c);
    else if (ch === 'd') dirtTile(x, y, r, c);
    else if (ch === 'S') startTile(x, y, r, c);
    else if (ch === 'G') chestTile(x, y, r, c, opened);
    else grassTile(x, y, r, c);
  }
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(400, i * CELL + .5); ctx.stroke();
  }
  // こわした ときの かけら
  if (burst && burst.t-- > 0) {
    for (const p of burst.p) { p.x += p.vx; p.y += p.vy; p.vy += 0.6; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, PX * 1.5, PX * 1.5); }
  }
  if (!splashed) drawHero();
  else { ctx.fillStyle = 'rgba(255,255,255,.8)'; for (let k = 0; k < 6; k++) ctx.fillRect(robot.c * CELL + 20 + k * 8, robot.r * CELL + 30 + (k % 2) * 10, PX * 1.5, PX * 1.5); }
  document.getElementById('invText').textContent = t('inv', invShown);
}
function makeBurst(r, c, colors) {
  const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
  burst = { t: 14, p: Array.from({ length: 14 }, () => ({ x, y, vx: (Math.random() - .5) * 9, vy: -Math.random() * 7, col: colors[Math.floor(Math.random() * colors.length)] })) };
}
// もちものの アイコン（いしブロック）
stonePattern(document.getElementById('invIcon').getContext('2d'), 0, 0, 0, 0, 1);
// みずの ゆらゆらを うごかす
setInterval(() => { if (!timer) draw(); }, 120);

/* ========== 8. 効果音（Web Audio で その場で つくる） ========== */
const Sound = {
  ctx: null, master: null, muted: !!store.get('-muted'), foot: 0,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.25; this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(type, f1, f2, len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const tt = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, tt);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, tt + len);
    g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + len);
    o.connect(g); g.connect(this.master); o.start(tt); o.stop(tt + len + 0.02);
  },
  noise(len, delay = 0, vol = 1, freq = 900, type = 'lowpass') {
    if (this.muted || !this.ctx) return;
    const tt = this.ctx.currentTime + delay;
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * len), this.ctx.sampleRate);
    const d = buf.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + len);
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(this.master); src.start(tt);
  },
  notes(list, type = 'square', vol = 0.6) { for (const [fq, at, len] of list) this.tone(type, fq, fq, len, at, vol); },
  step()      { this.foot ^= 1; this.noise(0.07, 0, 0.5); this.tone('square', this.foot ? 330 : 294, this.foot ? 220 : 196, 0.07, 0, 0.35); },
  turnRight() { this.tone('triangle', 520, 880, 0.12, 0, 0.7); },
  turnLeft()  { this.tone('triangle', 880, 520, 0.12, 0, 0.7); },
  mine()      { this.noise(0.06, 0, 0.9, 3000, 'bandpass'); this.noise(0.06, 0.09, 0.9, 2500, 'bandpass'); this.noise(0.25, 0.18, 0.8, 700); this.tone('square', 900, 1300, 0.08, 0.2, 0.3); },   // カッ カッ ガラッ
  place()     { this.noise(0.12, 0, 0.9, 500); this.tone('square', 160, 110, 0.12, 0, 0.6); },   // ゴトッ
  splash()    { this.noise(0.6, 0, 0.9, 1800, 'bandpass'); this.tone('sine', 600, 200, 0.4, 0, 0.5); },
  miss()      { this.tone('square', 200, 150, 0.25, 0, 0.6); },
  crash()     { this.noise(0.35, 0, 1); this.tone('square', 140, 50, 0.35, 0, 0.8); },
  chest()     { this.notes([[784, 0, .1], [988, .1, .1], [1175, .2, .1], [1568, .3, .35]], 'square', 0.5); },
  clear()     { this.notes([[523, .6, .12], [659, .72, .12], [784, .84, .12], [1047, .96, .45]]); this.notes([[392, .96, .45], [659, .96, .45]], 'triangle', 0.5); },
  goalSoSo()  { this.notes([[784, .6, .12], [1047, .74, .25]]); },
  fail()      { this.notes([[392, 0, .16], [330, .18, .16], [262, .36, .35]], 'square', 0.5); },
  toggle() { this.muted = !this.muted; store.set('-muted', this.muted); return this.muted; }
};

/* ========== 9. ステージの きりかえ ========== */
const msg = document.getElementById('msg');
const levelSelect = document.getElementById('levelSelect');
const clearDialog = document.getElementById('clearDialog');
let cleared = store.get('-cleared') || [];

function refreshLevelList() {
  levelSelect.innerHTML = '';
  LEVELS.forEach((lv, i) => levelSelect.add(new Option((cleared[i] ? '✅ ' : '') + L(lv, 'title'), i)));
  levelSelect.value = levelIndex;
}

function setRandomWorld(rw) {
  store.set('-random', rw);
  loadMap(rw.map, 1, rw.inv);
  resetRobot();
}

function setLevel(i) {
  levelIndex = i;
  const lv = LEVELS[i];
  store.set('-level', i);
  refreshLevelList();
  document.getElementById('lessonText').textContent = L(lv, 'text');
  document.getElementById('limitText').textContent = lv.limit ? t('limit', lv.limit) : '';
  const hint = document.getElementById('hintText');
  hint.textContent = L(lv, 'hint'); hint.style.display = 'none';
  document.getElementById('hintBtn').style.display = L(lv, 'hint') ? '' : 'none';
  document.getElementById('randomRow').style.display = lv.mode ? 'flex' : 'none';

  loading = true;
  workspace.updateToolbox(flyout(lv.blocks));
  workspace.clear();
  const saved = store.get('-ws-' + i);
  if (saved) { try { Blockly.serialization.workspaces.load(saved, workspace); } catch (_) {} }
  loading = false;

  if (lv.mode) {
    const rw = store.get('-random');
    setRandomWorld(rw && Array.isArray(rw.map) && rw.map.length === N ? rw : randomWorld());
  } else {
    loadMap(lv.map, lv.dir, lv.inv);
    resetRobot();
  }
  updateInfo();
}

function showClearDialog() {
  const next = LEVELS[levelIndex + 1];
  document.getElementById('dlgQuestion').innerHTML =
    `${t('dlgQuestion')}<br><span style="font-size:15px">${LANG === 'en' ? '(' : '（'}${L(next, 'title')}${LANG === 'en' ? ')' : '）'}</span>`;
  clearDialog.classList.add('show');
  document.getElementById('dlgYes').focus();
}
let dialogTimer = null;
function hideClearDialog() { clearTimeout(dialogTimer); dialogTimer = null; clearDialog.classList.remove('show'); }

// ぜんぶの ステージ（じゆうモード いがい）を クリアしたか
function allStagesCleared() { return LEVELS.every((lv, i) => lv.mode === 'free' || cleared[i]); }

// 📜 しゅうりょうしょう（とじたら、つぎの ステージの かくにんを だす）
function showCertificate(thenNext) {
  Certificate.show({ app: t('appTitle'), icons: ['🧱', '⛏'],
    onClose: thenNext && levelIndex < LEVELS.length - 1 ? showClearDialog : null });
}

function markCleared() {
  const wasAll = allStagesCleared();
  cleared[levelIndex] = true;
  store.set('-cleared', cleared);
  refreshLevelList();
  if (!wasAll && allStagesCleared()) {   // いま ぜんぶ クリアに なった！
    dialogTimer = setTimeout(() => showCertificate(true), 1400);
    return;
  }
  if (levelIndex < LEVELS.length - 1) dialogTimer = setTimeout(showClearDialog, 1400);
}

/* ========== 10. じっこう ========== */
function resetRobot() {
  if (timer) clearTimeout(timer);
  timer = null;
  shown = world.map((row) => row.slice());
  robot = { ...START }; invShown = START_INV; crashed = false; splashed = false; opened = false; burst = null;
  msg.textContent = ''; msg.className = '';
  hideClearDialog();
  workspace.highlightBlock(null);
  draw();
}

function blockCount() { return workspace.getAllBlocks(false).filter((b) => !b.isShadow()).length; }
function updateInfo(moves) {
  document.getElementById('info').textContent = t('used', blockCount()) + (moves != null ? t('moves', moves) : '');
}

function finish(result, moves) {
  const lv = LEVELS[levelIndex];
  updateInfo(moves);
  if (result.kind !== 'ok') {
    msg.className = 'ng'; msg.textContent = result.text;
    if (result.why !== 'crash' && result.why !== 'miss') Sound.fail();
    return;
  }
  opened = true; draw(); Sound.chest();
  msg.className = 'ok';
  const n = blockCount();
  if (lv.mode === 'free') { msg.textContent = t('freeGoal'); Sound.clear(); }
  else if (lv.limit && n > lv.limit) { msg.textContent = t('overLimit', n, lv.limit); Sound.goalSoSo(); }
  else { msg.textContent = t('stageClear'); markCleared(); Sound.clear(); }
}

function run() {
  Sound.unlock();
  resetRobot();
  const { frames, result } = simulate(gen.workspaceToCode(workspace));
  let i = 0;
  const step = () => {
    if (i < frames.length) {
      const f = frames[i++];
      robot = { r: f.r, c: f.c, dir: f.dir }; invShown = f.inv;
      if (f.event === 'move') Sound.step();
      if (f.event === 'turn') {
        const prev = i > 1 ? frames[i - 2].dir : START.dir;
        if ((prev + 1) % 4 === f.dir) Sound.turnRight(); else Sound.turnLeft();
      }
      if (f.event === 'mine')  { shown[f.tr][f.tc] = f.tile; makeBurst(f.tr, f.tc, ['#8a8a8a', '#a5a5a5', '#555']); Sound.mine(); }
      if (f.event === 'place') { shown[f.tr][f.tc] = f.tile; makeBurst(f.tr, f.tc, f.tile === 'b' ? ['#5aa0ff', '#ffffff'] : ['#8a8a8a', '#a5a5a5']); Sound.place(); }
      if (f.event === 'miss') Sound.miss();
      if (f.event === 'crash') { crashed = true; Sound.crash(); }
      if (f.event === 'splash') { splashed = true; makeBurst(f.r, f.c, ['#5aa0ff', '#ffffff', '#9fd0ff']); Sound.splash(); }
      workspace.highlightBlock(f.id);
      draw();
      // かけらの アニメーションを すこし みせる
      if (burst && burst.t > 0) { const anim = () => { if (burst && burst.t > 0) { draw(); requestAnimationFrame(anim); } }; requestAnimationFrame(anim); }
      const speed = Number(document.getElementById('speed').value);
      timer = setTimeout(step, 650 - speed * 60);
    } else {
      timer = null;
      workspace.highlightBlock(null);
      finish(result, frames.filter((f) => f.event !== 'crash' && f.event !== 'miss' && f.event !== 'splash').length);
    }
  };
  step();
}

document.getElementById('run').addEventListener('click', run);
document.getElementById('reset').addEventListener('click', resetRobot);
document.getElementById('newMaze').addEventListener('click', () => setRandomWorld(randomWorld()));
levelSelect.addEventListener('change', () => setLevel(Number(levelSelect.value)));
document.getElementById('hintBtn').addEventListener('click', () => {
  const h = document.getElementById('hintText');
  h.style.display = h.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('dlgYes').addEventListener('click', () => { hideClearDialog(); setLevel(levelIndex + 1); });
document.getElementById('dlgNo').addEventListener('click', () => {
  hideClearDialog(); resetRobot();
  msg.className = 'ok'; msg.textContent = t('retry');
});
document.addEventListener('keydown', (e) => {
  if (clearDialog.classList.contains('show') && e.key === 'Escape') document.getElementById('dlgNo').click();
});
window.addEventListener('resize', () => Blockly.svgResize(workspace));

// ヘッダー：ボタンの ことば・アプリの リンク
setLabel(document.getElementById('run'), '▶', t('run'));
setLabel(document.getElementById('reset'), '↺', t('reset'));
setLabel(document.getElementById('answerBtn'), '📖', t('answer'));
buildNav(document.getElementById('nav'));
applyI18n(t);

setLevel(Math.min(Number(store.get('-level')) || 0, LEVELS.length - 1));

// つぎの ひとへ：ぜんぶの ステージの ブロック・クリアきろく・ランダムせかいを けして ステージ1へ
function resetForNextPerson() {
  try {
    Object.keys(localStorage)
      .filter((k) => k.startsWith(SAVE_KEY + '-ws-') || [SAVE_KEY + '-cleared', SAVE_KEY + '-level', SAVE_KEY + '-random'].includes(k))
      .forEach((k) => localStorage.removeItem(k));
  } catch (_) {}
  cleared = [];
  Certificate.clearName();
  loading = true; workspace.clear(); loading = false;
  setLevel(0);
  msg.className = 'ok'; msg.textContent = t('resetDone');
}

// ⚙ きのう メニュー：おと・ことば・つぎの ひとへ（リセット）
let resetArmed = null;
FnMenu(document.getElementById('fnBtn'), [
  { icon: () => Sound.muted ? '🔇' : '🔊',
    label: () => Sound.muted ? t('soundOff') : t('soundOn'),
    onClick: (m) => { Sound.unlock(); Sound.toggle(); m.render(); if (!Sound.muted) Sound.place(); } },
  langMenuItem(),
  nightMenuItem(),
  calmMenuItem(),
  { icon: () => '📜', label: () => t('certItem'), visible: allStagesCleared,
    onClick: (m) => { m.close(); showCertificate(false); } },
  { icon: () => resetArmed ? '⚠' : '🔄',
    label: () => resetArmed ? t('armedItem') : t('nextPerson'),
    warn: () => !!resetArmed,
    onClick: (m) => {
      if (!resetArmed) {   // 2かい おして かくにん（まちがえて けさないように）
        msg.className = 'ng'; msg.textContent = t('armedMsg');
        resetArmed = setTimeout(() => { resetArmed = null; m.render(); }, 4000);
        m.render();
        return;
      }
      clearTimeout(resetArmed); resetArmed = null;
      m.close();
      resetForNextPerson();
    } }
]);

// 先生モード：URL の さいごに ?sensei を つけると「こたえ」ボタンが でる
const answerBtn = document.getElementById('answerBtn');
if (new URLSearchParams(location.search).has('sensei')) answerBtn.style.display = '';
answerBtn.addEventListener('click', () => {
  const ans = LEVELS[levelIndex].answer;
  if (!ans) { msg.className = ''; msg.textContent = t('noAnswer'); return; }
  resetRobot(); workspace.clear();
  Blockly.serialization.workspaces.load(ans, workspace);
  msg.className = ''; msg.textContent = t('answerLoaded');
});
</script>
</body>
</html>
