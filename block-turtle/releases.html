  :root {

    --hdr-bg: linear-gradient(#8fd17a 0 10px, #4e8a3e 10px 14px, #2f3d2f 14px);

  html, body { height: auto; min-height: 100%; }
  #wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
  #note { color: #e8f2e4; text-shadow: 1px 1px 0 #000; line-height: 1.7; margin: 4px 0 14px; }
  .rel { width: auto; padding: 14px 18px; margin-bottom: 14px; }
  .rel h2 { margin: 0; font-weight: normal; font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .rel .new { background: #ffd43b; color: #222; padding: 1px 8px; border: 2px solid #000; font-size: 14px; }

  .rel ul { margin: 10px 0 0; padding-left: 1.4em; line-height: 1.75; }
  .rel li .tag { display: inline-block; min-width: 3.6em; text-align: center; font-size: 12px; padding: 0 6px; margin-right: 6px; border: 2px solid #000; color: #fff; text-shadow: 1px 1px 0 #000; vertical-align: 1px; }
  .tag.add { background: #3c8a3c; } .tag.imp { background: #3c5aa6; } .tag.fix { background: #a8743f; } .tag.doc { background: #6a4a8a; }
  .rel a { color: inherit; }
  @media print { header, .fnMenu { display: none !important; } .rel { break-inside: avoid; } }

const J = LANG === 'ja';
const TAG = { add: ['ついか', 'New'], imp: ['かいぜん', 'Improved'], fix: ['しゅうせい', 'Fixed'], doc: ['しりょう', 'Docs'] };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtDate = (d) => { const [y, m, dd] = d.split('-').map(Number); return J ? `${y}年${m}月${dd}日` : new Date(y, m - 1, dd).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); };

document.title = J ? 'リリースノート' : 'Release Notes';
document.getElementById('title').textContent = document.title;
document.getElementById('note').textContent = J
  ? 'この きょうざいの これまでの へんこうです（あたらしい ものが うえ）。'
  : 'All changes to these materials so far (newest first).';
document.getElementById('list').innerHTML = RELEASES.map((r, i) => `
  <section class="panel rel" id="v${r.v}">
    <h2><span class="ver">${J ? 'バージョン' : 'Version'} ${esc(r.v)}</span>${i === 0 ? '<span class="new">NEW</span>' : ''}${r.date ? `<span class="date">${esc(fmtDate(r.date))}</span>` : ''}</h2>
    <ul>${r.items.map(([k, ja, en]) => `<li><span class="tag ${k}">${TAG[k][J ? 0 : 1]}</span>${esc(J ? ja : en)}</li>`).join('')}</ul>
  </section>`).join('');

markReleaseSeen();   // ひらいたので「NEW」を けす
