};
const EXTRA = {

    bPick: 'かぎを ひろう 🔑', bOpen: 'とびらを あける 🚪', bIfThing: 'もし %1 なら',
    cDoor: 'まえが とびら', cKey: 'ここに かぎが ある',
    doorLocked: '🚪 とびらが あかないよ。かぎは どこかな？', doorBump: '🚪 とびらに ぶつかった！「とびらを あける」を つかおう',
    noKeyHere: 'ここには かぎが ないよ', noDoor: 'まえに とびらが ないよ', needKey: 'かぎを もっていないよ。さきに かぎを ひろおう',
    have: 'もちもの'
  },
  en: {
    bPick: 'pick up key 🔑', bOpen: 'open door 🚪', bIfThing: 'if %1',
    cDoor: 'door in front', cKey: 'key here',
    doorLocked: '🚪 The door is locked. Where is the key?', doorBump: '🚪 Bump! Use "open door" first.',
    noKeyHere: 'There is no key here.', noDoor: 'There is no door in front.', needKey: 'You have no key. Pick one up first.',
    have: 'Items'
  }
};
Object.assign(STR.ja, EXTRA.ja); Object.assign(STR.en, EXTRA.en);
const t = makeT(STR);
const L = (item, k) => (LANG === 'en' && item.en && item.en[k] !== undefined) ? item.en[k] : item[k];
STR.ja.pyTitle = 'Pythonで かぎと とびら'; STR.en.pyTitle = 'Python Keys & Doors';
Object.assign(STR.ja, { bIfDoor: 'もし まえが とびら なら', bIfKeyHere: 'もし ここに かぎが あったら' });
Object.assign(STR.en, { bIfDoor: 'if door in front', bIfKeyHere: 'if key here' });
const SAVE_KEY = 'block-pymazekey';
// ほぞん（この ブラウザの なかだけ）
const store = {
  get(k) { let v = null; try { v = localStorage.getItem(SAVE_KEY + k); } catch (_) { return null; } if (v == null) return null; try { return JSON.parse(v); } catch (_) { return v; } },
  set(k, v) { try { localStorage.setItem(SAVE_KEY + k, JSON.stringify(v)); } catch (_) {} }
};

/* ---------- ここから maze-key.html と おなじ（せかい・はんてい・ドット絵） ---------- */
/* ========== 5. めいろ（かぎと とびら） ========== */
let N = 5, CELL = 80;
const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];   // 0:うえ 1:みぎ 2:した 3:ひだり
let rocks = [], START = { r: 0, c: 0, dir: 1 }, GOAL = { r: 4, c: 4 };
let KEYS = new Set(), DOORS = new Set();          // 'r,c' の かたちで おぼえる
let world = { keys: 0, taken: [], opened: [] };   // え に だす いまの ようす
const P = (r, c) => r + ',' + c;

function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }
function free(r, c)   { return inside(r, c) && !rocks[r][c]; }

function loadMap(map, dir) {
  N = map.length; CELL = 16 * Math.floor(400 / (N * 16)); PX = CELL / 16;
  const cv = document.getElementById('board'); cv.width = cv.height = N * CELL; ctx.imageSmoothingEnabled = false;
  KEYS = new Set(); DOORS = new Set();
  rocks = map.map((row, r) => [...row].map((ch, c) => {
    if (ch === 'S') START = { r, c, dir };
    if (ch === 'G') GOAL = { r, c };
    if (ch === 'K') KEYS.add(P(r, c));
    if (ch === 'D') DOORS.add(P(r, c));
    return ch === '#';
  }));
}
function resetWorld() { world = { keys: 0, taken: [], opened: [] }; }
function onFrame(f) {
  world = f.world;
  if (f.event === 'pick') Sound.pick();
  if (f.event === 'open') Sound.open();
}
// ランダムな めいろは つかわない（ステージだけ）
function solvable() { return true; }
function randomRocks() { return rocks; }
function setRandomMaze() { resetRobot(); }

/* ========== 6. プログラムを しらべて、うごきの きろくを つくる ========== */
const MAX_MOVES = 300, MAX_LOOPS = 1000;
class Stop { constructor(kind, text, why) { this.kind = kind; this.text = text; this.why = why; } }

function simulate(code) {
  const s = { ...START };
  const frames = [];
  let blockId = null, loops = 0, keys = 0;
  const taken = new Set(), opened = new Set();
  const isKey  = (r, c) => KEYS.has(P(r, c)) && !taken.has(P(r, c));
  const isDoor = (r, c) => DOORS.has(P(r, c)) && !opened.has(P(r, c));
  const front = (d) => { const dd = (s.dir + (d || 0)) % 4; return [s.r + DR[dd], s.c + DC[dd]]; };
  const rec = (event) => {
    frames.push({ r: s.r, c: s.c, dir: s.dir, id: blockId, event, world: { keys, taken: [...taken], opened: [...opened] } });
    if (frames.length > MAX_MOVES) throw new Stop('ng', t('tooManyMoves', MAX_MOVES));
  };
  const api = {
    highlight: (id) => { blockId = id; },
    forward: () => {
      const [nr, nc] = front();
      if (!free(nr, nc)) { rec('crash'); throw new Stop('ng', t('crash'), 'crash'); }
      if (isDoor(nr, nc)) { rec('crash'); throw new Stop('ng', keys ? t('doorBump') : t('doorLocked'), 'crash'); }
      s.r = nr; s.c = nc; rec('move');
      if (s.r === GOAL.r && s.c === GOAL.c) throw new Stop('ok', 'goal');
    },
    turnRight: () => { s.dir = (s.dir + 1) % 4; rec('turn'); },
    turnLeft:  () => { s.dir = (s.dir + 3) % 4; rec('turn'); },
    pickKey: () => {
      if (!isKey(s.r, s.c)) throw new Stop('ng', t('noKeyHere'));
      taken.add(P(s.r, s.c)); keys++; rec('pick');
    },
    openDoor: () => {
      const [nr, nc] = front();
      if (!isDoor(nr, nc)) throw new Stop('ng', t('noDoor'));
      if (!keys) throw new Stop('ng', t('needKey'));
      keys--; opened.add(P(nr, nc)); rec('open');
    },
    isOpen: (which) => { const [nr, nc] = front({ F: 0, R: 1, L: 3 }[which]); return free(nr, nc) && !isDoor(nr, nc); },
    check: (what) => {
      if (what === 'KEY') return isKey(s.r, s.c);
      const [nr, nc] = front(); return isDoor(nr, nc);
    },
    atGoal: () => s.r === GOAL.r && s.c === GOAL.c,
    loopGuard: () => { if (++loops > MAX_LOOPS) throw new Stop('ng', t('endless')); }
  };
  let result;
  try {
    new Function(...Object.keys(api), code)(...Object.values(api));
    result = new Stop('ng', t('noGoal'));
  } catch (e) {
    result = e instanceof Stop ? e : new Stop('ng', '⚠ ' + e.message);
  }
  return { frames, result };
}

/* ========== 7. えを かく（ドット絵） ==========
   1マスを 16×16 ドットで かき、5ばいに ひろげて ひょうじする */
const ctx = document.getElementById('board').getContext('2d');
ctx.imageSmoothingEnabled = false;
let PX = CELL / 16;
let robot = { ...START }, trail = [], crashed = false, timer = null;

// マスごとに いつも おなじに なる らんすう（もようが ちらつかないように）
function rand(r, c, i) {
  let h = (r * 73856093) ^ (c * 19349663) ^ (i * 83492791);
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function dot(x, y, px, py, color) { ctx.fillStyle = color; ctx.fillRect(x + px * PX, y + py * PX, PX, PX); }
function noiseTile(x, y, r, c, salt, colors) {
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++)
    dot(x, y, px, py, colors[Math.floor(rand(r * 16 + py, c * 16 + px, salt) * colors.length)]);
}

// くさの じめん
function grassTile(x, y, r, c) {
  noiseTile(x, y, r, c, 1, ['#5fa83a', '#5fa83a', '#58a034', '#6cbb45', '#4e9a2f']);
  for (let k = 0; k < 4; k++) dot(x, y, Math.floor(rand(r, c, 10 + k) * 16), Math.floor(rand(r, c, 20 + k) * 16), '#7fd055');
}
// とおった みち（つち）
function dirtTile(x, y, r, c) {
  noiseTile(x, y, r, c, 2, ['#8b5a2b', '#7a4e25', '#966434', '#8b5a2b', '#6e4520']);
}
// いしブロック（いわ）：まるい いしを ならべた もよう
function stoneTile(x, y, r, c) {
  noiseTile(x, y, r, c, 3, ['#7f7f7f', '#8a8a8a', '#757575', '#828282']);
  const stones = [[1, 1, 6, 5], [8, 0, 7, 4], [0, 7, 4, 4], [5, 6, 6, 5], [12, 5, 4, 6], [1, 12, 7, 4], [9, 12, 6, 4]];
  for (const [sx, sy, w, h] of stones) {
    for (let i = 0; i < w; i++) { dot(x, y, sx + i, sy + h - 1, '#555555'); dot(x, y, sx + i, sy, '#a5a5a5'); }
    for (let j = 0; j < h; j++) { dot(x, y, sx + w - 1, sy + j, '#555555'); }
  }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x, y + CELL - PX * 2, CELL, PX * 2);   // したに かげ
}
// スタート：もくざいの いた
function plankTile(x, y, r, c) {
  noiseTile(x, y, r, c, 4, ['#b8945f', '#ae8a55', '#c19d68']);
  for (let row = 3; row < 16; row += 4) for (let px = 0; px < 16; px++) dot(x, y, px, row, '#7a5a30');
  [[3, 0], [11, 4], [6, 8], [13, 12]].forEach(([px, py]) => { for (let j = 0; j < 3; j++) dot(x, y, px, py + j, '#7a5a30'); });
}
// ゴール：ダイヤの こうせき
const GEM = [
  '................', '..DD........dd..', '.DdkD......DdD..', '..Dk.........k..', '........DD......',
  '.......DddD.....', '......DdkkD.....', '.......Dkk......', '..k.....D.......', '.DD.........DD..',
  'DddD.......DdkD.', '.Dkk........Dk..', '..k....DD.......', '......DdkD......', '.......Dk.......', '................'];
function diamondTile(x, y, r, c) {
  stoneTile(x, y, r, c);
  const col = { D: '#4ee8e0', d: '#d3fffb', k: '#1b9e98' };
  GEM.forEach((row, py) => [...row].forEach((ch, px) => { if (col[ch]) dot(x, y, px, py, col[ch]); }));
}

// たんけんか（オリジナル キャラ）：うえむきで かいて、むきに あわせて まわす
const HERO = [
  '................', '................', '......LLLL......', '....hhLLLLhh....',
  '....hHHHHHHh....', '....hHHHHHHh....', '....hHHHHHHh....', '..BBhHHHHHHhBB..',
  '.SBBhHHHHHHhBBS.', '.SBBhhhhhhhhBBS.', '.SBBBBBBBBBBBBS.', '.SBBBBBBBBBBBBS.',
  '..BBBBBBBBBBBB..', '..bbbbbbbbbbbb..', '................', '................'];
function drawHero() {
  const cx = robot.c * CELL + CELL / 2, cy = robot.r * CELL + CELL / 2;
  const col = crashed
    ? { L: '#fff59d', h: '#8b0000', H: '#e53935', B: '#e53935', b: '#8b0000', S: '#e0b48a' }
    : { L: '#fff59d', h: '#c66a00', H: '#ff9800', B: '#3f8fd2', b: '#2c6aa0', S: '#e0b48a' };
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(robot.dir * Math.PI / 2);
  ctx.fillStyle = 'rgba(255,245,157,.45)';            // ライトの ひかり（まえの むき）
  ctx.beginPath(); ctx.moveTo(-PX * 2, -PX * 6); ctx.lineTo(PX * 2, -PX * 6);
  ctx.lineTo(PX * 5, -CELL * 0.75); ctx.lineTo(-PX * 5, -CELL * 0.75); ctx.fill();
  HERO.forEach((row, py) => [...row].forEach((ch, px) => {
    if (col[ch]) { ctx.fillStyle = col[ch]; ctx.fillRect((px - 8) * PX, (py - 8) * PX, PX, PX); }
  }));
  ctx.restore();
}

// かぎ・とびらの ドット絵
const KEY_ART = [
  '................', '................', '.....yyyy.......', '....yYYYYy......', '...yYy..yYy.....', '...yYy..yYy.....',
  '....yYYYYy......', '.....yYYy.......', '......yYy.......', '......yYyyy.....', '......yYYYy.....', '......yYyy......',
  '......yYYy......', '......yyyy......', '................', '................'];
function keyTile(x, y) {
  const col = { Y: '#ffd43b', y: '#8a6a00' };
  KEY_ART.forEach((row, py) => [...row].forEach((ch, px) => { if (col[ch]) dot(x, y, px, py, col[ch]); }));
}
function doorTile(x, y, r, c, open) {
  if (open) {   // あいた とびら：りょうがわに はしらだけ
    dirtTile(x, y, r, c);
    for (let py = 0; py < 16; py++) { dot(x, y, 0, py, '#4a2e12'); dot(x, y, 1, py, '#8b5a2b'); dot(x, y, 14, py, '#8b5a2b'); dot(x, y, 15, py, '#4a2e12'); }
    return;
  }
  noiseTile(x, y, r, c, 5, ['#8b5a2b', '#7a4e25', '#966434']);
  for (let i = 0; i < 16; i++) { dot(x, y, i, 0, '#4a2e12'); dot(x, y, i, 15, '#4a2e12'); dot(x, y, 0, i, '#4a2e12'); dot(x, y, 15, i, '#4a2e12'); dot(x, y, 8, i, '#5e3b1a'); }
  for (let i = 1; i < 15; i++) { dot(x, y, i, 5, '#5e3b1a'); dot(x, y, i, 10, '#5e3b1a'); }
  for (let py = 7; py <= 9; py++) { dot(x, y, 11, py, '#ffd43b'); dot(x, y, 12, py, '#ffd43b'); }
  dot(x, y, 11, 10, '#222222');
}

function draw() {
  const W = N * CELL;
  ctx.clearRect(0, 0, W, W);
  const walked = new Set(trail.map(([r, c]) => r + ',' + c));
  const taken = new Set(world.taken), opened = new Set(world.opened);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = c * CELL, y = r * CELL;
    if (rocks[r][c]) stoneTile(x, y, r, c);
    else if (r === GOAL.r && c === GOAL.c) diamondTile(x, y, r, c);
    else if (r === START.r && c === START.c) plankTile(x, y, r, c);
    else if (DOORS.has(P(r, c))) doorTile(x, y, r, c, opened.has(P(r, c)));
    else if (walked.has(r + ',' + c)) dirtTile(x, y, r, c);
    else grassTile(x, y, r, c);
    if (KEYS.has(P(r, c)) && !taken.has(P(r, c))) keyTile(x, y);
  }
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, W); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(W, i * CELL + .5); ctx.stroke();
  }
  drawHero();
  // もちもの（ばんめんの うえの ぎょう）
  const sr = document.getElementById('statusRow');
  if (sr) sr.textContent = (LANG === 'en' ? 'Items: 🔑 × ' : 'もちもの：🔑 × ') + world.keys;
}

/* ---------- maze-key.html と おなじ（こうかおん） ---------- */
const Sound = {
  ctx: null, master: null, muted: !!store.get('-muted'), stepFoot: 0,
  // ブラウザは ボタンを おすまで おとを ならせないので、さいしょの クリックで じゅんび
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.25;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  // 1つの おと：type=なみの かたち, f1→f2 に たかさを かえる, len=びょう
  tone(type, f1, f2, len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + len + 0.02);
  },
  noise(len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * len), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain(), lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.buffer = buf; src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t);
  },
  notes(list, type = 'square', vol = 0.6) {   // list: [[ヘルツ, はじまり(びょう), ながさ(びょう)], ...]
    for (const [f, at, len] of list) this.tone(type, f, f, len, at, vol);
  },

  // --- つかう おと ---
  step() {                                   // あしおと（ひだり・みぎで すこし たかさを かえる）
    this.stepFoot ^= 1;
    this.noise(0.07, 0, 0.5);
    this.tone('square', this.stepFoot ? 330 : 294, this.stepFoot ? 220 : 196, 0.07, 0, 0.35);
  },
  turnRight() { this.tone('triangle', 520, 880, 0.12, 0, 0.7); },   // ひゅっ↑
  turnLeft()  { this.tone('triangle', 880, 520, 0.12, 0, 0.7); },   // ひゅっ↓
  crash() {                                  // ゴンッ
    this.noise(0.35, 0, 1);
    this.tone('square', 140, 50, 0.35, 0, 0.8);
  },
  clear() {                                  // ステージ クリア：ドミソド〜
    this.notes([[523, 0, .12], [659, .12, .12], [784, .24, .12], [1047, .36, .45]]);
    this.notes([[392, .36, .45], [659, .36, .45]], 'triangle', 0.5);
  },
  goalSoSo() { this.notes([[784, 0, .12], [1047, .14, .25]]); },      // ゴールしたけど めやすオーバー
  fail()  { this.notes([[392, 0, .16], [330, .18, .16], [262, .36, .35]], 'square', 0.5); },  // ざんねん
  grandClear() {                             // チュートリアル ぜんぶ クリア
    const m = [[523, 0, .1], [523, .12, .1], [523, .24, .1], [523, .36, .3], [415, .7, .3], [466, 1.0, .3], [523, 1.3, .15], [466, 1.5, .1], [523, 1.62, .7]];
    this.notes(m);
    this.notes([[262, 1.3, 1.0], [330, 1.3, 1.0], [392, 1.3, 1.0]], 'triangle', 0.4);
  },
  pick() { this.notes([[988, 0, .08], [1319, .08, .18]], 'square', 0.5); },              // ちゃりん
  open() { this.tone('sawtooth', 180, 120, 0.25, 0, 0.35); this.notes([[523, .2, .1], [784, .3, .2]], 'triangle', 0.6); },   // ぎぃ…がちゃ
  toggle() {
    this.muted = !this.muted; store.set('-muted', this.muted);
    return this.muted;
  }
};

const PDIR = [[t('dirF'), 'front', 'F'], [t('dirR'), 'right', 'R'], [t('dirL'), 'left', 'L']];

  load(lv) { loadMap(lv.map, lv.dir); },
  resetView() { robot = { ...START }; trail = [[START.r, START.c]]; crashed = false; resetWorld(); draw(); },
  apply(f, i, frames) {   // うごきの きろく 1コマぶんを えと おとに する（もとの アプリと おなじ）
    robot = { r: f.r, c: f.c, dir: f.dir };
    if (f.event === 'move') { trail.push([f.r, f.c]); Sound.step(); }
    if (f.event === 'turn') { const prev = i > 1 ? frames[i - 2].dir : START.dir; if ((prev + 1) % 4 === f.dir) Sound.turnRight(); else Sound.turnLeft(); }
    if (f.event === 'crash') { crashed = true; Sound.crash(); }
    onFrame(f);
  }
};
