<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かいせつしょ / Guide Book</title>
<script src="i18n.js"></script>        <!-- にほんご／English・⚙メニュー（ここでは Blockly は つかわない） -->
<script src="guide-data.js"></script>  <!-- かいせつの データ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* ===== テーマ：ほんだな（かいせつしょ） ===== */
  :root {
    --page-bg: #3b2a22 repeating-conic-gradient(rgba(0,0,0,.16) 0 25%, transparent 0 50%) 0 0 / 32px 32px;
    --hdr-bg: linear-gradient(#c0504d 0 10px, #8e2f2c 10px 14px, #4a2a24 14px);
    --hdr-border: #1c0f0c; --title-shadow: #000; --link: #ffd966; --fn: #8e2f2c;
    --panel-bg: #f6efdc; --panel-light: #ffffff; --panel-dark: #9a8a62; --panel-text: #3a3026; --accent: #8e2f2c;
  }
  html, body { height: auto; min-height: 100%; }
  #wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; }
  .panel { width: auto; }
  h2.app { color: #fff; font-weight: normal; font-size: 26px; text-shadow: 2px 2px 0 #000; margin: 30px 0 10px; scroll-margin-top: 10px; }
  .appIntro { margin-bottom: 14px; line-height: 1.8; }
  .appIntro a { color: var(--accent); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bar button { font-size: 15px; padding: 5px 12px; }
  .bar a.bookBtn { font-size: 15px; padding: 5px 12px; color: #fff; text-decoration: none; background: #8a5a1c; border: 3px solid; border-color: #d6a868 #4a2c08 #4a2c08 #d6a868; outline: 2px solid #000; text-shadow: 1px 1px 0 #000; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
  #intro p { margin: 6px 0; line-height: 1.8; }
  details.introVid { margin-top: 12px; }
  details.introVid video { display: block; width: 100%; max-width: 820px; margin-top: 8px; background: #000; aspect-ratio: 16 / 9; }
  .teacher { margin-top: 10px; padding: 8px 12px; background: #efe4c6; border-left: 6px solid var(--accent); font-size: 14px; line-height: 1.8; }
  /* もくじ */
  .viewBar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0 0; scroll-margin-top: 10px; }
  .viewBar .vl { color: #fff; text-shadow: 2px 2px 0 #000; font-size: 15px; }
  .viewBar button { font-size: 15px; padding: 6px 12px; background: #3d4352; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .viewBar button small { font-size: 12px; opacity: .85; }
  .viewBar button[aria-pressed="true"] { background: #306998; border-color: #ffd43b; outline: 3px solid #ffd43b; }
  body.view-blk [data-kind="py"], body.view-py [data-kind="blk"] { display: none !important; }
  #toc { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; }
  #toc a { color: #fff; text-decoration: none; background: rgba(0,0,0,.35); border: 3px solid #000; padding: 6px 12px; text-shadow: 2px 2px 0 #000;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; min-height: 40px; box-sizing: border-box; }
  /* まなびの つながり（ひょう） */
  table.map { border-collapse: collapse; width: 100%; font-size: 14px; background: #fffaf0; }
  table.map th, table.map td { border: 2px solid #c9b98a; padding: 5px 8px; text-align: center; }
  table.map th { background: #e7d9b3; }
  table.map td.c { text-align: left; white-space: nowrap; }
  table.map td a { color: var(--accent); margin: 0 2px; }
  table.map th .sub { font-size: 10.5px; font-weight: normal; display: flex; flex-wrap: wrap; column-gap: 6px; justify-content: center; opacity: .8; }
  table.map th .sub span { white-space: nowrap; }
  table.map td.c { white-space: normal; min-width: 7.5em; max-width: 10em; font-size: 13px; line-height: 1.35; }
  table.map th, table.map td { padding: 4px 5px; }
  table.map td { vertical-align: middle; position: relative; }
  table.map th.c, table.map td.c { position: sticky; left: 0; z-index: 1; background: #f3e6c4; }
  .mapHead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .mapHead h3 { margin: 0; font-weight: normal; flex: 1; min-width: 240px; }
  .mapMode { display: flex; gap: 6px; }
  .mapMode button { font-size: 14px; padding: 4px 12px; background: #6b5a45; }
  .mapMode button[aria-pressed="true"] { background: #306998; outline: 3px solid #ffd43b; }
  .mapLegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin: 0 0 6px; align-items: center; }
  .mapLegend .dim, .mnone { color: #b8a77f; }
  .mb, .mp { display: inline-block; font-size: 11px; color: #fff; padding: 0 4px; margin-right: 3px; border-radius: 3px; font-weight: bold; }
  .mb { background: #4e8f32; } .mp { background: #306998; }
  .mrow { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 1px 0; }
  a.mn { display: inline-block; min-width: 18px; padding: 0 4px; margin: 1px !important; border-radius: 4px; color: #fff !important; text-decoration: none; font-size: 13px; }
  a.mn.nb { background: #4e8f32; } a.mn.np { background: #306998; }
  /* ● で みる */
  .mdot { --n: 1; width: calc(16px + var(--n) * 2.5px); height: calc(16px + var(--n) * 2.5px); padding: 0; border-radius: 50%; border: none; outline: none;
    font-size: 11px; font-weight: bold; text-shadow: none; color: #fff; background: hsl(110, 45%, calc(72% - var(--n) * 5%)); }
  .mdot[data-n="1"], .mdot[data-n="2"] { color: #234d18; }
  .mdot:focus-visible { box-shadow: 0 0 0 3px #ffd43b; }
  .mpop { position: absolute; top: calc(100% - 4px); left: 50%; transform: translateX(-50%); z-index: 5; min-width: 200px; text-align: left;
    background: #2b2f3a; color: #fff; border: 3px solid #000; padding: 8px 10px; font-size: 13px; line-height: 1.7; white-space: nowrap; }
  .mpop .mpt { font-weight: bold; margin-bottom: 2px; }
  #mapBox.mm-num .cellDot, #mapBox.mm-num .lg-dot, #mapBox.mm-dot .cellNum, #mapBox.mm-dot .cellNumNone, #mapBox.mm-dot .lg-num { display: none; }
  /* 「–」は その みかたで かだいが ない ときだけ */
  #mapBox.mm-num .cellNumNone.hasB, #mapBox.mm-num .cellNumNone.hasP { display: none; }
  body.view-blk #mapBox.mm-num .cellNumNone.hasP:not(.hasB) { display: inline; }
  body.view-py #mapBox.mm-num .cellNumNone.hasB:not(.hasP) { display: inline; }
  .cellDot .v-blk, .cellDot .v-py { display: none; }
  body.view-blk .cellDot .v-all, body.view-py .cellDot .v-all { display: none; }
  body.view-blk .cellDot .v-blk, body.view-py .cellDot .v-py { display: inline-flex; }
  body.view-blk .cellDot span.v-blk, body.view-py .cellDot span.v-py { display: inline; }
  /* かだいの カード */
  .item { margin: 12px 0; scroll-margin-top: 10px; }
  .item h3 { margin: 0 0 6px; font-size: 21px; font-weight: normal; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 13px; padding: 2px 8px; background: #3c5aa6; color: #fff; border: 2px solid #000; }
  .chip.lim { background: #8e2f2c; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; line-height: 1.8; margin: 3px 0; }
  .facts .k { color: var(--accent); white-space: nowrap; }
  @media (max-width: 600px) { .facts { grid-template-columns: 1fr; } }
  details { margin-top: 8px; border: 3px solid; border-color: var(--panel-dark) var(--panel-light) var(--panel-light) var(--panel-dark); background: #fffaf0; }
  details summary { cursor: pointer; padding: 6px 10px; font-size: 16px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '▶ '; }
  details[open] summary::before { content: '▼ '; }
  details .in { padding: 4px 12px 12px; line-height: 1.8; }
  details pre.py { margin: 8px 0 0; padding: 10px 14px; background: #1e2430; color: #e6e6e6; border: 2px solid #000; font: 16px/1.6 "DotGothic16", monospace; overflow-x: auto; white-space: pre; }
  details img { display: block; max-width: 100%; height: auto; margin-top: 8px; border: 2px solid #000; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .links a { font-size: 15px; color: #fff; text-decoration: none; background: #4f6a9a; border: 3px solid; border-color: #9fb5dd #22314f #22314f #9fb5dd; outline: 2px solid #000; padding: 4px 10px; text-shadow: 1px 1px 0 #000; }
  .wsBox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 0; font-size: 14px; }
  .wsBox a { color: #fff; text-decoration: none; background: #3f7d3a; border: 3px solid; border-color: #8fc98a #1d3f1a #1d3f1a #8fc98a; outline: 2px solid #000; padding: 3px 10px; text-shadow: 1px 1px 0 #000; }
  .wsBox a.lp { background: #6a4c93; border-color: #b9a2d8 #33204e #33204e #b9a2d8; }
  .wsBox a.sub { background: #5d6b5a; border-color: #a9b5a6 #2c332b #2c332b #a9b5a6; }
  /* ボタンの もじを たての まんなかに（フォントが かわっても おなじ たかさ） */
  .links a, .wsBox a { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 34px; line-height: 1.2; padding-top: 0; padding-bottom: 0; }
  .links a.bk { background: #8a5a1c; border-color: #d6a868 #4a2c08 #4a2c08 #d6a868; }
  .links a.v { background: #8e2f2c; border-color: #d48a87 #4a1311 #4a1311 #d48a87; }
  html.theme-night table.map { background: #22262f; }
  html.theme-night table.map th { background: #2b2f3a; }
  html.theme-night table.map th.c, html.theme-night table.map td.c { background: #2b2f3a; }
  html.theme-night table.map th, html.theme-night table.map td { border-color: #3a4050; }
  html.theme-night details, html.theme-night .teacher { background: #1b1e26; }
  /* いんさつ：ヘッダーと ボタンを かくし、こたえを ひらいた じょうたいで */
  @media print {
    header, .bar, .viewBar, details.introVid, #toc, .links, .wsBox, .fnMenu { display: none !important; }
    html, body { background: #fff !important; }
    #wrap { max-width: none; padding: 0; }
    h2.app { color: #000; text-shadow: none; page-break-before: always; }
    .panel { outline: none; border: 1px solid #999; background: #fff !important; color: #000 !important; }
    .item { page-break-inside: avoid; }
    details { border: 1px solid #999; }
    details summary::before { content: ''; }
    html.theme-calm main, html.theme-calm header { filter: none; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="ico">📖</span><span class="lbl" id="title"></span></h1>
  <nav class="nav" id="nav"></nav>
  <button id="fnBtn" class="sub2"></button>
</header>
<div id="wrap">
  <div id="intro" class="panel"></div>
  <div id="viewBar" class="viewBar" role="group"></div>
  <div id="toc"></div>
  <div id="mapBox"></div>
  <div id="body"></div>
</div>
<script>
const J = LANG === 'ja';
const G = window.GUIDE;
const T = (o) => o == null ? '' : (typeof o === 'string' ? o : (o[LANG] ?? o.ja));
const S = {
  title: ['かいせつしょ', 'Guide Book'],
  lead1: ['この ページは、ブロックの アプリ 7つ（めいろの なかま 3つを ふくむ）と 🐍 Python版 7つの すべての かだい（おだい・ステージ）の かいせつしょ です。',
          'This page explains every challenge and stage in the seven block apps (including the three maze variations) and the seven 🐍 Python apps.'],
  lead2: ['「ヒントを みる」「こたえと ポイントを みる」を おすと、ヒントや こたえが ひらきます。まずは じぶんで かんがえてから ひらいてみよう！',
          'Press “Show hint” or “Show answer and key point” to open them. Try to think by yourself first!'],
  teacher: ['先生・保護者の方へ：各課題の「めあて」「学べること」「つまずきやすいところ」を授業の導入やふりかえりにお使いください。解説動画（おえかき・めいろ・めいろの なかま・うちゅう・こわす・おく と、Python版）へのリンクもあります。「🖨 いんさつ」で、こたえを開いた状態で印刷できます。各課題の「📝 ワークシート（PDF）」から、児童・生徒用の記入シートを開いて印刷できます（一式：worksheets/worksheets-all.pdf）。「📋 学習指導案」から、45分の授業の学習指導案（原案）を開けます（一式：lesson-plans/lesson-plans-all.pdf）。',
            'For teachers and parents: use the goal, concepts, and common mistakes for each task to start and review lessons. Links to the explanation videos (Drawing, Maze, the maze variations, Space, Break & Build and the Python versions) are included. “🖨 Print” prints with all answers open. “📝 Worksheet (PDF)” under each task opens a printable student sheet (full set: worksheets/en/worksheets-all.pdf).'],
  openAll: ['こたえを ぜんぶ ひらく', 'Open all answers'], closeAll: ['ぜんぶ とじる', 'Close all'], print: ['🖨 いんさつ（こたえ つき）', '🖨 Print (with answers)'], book: ['📘 ほん ぜんぶ（PDF）', '📘 All books (PDF)'],
  introVid: ['🎬 この システムの しょうかい どうが（2ふん）', '🎬 System overview video (2 min)'],
  viewAll: ['📚 すべてを みる', '📚 Show all'], viewBlk: ['🧩 Blockly版を みる', '🧩 Show Blockly'], viewPy: ['🐍 Python版を みる', '🐍 Show Python'],
  viewLabel: ['みる ものを えらぶ：', 'Show:'],
  mapTitle: ['まなびの つながり（どの かだいで なにを まなぶか）', 'What you learn where'],
  concept: ['まなぶ こと', 'Concept'],
  mapNum: ['🔢 ばんごうで みる', '🔢 Numbers'], mapDot: ['● で みる', '● Dots'],
  legB: ['ブロック版の かだい', 'Block task'], legP: ['Python版の かだい', 'Python task'], legNone: ['その アプリでは でてこない', 'not in that app'],
  legDot: ['●の こさ・おおきさ ＝ その かんがえかたが でてくる かだいの かず。●を おすと ばんごうが でるよ', 'Darker / bigger dot = more tasks with that idea. Tap a dot to see the task numbers.'],
  goal: ['🎯 めあて', '🎯 Goal'], q: ['📝 もんだい', '📝 Task'], mistake: ['⚠ つまずきやすい ところ', '⚠ Common mistake'],
  hint: ['💡 ヒントを みる', '💡 Show hint'], answer: ['📖 こたえと ポイントを みる', '📖 Show answer and key point'], point: ['✨ ポイント', '✨ Key point'],
  ws: ['📝 ワークシート（PDF）', '📝 Worksheet (PDF)'], wsGoal: ['🎯 めあて・ふりかえり', '🎯 Goal & reflection'], wsCheck: ['✅ チェックカード', '✅ Check card'], lp: ['📋 学習指導案', '📋 Lesson plan (Japanese)'],
  limit: (n) => J ? `めやす：ブロック ${n}こ いない` : `Target: ${n} blocks or fewer`,
  openApp: ['▶ アプリで ためす', '▶ Try it in the app'], video: ['🎬 かいせつ どうが', '🎬 Video'],
  stage: (a, n) => a === 'draw' ? (J ? `おだい${n}` : `Challenge ${n}`) : (J ? `ステージ${n}` : `Stage ${n}`)
};
const s = (k) => Array.isArray(S[k]) ? S[k][J ? 0 : 1] : S[k];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
document.title = s('title'); document.getElementById('title').textContent = s('title');

// はじめに
document.getElementById('intro').innerHTML =
  `<p>${esc(s('lead1'))}</p><p>${esc(s('lead2'))}</p><div class="teacher">${esc(s('teacher'))}</div>
   <div class="bar"><button id="openAll">${esc(s('openAll'))}</button><button id="closeAll">${esc(s('closeAll'))}</button><button id="printBtn" style="background:var(--run)">${esc(s('print'))}</button><a class="bookBtn" href="${J ? 'book/all-books.pdf' : 'book/en/all-books.pdf'}" target="_blank" rel="noopener">${esc(s('book'))}</a></div>
   <details class="introVid"><summary>${esc(s('introVid'))}</summary><video src="videos/${J ? 'ja' : 'en'}/intro.mp4" controls preload="none" playsinline></video></details>`;

// もくじ
// 🧩 Blockly版 ／ 🐍 Python版：キーが py で はじまる アプリ（python も）は Python版
const kindOf = (k) => (/^py/.test(k) ? 'py' : 'blk');
document.getElementById('toc').innerHTML = G.apps.map((a) => `<a data-kind="${kindOf(a.key)}" href="#app-${a.key}">${a.icon} ${esc(T(a.name))}</a>`).join('');

// まなびの つながり（ひょう）
// ブロック版と Python版を 1つの 列に まとめる。「🔢 ばんごうで みる」⇄「● で みる（ヒートマップ）」を きりかえられる
const order = ['seq', 'dir', 'loop', 'nest', 'pattern', 'angle', 'count', 'if', 'until', 'state', 'timing', 'var', 'math', 'decomp', 'algo', 'py'];
const PAIRS = [['draw', 'pydraw'], ['maze', 'python'], ['mazejr', 'pymazejr'], ['mazekey', 'pymazekey'], ['mazeenemy', 'pymazeenemy'], ['space', 'pyspace'], ['craft', 'pycraft']];
const APPK = Object.fromEntries(G.apps.map((a) => [a.key, a]));
const SHORT = { draw: ['おえかき', 'Drawing'], maze: ['めいろ', 'Maze'], mazejr: ['やじるし', 'Arrow'], mazekey: ['かぎと とびら', 'Keys & Doors'],
  mazeenemy: ['てきを よける', 'Slime'], space: ['うちゅう', 'Space'], craft: ['こわす・おく', 'Break & Build'] };
const hitsOf = (k, c) => APPK[k].items.filter((it) => it.tags.includes(c)).map((it) => it.n);
const numLinks = (k, ns, cls) => ns.map((n) => `<a class="mn ${cls}" href="#${k}-${n}">${n}</a>`).join('');
const dotHtml = (n, view, label) => n
  ? `<button type="button" class="mdot v-${view}" style="--n:${Math.min(n, 8)}" data-n="${n}" aria-label="${esc(label)}：${n}">${n}</button>`
  : `<span class="mnone v-${view}">·</span>`;
let map = `<div class="panel" style="margin:12px 0"><div class="mapHead"><h3>${esc(s('mapTitle'))}</h3>
  <div class="mapMode" role="group"><button type="button" data-mm="num" aria-pressed="true">${esc(s('mapNum'))}</button><button type="button" data-mm="dot" aria-pressed="false">${esc(s('mapDot'))}</button></div></div>
  <div class="mapLegend lg-num"><span><b class="mb">${J ? 'ブ' : 'B'}</b>${esc(s('legB'))}</span><span data-kind="py"><b class="mp">Py</b>${esc(s('legP'))}</span><span class="dim">– ${esc(s('legNone'))}</span></div>
  <div class="mapLegend lg-dot"><span>${esc(s('legDot'))}</span></div>
  <div style="overflow-x:auto"><table class="map"><tr><th class="c">${esc(s('concept'))}</th>`;
map += PAIRS.map(([b, p]) => `<th>${esc(SHORT[b][J ? 0 : 1])}<div class="sub"><span data-kind="blk">${J ? 'ブロック' : 'Blocks'} ${APPK[b].items.length}</span><span data-kind="py">Python ${APPK[p].items.length}</span></div></th>`).join('') + '</tr>';
for (const c of order) {
  map += `<tr><td class="c">${esc(T(G.concepts[c]))}</td>`;
  for (const [b, p] of PAIRS) {
    const hb = hitsOf(b, c), hp = hitsOf(p, c);
    const num = (hb.length || hp.length)
      ? `<div class="cellNum">${hb.length ? `<div class="mrow" data-kind="blk"><b class="mb">${J ? 'ブ' : 'B'}</b>${numLinks(b, hb, 'nb')}</div>` : ''}${hp.length ? `<div class="mrow" data-kind="py"><b class="mp">Py</b>${numLinks(p, hp, 'np')}</div>` : ''}</div>`
      : '';
    const none = `<span class="mnone cellNumNone${hb.length ? ' hasB' : ''}${hp.length ? ' hasP' : ''}">–</span>`;
    const label = `${SHORT[b][J ? 0 : 1]} × ${T(G.concepts[c])}`;
    const pop = `<div class="mpop" hidden><div class="mpt">${esc(label)}</div>${hb.length ? `<div data-kind="blk">${J ? 'ブロック' : 'Blocks'}：${numLinks(b, hb, 'nb')}</div>` : ''}${hp.length ? `<div data-kind="py">Python：${numLinks(p, hp, 'np')}</div>` : ''}</div>`;
    const dots = `<div class="cellDot">${dotHtml(hb.length + hp.length, 'all', label)}${dotHtml(hb.length, 'blk', label)}${dotHtml(hp.length, 'py', label)}${pop}</div>`;
    map += `<td>${num}${none}${dots}</td>`;
  }
  map += '</tr>';
}
document.getElementById('mapBox').innerHTML = map + '</table></div></div>';
{
  const box = document.getElementById('mapBox');
  const setMM = (m, save) => {
    if (m !== 'dot') m = 'num';
    box.classList.toggle('mm-dot', m === 'dot'); box.classList.toggle('mm-num', m === 'num');
    box.querySelectorAll('[data-mm]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mm === m)));
    box.querySelectorAll('.mpop').forEach((p) => { p.hidden = true; });
    if (save) { try { localStorage.setItem('guide-map', m); } catch (e) {} }
  };
  let m0 = null; try { m0 = localStorage.getItem('guide-map'); } catch (e) {}
  setMM(m0 || (window.innerWidth <= 600 ? 'dot' : 'num'), false);   // スマホでは はじめは ● で みる
  box.addEventListener('click', (e) => {
    const mm = e.target.closest('[data-mm]'); if (mm) { setMM(mm.dataset.mm, true); return; }
    const d = e.target.closest('.mdot');
    box.querySelectorAll('.mpop').forEach((p) => { if (!d || p.parentNode !== d.parentNode) p.hidden = true; });
    if (d) { const p = d.parentNode.querySelector('.mpop'); p.hidden = !p.hidden; }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') box.querySelectorAll('.mpop').forEach((p) => { p.hidden = true; }); });
}

// ワークシート（PDF）：アプリ → シート
const WS = { draw: 'ws2-draw', maze: 'ws3-maze', mazejr: 'ws4-arrow', mazekey: 'ws6-key-enemy', mazeenemy: 'ws6-key-enemy',
  space: 'ws5-space-craft', craft: 'ws5-space-craft' };
// 学習指導案（PDF・日本語）：アプリ → 指導案
const LP = { draw: 'lp-draw', mazejr: 'lp-arrow', maze: 'lp-maze', mazekey: 'lp-key-enemy', mazeenemy: 'lp-key-enemy', space: 'lp-space', craft: 'lp-craft' };
// 📘 ほん（PDF）：アプリ → ほん
const BOOKOF = (k) => /draw/.test(k) ? 'draw' : /space/.test(k) ? 'space' : /craft/.test(k) ? 'craft' : 'maze';
const BOOKNAME = { maze: ['📘 めいろの ほん', '📘 Maze book'], draw: ['📘 おえかきの ほん', '📘 Drawing book'], space: ['📘 うちゅうの ほん', '📘 Space book'], craft: ['📘 ぼうけんの ほん', '📘 Adventure book'] };
const bookLink = (k) => `<a class="bk" href="${J ? 'book/' : 'book/en/'}${BOOKOF(k)}-book.pdf" target="_blank" rel="noopener">${esc(BOOKNAME[BOOKOF(k)][J ? 0 : 1])}</a>`;
const WSDIR = J ? 'worksheets/' : 'worksheets/en/';
const wsFile = (k) => `${WSDIR}${WS[k] || 'ws7-python'}.pdf`;
const wsLinks = (k) => `<div class="wsBox"><a href="${wsFile(k)}" target="_blank" rel="noopener">${esc(s('ws'))}</a>` +
  `<a class="sub" href="${WSDIR}ws1-goal.pdf" target="_blank" rel="noopener">${esc(s('wsGoal'))}</a>` +
  `<a class="sub" href="${WSDIR}ws8-check.pdf" target="_blank" rel="noopener">${esc(s('wsCheck'))}</a>` +
  `<a class="lp" href="lesson-plans/${LP[k] || 'lp-python'}.pdf" target="_blank" rel="noopener">${esc(s('lp'))}</a></div>`;

// アプリごとの かだい
let html = '';
for (const a of G.apps) {
  html += `<div class="appSec" data-kind="${kindOf(a.key)}">`;
  html += `<h2 class="app" id="app-${a.key}">${a.icon} ${esc(T(a.name))}</h2>`;
  html += `<div class="panel appIntro">${esc(T(a.intro))}<div class="links"><a href="${a.file}">${esc(s('openApp'))}</a><a class="v" href="videos.html">${esc(s('video'))}</a>${bookLink(a.key)}</div></div>`;
  for (const it of a.items) {
    const chips = it.tags.map((c) => `<span class="chip">${esc(T(G.concepts[c]))}</span>`).join('') +
      (it.limit ? `<span class="chip lim">${esc(S.limit(it.limit))}</span>` : '');
    html += `<div class="panel item" id="${a.key}-${it.n}">
      <h3>${esc(T(it.title))}</h3>
      <div class="chips">${chips}</div>
      <div class="facts">
        <span class="k">${esc(s('goal'))}</span><span>${esc(T(it.goal))}</span>
        <span class="k">${esc(s('q'))}</span><span>${esc(T(it.text))}</span>
        <span class="k">${esc(s('mistake'))}</span><span>${esc(T(it.mistake))}</span>
      </div>
      ${T(it.hint) ? `<details class="hintBox"><summary>${esc(s('hint'))}</summary><div class="in">${esc(T(it.hint))}</div></details>` : ''}
      <details class="ansBox"><summary>${esc(s('answer'))}</summary><div class="in">
        <div><b>${esc(s('point'))}</b>：${esc(T(it.point))}</div>
        ${it.code ? `<pre class="py">${esc(it.code)}</pre>` : `<img loading="lazy" src="${T(it.img)}" alt="${esc(T(it.title))}">`}
      </div></details>
      ${wsLinks(a.key)}
      <div class="links"><a href="${a.file}">${esc(s('openApp'))}</a>${it.video ? `<a class="v" href="${T(it.video)}" target="_blank">${esc(s('video'))}</a>` : ''}${bookLink(a.key)}</div>
    </div>`;
  }
  html += '</div>';
}
document.getElementById('body').innerHTML = html;

// 📚 すべて ／ 🧩 Blockly版 ／ 🐍 Python版 の きりかえ（えらんだ ものは おぼえておく。?view=blk|py でも ひらける）
(() => {
  const count = (k) => G.apps.filter((a) => !k || kindOf(a.key) === k).reduce((n, a) => n + a.items.length, 0);
  const apps = (k) => G.apps.filter((a) => !k || kindOf(a.key) === k).length;
  const unit = (k) => J ? `（${apps(k)}アプリ・${count(k)}もん）` : ` (${apps(k)} apps, ${count(k)})`;
  const bar = document.getElementById('viewBar');
  bar.innerHTML = `<span class="vl">${esc(s('viewLabel'))}</span>` +
    [['all', 'viewAll', ''], ['blk', 'viewBlk', 'blk'], ['py', 'viewPy', 'py']].map(([v, key, k]) =>
      `<button type="button" data-view="${v}" aria-pressed="false">${esc(s(key))}<small>${esc(unit(k))}</small></button>`).join('');
  const setView = (v, save) => {
    if (!['all', 'blk', 'py'].includes(v)) v = 'all';
    document.body.classList.remove('view-all', 'view-blk', 'view-py');
    document.body.classList.add('view-' + v);
    bar.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    if (save) { try { localStorage.setItem('guide-view', v); } catch (e) {} }
  };
  let v = new URLSearchParams(location.search).get('view');
  if (!v) { try { v = localStorage.getItem('guide-view'); } catch (e) {} }
  setView(v || 'all', false);
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]'); if (!b) return;
    setView(b.dataset.view, true);
    bar.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
  // かくれている ところへの リンク（#pydraw-3 など）で きたら「すべて」に もどす
  const reveal = () => {
    const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el && !el.offsetParent) { setView('all', true); el.scrollIntoView(); }
  };
  window.addEventListener('hashchange', reveal); reveal();
})();

// ひらく・とじる・いんさつ
const setAll = (open) => document.querySelectorAll('details').forEach((d) => { d.open = open; });
document.getElementById('openAll').addEventListener('click', () => setAll(true));
document.getElementById('closeAll').addEventListener('click', () => setAll(false));
let before = [];
window.addEventListener('beforeprint', () => {
  before = [...document.querySelectorAll('details')].map((d) => d.open);
  document.querySelectorAll('img[loading="lazy"]').forEach((i) => { i.loading = 'eager'; });
  setAll(true);
});
window.addEventListener('afterprint', () => document.querySelectorAll('details').forEach((d, i) => { d.open = before[i]; }));
document.getElementById('printBtn').addEventListener('click', () => {
  document.querySelectorAll('img[loading="lazy"]').forEach((i) => { i.loading = 'eager'; });
  setAll(true); setTimeout(() => window.print(), 300);
});

buildNav(document.getElementById('nav'));
FnMenu(document.getElementById('fnBtn'), [langMenuItem(), nightMenuItem(), calmMenuItem()]);
</script>
</body>
</html>
