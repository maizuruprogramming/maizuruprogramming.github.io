<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "DotGothic16", "MS Gothic", monospace; color: #2d3a45;
    background: #0d3b5e linear-gradient(#155a8a, #0b2f4d) fixed; }

  .panel { background: #c6c6c6; padding: 10px 12px; border: 4px solid; border-color: #fff #555 #555 #fff; outline: 2px solid #000; }

  #palette { display: grid; grid-template-columns: repeat(2, 34px); gap: 4px; align-content: start; }
  .sw { width: 34px; height: 34px; border: 3px solid #333; cursor: pointer; padding: 0; outline: none; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 3px #000; }

  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  #sendRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #sendMsg, #teacherMsg { min-height: 1.5em; margin-top: 6px; line-height: 1.6; }
  .ok { color: #1b6e2b; } .ng { color: #b0392f; }
  #modeBanner { display: none; background: #fff3c4; border: 3px solid #a07800; padding: 6px 10px; font-size: 13px; line-height: 1.6; }
  #teacher { display: none; }

  /* すいぞくかん ぜんがめん */
  body.tank header, body.tank main { display: none; }

  #tankBar { position: absolute; left: 10px; top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;

<body>

<div id="tankView">
  <canvas id="tank"></canvas>
  <div id="tankBar">
    <span id="tankInfo"></span>
    <button class="owner red" id="delMode">🗑 けすモード：オフ</button>
    <button class="owner red" id="clearAll">ぜんぶ けす</button>
    <button id="fullBtn">⛶ ぜんがめん</button>
  </div>
  <div id="banner"></div>
  <div id="tankNotice"></div>

<script>
/* =====================================================================
   0. きほんの せってい
   ===================================================================== */
const params = new URLSearchParams(location.search);
const IS_TANK = params.get('view') === 'tank';
const IS_SENSEI = params.has('sensei');
const WORLD_W = 960, WORLD_H = 540;           // すいぞくかんの せかいの おおきさ
const MAX_FISH_PER_DEVICE = 5;

// いろ（0 は とうめい）。1マス = 16しんすうの 1もじ で ほぞん
const PALETTE = [null, '#1a1a1a', '#ffffff', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#00acc1',
  '#1e88e5', '#3949ab', '#8e24aa', '#ec407a', '#8d6e63', '#9e9e9e', '#ffccbc', '#b2ff59'];

const SAMPLE_FISH = [
  '0000000000000000',
  '0000000000000000',
  '0000000550000000',
  '0000005555000000',
  '0000044444440000',
  '3000444444444400',
  '3304444444442140',
  '3334444444442144',
  '3334444444444444',
  '3304444444444440',
  '3000444444444400',
  '0000044444440000',
  '0000005550000000',
  '0000000000000000',
  '0000000000000000',
  '0000000000000000'].join('');

const store = {
  get(k)    { try { return JSON.parse(localStorage.getItem('aquarium-' + k)); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem('aquarium-' + k, JSON.stringify(v)); } catch (_) {} }
};

/* =====================================================================
   1. ブロック
   ===================================================================== */
Object.assign(Blockly.Msg, {
  CONTROLS_REPEAT_TITLE: '%1 かい くりかえす',
  CONTROLS_REPEAT_INPUT_DO: '',
  MATH_RANDOM_INT_TITLE: '%1 から %2 の ランダムな かず'
});

const MOVE = '#2f8fc4', LOOK = '#c2185b', START = '#e68a00';
Blockly.common.defineBlocksWithJsonArray([
  { type: 'fish_start', message0: '🐟 はじまったら', nextStatement: null, colour: START },
  { type: 'fish_forward', message0: 'まえに %1 すすむ', args0: [{ type: 'input_value', name: 'N', check: 'Number' }],
    inputsInline: true, previousStatement: null, nextStatement: null, colour: MOVE },
  { type: 'fish_turn_right', message0: 'みぎに %1 ど まわる ↻', args0: [{ type: 'input_value', name: 'N', check: 'Number' }],
    inputsInline: true, previousStatement: null, nextStatement: null, colour: MOVE },
  { type: 'fish_turn_left', message0: 'ひだりに %1 ど まわる ↺', args0: [{ type: 'input_value', name: 'N', check: 'Number' }],
    inputsInline: true, previousStatement: null, nextStatement: null, colour: MOVE },
  { type: 'fish_random_turn', message0: 'ランダムに むきを かえる',
    previousStatement: null, nextStatement: null, colour: MOVE },
  { type: 'fish_point', message0: '%1 を むく',
    args0: [{ type: 'field_dropdown', name: 'DIR', options: [['みぎ ▶', '0'], ['ひだり ◀', '180'], ['うえ ▲', '270'], ['した ▼', '90']] }],
    previousStatement: null, nextStatement: null, colour: MOVE },
  { type: 'fish_bounce', message0: 'かべに ついたら はねかえる',
    previousStatement: null, nextStatement: null, colour: MOVE },
  { type: 'fish_wait', message0: '%1 びょう まつ', args0: [{ type: 'input_value', name: 'N', check: 'Number' }],
    inputsInline: true, previousStatement: null, nextStatement: null, colour: '#8b5a2b' },
  { type: 'fish_speed', message0: 'はやさを %1 にする（1〜10）', args0: [{ type: 'input_value', name: 'N', check: 'Number' }],
    inputsInline: true, previousStatement: null, nextStatement: null, colour: LOOK },
  { type: 'fish_size', message0: 'おおきさを %1 % にする', args0: [{ type: 'input_value', name: 'N', check: 'Number' }],
    inputsInline: true, previousStatement: null, nextStatement: null, colour: LOOK }
]);

const num = (v) => ({ shadow: { type: 'math_number', fields: { NUM: v } } });
const toolbox = {
  kind: 'categoryToolbox',
  contents: [
    { kind: 'category', name: 'うごき', colour: MOVE, contents: [
      { kind: 'block', type: 'fish_forward', inputs: { N: num(100) } },
      { kind: 'block', type: 'fish_turn_right', inputs: { N: num(45) } },
      { kind: 'block', type: 'fish_turn_left', inputs: { N: num(45) } },
      { kind: 'block', type: 'fish_random_turn' },
      { kind: 'block', type: 'fish_point' },
      { kind: 'block', type: 'fish_bounce' }
    ]},
    { kind: 'category', name: 'ようす', colour: LOOK, contents: [
      { kind: 'block', type: 'fish_speed', inputs: { N: num(5) } },
      { kind: 'block', type: 'fish_size', inputs: { N: num(150) } }
    ]},
    { kind: 'category', name: 'くりかえし', colour: '#8b5a2b', contents: [
      { kind: 'block', type: 'controls_repeat_ext', inputs: { TIMES: num(4) } },
      { kind: 'block', type: 'fish_wait', inputs: { N: num(1) } }
    ]},
    { kind: 'category', name: 'かず', colour: '#5b67a5', contents: [
      { kind: 'block', type: 'math_number' },
      { kind: 'block', type: 'math_random_int', inputs: { FROM: num(1), TO: num(100) } }
    ]}
  ]
};

// はじめの プログラム
const DEFAULT_PROGRAM = { blocks: { languageVersion: 0, blocks: [{
  type: 'fish_start', x: 30, y: 30, deletable: false,
  next: { block: { type: 'fish_bounce',
    next: { block: { type: 'fish_forward', inputs: { N: num(150) },
      next: { block: { type: 'fish_random_turn' } } } } } }
}]}};

/* =====================================================================
   2. おさかなの うごき（ブロックの JSON を あんぜんに よみとって うごかす）
      ※ ほかの ひとの プログラムを うごかすので、JavaScript に へんかんして
        じっこうする ことは せず、きまった ブロックだけを よみとる
   ===================================================================== */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Number.isFinite(v) ? v : lo));

function readNum(inp, def) {
  const b = inp && (inp.block || inp.shadow);
  if (!b) return def;
  if (b.type === 'math_number') { const v = Number(b.fields && b.fields.NUM); return Number.isFinite(v) ? v : def; }
  if (b.type === 'math_random_int') {
    const a = readNum(b.inputs && b.inputs.FROM, 1), c = readNum(b.inputs && b.inputs.TO, 10);
    const lo = Math.ceil(Math.min(a, c)), hi = Math.floor(Math.max(a, c));
    return lo + Math.floor(Math.random() * (hi - lo + 1));
  }
  return def;
}

function* turnBy(f, deg) {
  let rem = Math.abs(deg); const sg = Math.sign(deg);
  while (rem > 0) { const st = Math.min(rem, 5); f.heading += sg * st; rem -= st; yield; }
}

function* runChain(b, f, depth) {
  let guard = 0;
  while (b && typeof b === 'object' && guard++ < 500) {
    yield* runBlock(b, f, depth);
    b = b.next && b.next.block;
  }
}

function* runBlock(b, f, depth) {
  if (depth > 20) return;
  const i = b.inputs || {};
  switch (b.type) {
    case 'fish_forward': {
      const n = clamp(readNum(i.N, 0), -3000, 3000);
      let rem = Math.abs(n); const sg = n < 0 ? -1 : 1;
      while (rem > 0) { const st = Math.min(rem, Math.max(0.3, f.speed * 0.6)); f.move(sg * st); rem -= st; yield; }
      break;
    }
    case 'fish_turn_right': yield* turnBy(f, clamp(readNum(i.N, 0), -3600, 3600)); break;
    case 'fish_turn_left':  yield* turnBy(f, -clamp(readNum(i.N, 0), -3600, 3600)); break;
    case 'fish_random_turn': yield* turnBy(f, Math.random() * 180 - 90); break;
    case 'fish_point': f.heading = Number(b.fields && b.fields.DIR) || 0; yield; break;
    case 'fish_bounce': f.bounce = true; break;
    case 'fish_wait': { let fr = Math.round(clamp(readNum(i.N, 1), 0, 60) * 60); while (fr-- > 0) yield; break; }
    case 'fish_speed': f.speed = clamp(readNum(i.N, 3), 0, 10); break;
    case 'fish_size':  f.size = clamp(readNum(i.N, 100), 30, 300) / 100; break;
    case 'controls_repeat_ext': {
      const n = clamp(Math.floor(readNum(i.TIMES, 0)), 0, 1000);
      for (let k = 0; k < n; k++) { yield* runChain(i.DO && i.DO.block, f, depth + 1); yield; }
      break;
    }
    // しらない ブロックは なにも しない
  }
}

function* mainLoop(hat, f) {
  while (true) {
    yield* runChain(hat && hat.next && hat.next.block, f, 0);
    yield;   // 1しゅう ごとに かならず 1かい やすむ（とまらないように）
  }
}

class Fish {
  constructor(id, px, prog) {
    this.id = id;
    this.x = 60 + Math.random() * (WORLD_W - 120);
    this.y = 60 + Math.random() * (WORLD_H - 180);
    this.heading = Math.random() < 0.5 ? 0 : 180;
    this.speed = 3; this.size = 1; this.bounce = false;
    this.phase = Math.random() * 6.28;
    this.born = 0;
    this.sprite = makeSprite(px);
    let hat = null;
    try { hat = typeof prog === 'string' ? JSON.parse(prog) : prog; } catch (_) {}
    this.gen = mainLoop(hat && hat.type === 'fish_start' ? hat : null, this);
  }
  move(d) {
    const r = this.heading * Math.PI / 180;
    this.x += Math.cos(r) * d;
    this.y += Math.sin(r) * d;
    const m = 8 * 4 * this.size * 0.8, top = 20, bottom = WORLD_H - 70;
    if (this.bounce) {
      if ((this.x < m && Math.cos(r) * d < 0) || (this.x > WORLD_W - m && Math.cos(r) * d > 0)) this.heading = 180 - this.heading;
      if ((this.y < top && Math.sin(r) * d < 0) || (this.y > bottom && Math.sin(r) * d > 0)) this.heading = -this.heading;
      this.x = clamp(this.x, m, WORLD_W - m);
      this.y = clamp(this.y, top, bottom);
    } else {
      if (this.x > WORLD_W + m) this.x = -m;
      if (this.x < -m) this.x = WORLD_W + m;
      if (this.y > bottom + m) this.y = top - m;
      if (this.y < top - m) this.y = bottom + m;
    }
  }
  update() {
    try { this.gen.next(); } catch (_) { this.gen = mainLoop(null, this); }
    this.heading = ((this.heading % 360) + 360) % 360;
    this.born++;
  }
}

function makeSprite(px) {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
  const c = cv.getContext('2d');
  const s = typeof px === 'string' ? px : '';
  for (let k = 0; k < 256; k++) {
    const col = PALETTE[parseInt(s[k], 16)];
    if (col) { c.fillStyle = col; c.fillRect(k % 16, Math.floor(k / 16), 1, 1); }
  }
  return cv;
}

/* =====================================================================
   3. すいぞくかんの え（みず・すな・かいそう・あわ・おさかな）
   ===================================================================== */
class Tank {
  constructor(canvas, opts = {}) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.fish = new Map(); this.opts = opts; this.t = 0;
    this.weeds = Array.from({ length: 9 }, (_, k) => ({ x: 50 + k * 105 + Math.random() * 40, h: 5 + Math.floor(Math.random() * 6), c: Math.random() < .5 ? '#2e9e4f' : '#3fbf5f' }));
    this.bubbles = [];
    this.rocks = Array.from({ length: 6 }, () => ({ x: Math.random() * WORLD_W, w: 3 + Math.floor(Math.random() * 3) }));
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }
  add(id, px, prog) { const f = new Fish(id, px, prog); if (this.opts.dropIn) { f.y = -40; f.dropTo = 60 + Math.random() * (WORLD_H - 200); } this.fish.set(id, f); return f; }
  remove(id) { this.fish.delete(id); }
  clear() { this.fish.clear(); }
  scale() { return Math.min(this.canvas.width / WORLD_W, this.canvas.height / WORLD_H); }
  toWorld(cx, cy) {
    const s = this.scale(), ox = (this.canvas.width - WORLD_W * s) / 2, oy = (this.canvas.height - WORLD_H * s) / 2;
    return [(cx - ox) / s, (cy - oy) / s];
  }
  hit(wx, wy) {
    let best = null, bd = 1e9;
    for (const f of this.fish.values()) {
      const d = Math.hypot(f.x - wx, f.y - wy);
      if (d < 36 * f.size && d < bd) { bd = d; best = f; }
    }
    return best;
  }
  loop() {
    this.t++;
    for (const f of this.fish.values()) {
      if (f.dropTo != null) { f.y += 3; if (f.y >= f.dropTo) f.dropTo = null; if (this.t % 6 === 0) this.bubble(f.x, f.y); continue; }
      f.update();
    }
    if (this.t % 20 === 0) this.bubble(this.weeds[Math.floor(Math.random() * this.weeds.length)].x, WORLD_H - 60);
    this.draw();
    requestAnimationFrame(this.loop);
  }
  bubble(x, y) { this.bubbles.push({ x, y, r: 2 + Math.random() * 4 }); if (this.bubbles.length > 120) this.bubbles.shift(); }
  draw() {
    const c = this.ctx, s = this.scale();
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#062338'; c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    c.save();
    c.translate((this.canvas.width - WORLD_W * s) / 2, (this.canvas.height - WORLD_H * s) / 2);
    c.scale(s, s);
    c.beginPath(); c.rect(0, 0, WORLD_W, WORLD_H); c.clip();
    // みず（だんだん こく）
    const bands = ['#3aa7d8', '#2f97cc', '#2788bf', '#1f78b0', '#196aa0', '#145b8f', '#0f4d7d', '#0b406b'];
    bands.forEach((col, k) => { c.fillStyle = col; c.fillRect(0, k * WORLD_H / bands.length, WORLD_W, WORLD_H / bands.length + 1); });
    // ひかりの すじ
    c.fillStyle = 'rgba(255,255,255,.06)';
    for (let k = 0; k < 4; k++) {
      const x = ((k * 260 + this.t * 0.3) % (WORLD_W + 300)) - 150;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 60, 0); c.lineTo(x + 160, WORLD_H); c.lineTo(x + 60, WORLD_H); c.fill();
    }
    // すな
    for (let x = 0; x < WORLD_W; x += 12) for (let y = WORLD_H - 48; y < WORLD_H; y += 12) {
      const h = ((x * 7 + y * 13) % 5);
      c.fillStyle = ['#e8d28c', '#dcc47a', '#f0dc9a', '#d4b96c', '#e2cb84'][h];
      c.fillRect(x, y, 12, 12);
    }
    for (const r of this.rocks) { c.fillStyle = '#7f7f7f'; c.fillRect(r.x, WORLD_H - 60, r.w * 12, 14); c.fillStyle = '#9a9a9a'; c.fillRect(r.x + 6, WORLD_H - 60, r.w * 6, 6); }
    // かいそう（ゆらゆら）
    for (const w of this.weeds) for (let k = 0; k < w.h; k++) {
      const sway = Math.round(Math.sin(this.t / 30 + k * 0.7 + w.x) * k * 0.8);
      c.fillStyle = k % 2 ? w.c : '#26843f';
      c.fillRect(w.x + sway, WORLD_H - 60 - k * 14, 12, 14);
    }
    // あわ
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2;
    for (const b of this.bubbles) {
      b.y -= 1.2; b.x += Math.sin((b.y + b.r) / 15) * 0.4;
      c.strokeRect(Math.round(b.x), Math.round(b.y), b.r * 2, b.r * 2);
    }
    this.bubbles = this.bubbles.filter((b) => b.y > -10);
    // おさかな
    for (const f of this.fish.values()) {
      const k = 4 * f.size, bob = Math.sin(this.t / 20 + f.phase) * 2;
      c.save();
      c.translate(f.x, f.y + bob);
      c.rotate(f.heading * Math.PI / 180);
      if (Math.cos(f.heading * Math.PI / 180) < 0) c.scale(1, -1);   // ひだりむきでも さかさまに ならない
      c.drawImage(f.sprite, -8 * k, -8 * k, 16 * k, 16 * k);
      c.restore();
      if (this.opts.highlightDelete) { c.strokeStyle = '#ff5555'; c.lineWidth = 2; c.strokeRect(f.x - 8 * k, f.y - 8 * k, 16 * k, 16 * k); }
    }
    c.restore();
  }
}

/* =====================================================================
   4. データの おきば（Firebase か、この きかいだけの ローカル）
   ===================================================================== */
const FB_VERSION = '10.12.2';
const ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // まちがえやすい O0 I1 は つかわない

class LocalBackend {
  get mode() { return 'local'; }
  async init() {}
  async createRoom() { return 'LOCAL'; }
  async roomExists() { return true; }
  async isOwner() { return true; }
  list() { return store.get('local-fish') || []; }
  async addFish(room, fish) {
    const all = this.list(); all.push({ id: 'f' + Date.now() + Math.random().toString(36).slice(2, 6), ...fish });
    store.set('local-fish', all.slice(-200));
    this._emit();
  }
  async removeFish(room, id) { store.set('local-fish', this.list().filter((f) => f.id !== id)); this._emit(); }
  async clear() { store.set('local-fish', []); this._emit(); }
  watch(room, onAdd, onRemove) {
    let known = new Set();
    const sync = () => {
      const now = this.list(), ids = new Set(now.map((f) => f.id));
      for (const f of now) if (!known.has(f.id)) onAdd(f.id, f);
      for (const id of known) if (!ids.has(id)) onRemove(id);
      known = ids;
    };
    this._emit = sync;
    window.addEventListener('storage', (e) => { if (e.key === 'aquarium-local-fish') sync(); });
    sync();
  }
  _emit() {}
}

class FirebaseBackend {
  get mode() { return 'firebase'; }
  async init() {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [appMod, authMod, dbMod] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]);
    this.db$ = dbMod;
    const app = appMod.initializeApp(window.FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    const cred = await authMod.signInAnonymously(auth);   // なまえなしで ログイン（こじんじょうほうは つかわない）
    this.uid = cred.user.uid;
    this.db = dbMod.getDatabase(app);
  }
  ref(path) { return this.db$.ref(this.db, path); }
  async createRoom() {
    for (let tries = 0; tries < 10; tries++) {
      let code = '';
      for (let k = 0; k < 5; k++) code += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)];
      try {
        await this.db$.set(this.ref(`rooms/${code}/owner`), this.uid);   // ルールで「まだ ない へや」だけ つくれる
        await this.db$.set(this.ref(`rooms/${code}/createdAt`), this.db$.serverTimestamp());
        return code;
      } catch (_) { /* もう ある ばんごう → つくりなおす */ }
    }
    throw new Error('へやを つくれませんでした');
  }
  async roomExists(room) { return (await this.db$.get(this.ref(`rooms/${room}/owner`))).exists(); }
  async isOwner(room) { return (await this.db$.get(this.ref(`rooms/${room}/owner`))).val() === this.uid; }
  async addFish(room, fish) {
    await this.db$.push(this.ref(`rooms/${room}/fish`), { ...fish, by: this.uid, t: this.db$.serverTimestamp() });
  }
  async removeFish(room, id) { await this.db$.remove(this.ref(`rooms/${room}/fish/${id}`)); }
  async clear(room) { await this.db$.remove(this.ref(`rooms/${room}/fish`)); }
  watch(room, onAdd, onRemove) {
    const r = this.db$.query(this.ref(`rooms/${room}/fish`), this.db$.limitToLast(200));
    this.db$.onChildAdded(r, (snap) => onAdd(snap.key, snap.val()));
    this.db$.onChildRemoved(r, (snap) => onRemove(snap.key));
  }
}

const cfg = window.FIREBASE_CONFIG || {};
const backend = (cfg.apiKey && cfg.databaseURL) ? new FirebaseBackend() : new LocalBackend();
const ready = backend.init();

/* =====================================================================
   5. すいぞくかん がめん（?view=tank&room=XXXXX）
   ===================================================================== */
async function startTankView() {
  document.body.classList.add('tank');
  const canvas = document.getElementById('tank');
  const fit = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  fit(); addEventListener('resize', fit);
  const tank = new Tank(canvas, { dropIn: true });
  const notice = document.getElementById('tankNotice');
  const info = document.getElementById('tankInfo');
  const banner = document.getElementById('banner');
  const room = (params.get('room') || '').toUpperCase() || 'LOCAL';

  try { await ready; } catch (e) { notice.textContent = '⚠ Firebase に つながりません：' + e.message; return; }
  if (backend.mode === 'local') document.getElementById('tankBar').classList.add('isOwner');
  else {
    if (!(await backend.roomExists(room))) { notice.textContent = `へや「${room}」は みつかりません`; return; }
    if (await backend.isOwner(room)) document.getElementById('tankBar').classList.add('isOwner');
  }

  let first = true, bannerTimer = null;
  const showCount = () => {
    info.textContent = `へや：${room}　🐟 ${tank.fish.size}ひき`;
    notice.innerHTML = tank.fish.size ? '' : 'まだ おさかなが いないよ<br>みんなの おさかなを まっています…';
  };
  backend.watch(room, (id, f) => {
    tank.add(id, f.px, f.prog);
    showCount();
    if (!first) {
      banner.textContent = '🐟 あたらしい なかまが きたよ！'; banner.style.opacity = 1;
      clearTimeout(bannerTimer); bannerTimer = setTimeout(() => (banner.style.opacity = 0), 2500);
    }
  }, (id) => { tank.remove(id); showCount(); });
  setTimeout(() => { first = false; }, 1500);
  showCount();

  // せんせい：さかなを けす
  const delBtn = document.getElementById('delMode');
  let delMode = false;
  delBtn.addEventListener('click', () => {
    delMode = !delMode; tank.opts.highlightDelete = delMode;
    delBtn.textContent = `🗑 けすモード：${delMode ? 'オン' : 'オフ'}`;
  });
  canvas.addEventListener('click', (e) => {
    if (!delMode) return;
    const [wx, wy] = tank.toWorld(e.offsetX, e.offsetY);
    const f = tank.hit(wx, wy);
    if (f) backend.removeFish(room, f.id).catch((err) => alertBar('けせませんでした：' + err.message));
  });
  const clearBtn = document.getElementById('clearAll');
  let armed = null;
  clearBtn.addEventListener('click', () => {
    if (!armed) {   // 2かい おして かくにん
      clearBtn.textContent = 'ほんとうに けす？'; armed = setTimeout(() => { clearBtn.textContent = 'ぜんぶ けす'; armed = null; }, 3000);
      return;
    }
    clearTimeout(armed); armed = null; clearBtn.textContent = 'ぜんぶ けす';
    backend.clear(room).catch((err) => alertBar('けせませんでした：' + err.message));
  });
  document.getElementById('fullBtn').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
  });
  function alertBar(t) { banner.textContent = t; banner.style.opacity = 1; setTimeout(() => (banner.style.opacity = 0), 3000); }
}

/* =====================================================================
   6. つくる がめん
   ===================================================================== */
function startMakeView() {
  // --- ブロック ---
  const workspace = Blockly.inject('blocklyDiv', {
    toolbox, renderer: 'zelos', trashcan: true,
    zoom: { controls: true, wheel: true, startScale: 0.9 },
    move: { scrollbars: true, drag: true, wheel: false }
  });
  try { Blockly.serialization.workspaces.load(store.get('program') || DEFAULT_PROGRAM, workspace); }
  catch (_) { Blockly.serialization.workspaces.load(DEFAULT_PROGRAM, workspace); }
  if (!workspace.getBlocksByType('fish_start').length) {
    Blockly.serialization.blocks.append({ type: 'fish_start', x: 30, y: 30, deletable: false }, workspace);
  }
  addEventListener('resize', () => Blockly.svgResize(workspace));

  // 「はじまったら」の ブロックを、id や いちを のぞいて とりだす（おくる データを ちいさく）
  function programJson() {
    const hat = workspace.getBlocksByType('fish_start')[0];
    if (!hat) return null;
    const strip = (o) => {
      if (Array.isArray(o)) return o.map(strip);
      if (o && typeof o === 'object') {
        const r = {};
        for (const [k, v] of Object.entries(o)) if (!['id', 'x', 'y', 'deletable', 'movable', 'editable'].includes(k)) r[k] = strip(v);
        return r;
      }
      return o;
    };
    return strip(Blockly.serialization.blocks.save(hat));
  }

  // --- ドットの え ---
  const ed = document.getElementById('editor'), ec = ed.getContext('2d');
  const C = 20;
  let px = (store.get('pixels') || SAMPLE_FISH).split('');
  if (px.length !== 256) px = SAMPLE_FISH.split('');
  let color = 4, painting = false;

  function drawEditor() {
    for (let k = 0; k < 256; k++) {
      const x = (k % 16) * C, y = Math.floor(k / 16) * C, col = PALETTE[parseInt(px[k], 16)];
      ec.fillStyle = col || (((k % 16) + Math.floor(k / 16)) % 2 ? '#e6e6e6' : '#f7f7f7');
      ec.fillRect(x, y, C, C);
    }
    ec.strokeStyle = 'rgba(0,0,0,.12)';
    for (let k = 1; k < 16; k++) {
      ec.beginPath(); ec.moveTo(k * C + .5, 0); ec.lineTo(k * C + .5, 320); ec.stroke();
      ec.beginPath(); ec.moveTo(0, k * C + .5); ec.lineTo(320, k * C + .5); ec.stroke();
    }
  }
  function paintAt(e) {
    const rect = ed.getBoundingClientRect();
    const cx = Math.floor((e.clientX - rect.left) / rect.width * 16), cy = Math.floor((e.clientY - rect.top) / rect.height * 16);
    if (cx < 0 || cy < 0 || cx > 15 || cy > 15) return;
    const v = color.toString(16);
    if (px[cy * 16 + cx] !== v) { px[cy * 16 + cx] = v; drawEditor(); changed(); }
  }
  ed.addEventListener('pointerdown', (e) => { painting = true; ed.setPointerCapture(e.pointerId); paintAt(e); });
  ed.addEventListener('pointermove', (e) => { if (painting) paintAt(e); });
  ed.addEventListener('pointerup', () => { painting = false; });

  const pal = document.getElementById('palette');
  PALETTE.forEach((col, k) => {
    const b = document.createElement('button');
    b.className = 'sw' + (k === 0 ? ' eraser' : '') + (k === color ? ' on' : '');
    if (col) b.style.background = col;
    b.title = k === 0 ? 'けしゴム' : col;
    b.addEventListener('click', () => { color = k; pal.querySelectorAll('.sw').forEach((s) => s.classList.remove('on')); b.classList.add('on'); });
    pal.append(b);
  });
  document.getElementById('clearPx').addEventListener('click', () => { px = Array(256).fill('0'); drawEditor(); changed(); });
  document.getElementById('samplePx').addEventListener('click', () => { px = SAMPLE_FISH.split(''); drawEditor(); changed(); });
  document.getElementById('flipPx').addEventListener('click', () => {
    const n = []; for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) n.push(px[y * 16 + (15 - x)]);
    px = n; drawEditor(); changed();
  });

  // --- ためしに およがせる ---
  const preview = new Tank(document.getElementById('preview'));
  let restartTimer = null;
  function restartPreview() {
    preview.clear();
    const f = preview.add('me', px.join(''), programJson());
    f.x = WORLD_W / 2; f.y = WORLD_H / 2 - 40; f.heading = 0;
  }
  function changed() {
    store.set('pixels', px.join(''));
    clearTimeout(restartTimer); restartTimer = setTimeout(restartPreview, 400);
  }
  workspace.addChangeListener((e) => {
    if (e.isUiEvent) return;
    store.set('program', Blockly.serialization.workspaces.save(workspace));
    clearTimeout(restartTimer); restartTimer = setTimeout(restartPreview, 400);
  });
  drawEditor();
  restartPreview();

  // --- すいぞくかんに いれる ---
  const roomInput = document.getElementById('roomInput');
  const sendMsg = document.getElementById('sendMsg');
  roomInput.value = (params.get('room') || store.get('room') || '').toUpperCase();
  const say = (t, ok) => { sendMsg.textContent = t; sendMsg.className = ok ? 'ok' : 'ng'; };

  ready.then(() => {
    const banner = document.getElementById('modeBanner');
    if (backend.mode === 'local') {
      banner.style.display = 'block';
      banner.innerHTML = 'いまは <b>この きかい だけの すいぞくかん</b>（ローカルモード）です。<br>' +
        'すいぞくかんの がめんは <a href="aquarium.html?view=tank">こちら</a>（べつの タブで ひらいてね）。';
      roomInput.value = 'LOCAL'; roomInput.disabled = true;
    }
  }).catch((e) => say('⚠ Firebase に つながりません：' + e.message));

  document.getElementById('send').addEventListener('click', async () => {
    const room = roomInput.value.trim().toUpperCase();
    if (!room) return say('へやの ばんごうを いれてね');
    if (px.every((v) => v === '0')) return say('おさかなを かいてね');
    const prog = JSON.stringify(programJson());
    if (prog.length > 8000) return say('ブロックが おおすぎるよ。すこし へらしてね');
    const sent = store.get('sent-' + room) || 0;
    if (sent >= MAX_FISH_PER_DEVICE) return say(`この へやには もう ${MAX_FISH_PER_DEVICE}ひき いれたよ`);
    try {
      await ready;
      if (!(await backend.roomExists(room))) return say(`へや「${room}」は みつからないよ。ばんごうを たしかめてね`);
      await backend.addFish(room, { px: px.join(''), prog });
      store.set('room', room);
      store.set('sent-' + room, sent + 1);
      say(`🎉 すいぞくかんに はいったよ！（${sent + 1}ひきめ）`, true);
    } catch (e) {
      say('⚠ おくれませんでした：' + e.message);
    }
  });

  // --- せんせい：へやを つくる ---
  if (IS_SENSEI) {
    document.getElementById('teacher').style.display = 'block';
    const base = location.href.split('?')[0];
    const show = (code) => {
      document.getElementById('roomCode').textContent = code;
      document.getElementById('roomLinks').innerHTML =
        `<b>すいぞくかん（おおきな がめんで ひらく）</b><a href="${base}?view=tank&room=${code}" target="_blank">${base}?view=tank&room=${code}</a>` +
        `<b>こどもに くばる URL</b><a href="${base}?room=${code}" target="_blank">${base}?room=${code}</a>`;
    };
    const last = store.get('teacher-room');
    if (last) show(last);
    document.getElementById('newRoom').addEventListener('click', async () => {
      const tm = document.getElementById('teacherMsg');
      try {
        await ready;
        const code = await backend.createRoom();
        store.set('teacher-room', code);
        show(code);
        tm.textContent = backend.mode === 'local'
          ? 'ローカルモードでは へやは 1つ（LOCAL）だけです。'
          : 'へやを つくりました。けす そうさは、へやを つくった この ブラウザから できます。';
      } catch (e) { tm.textContent = '⚠ ' + e.message; }
    });
  }
}

if (IS_TANK) startTankView(); else startMakeView();
</script>
