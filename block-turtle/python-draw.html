/* ========== カメ（タートル）と おえかき（index.html と おなじ かきかた） ========== */
const DW = 400, DH = 400, MAX_CMDS = 20000, MAX_LOOPS = 100000;
const guideCtx = document.getElementById('guide').getContext('2d');
const paperCtx = document.getElementById('paper').getContext('2d');
const tctx = document.getElementById('turtle').getContext('2d');
let turtle = null, timer = null, goalCmds = [];
const newTurtle = () => ({ x: DW / 2, y: DH / 2, angle: 0, down: true, color: '#222222', width: 3 });
const randomColor = () => `hsl(${Math.floor(Math.random() * 360)}, 80%, 50%)`;
function line(ctx, x1, y1, x2, y2, color, width) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function applyInstant(tt, c) {
  if (c.t === 'color') tt.color = c.v === 'random' ? randomColor() : c.v;
  if (c.t === 'width') tt.width = c.v;
  if (c.t === 'pen') tt.down = c.v;
  if (c.t === 'home') { tt.x = DW / 2; tt.y = DH / 2; tt.angle = 0; }
}
// めいれい 1つを カメに やらせる（style が あれば いろ・ふとさを うわがき）
function doCmd(ctx, tt, c, style) {
  if (c.t === 'move') {
    const rad = tt.angle * Math.PI / 180, nx = tt.x + c.v * Math.sin(rad), ny = tt.y - c.v * Math.cos(rad);
    if (tt.down) line(ctx, tt.x, tt.y, nx, ny, style ? style.color : tt.color, style ? style.width : tt.width);
    tt.x = nx; tt.y = ny;
  } else if (c.t === 'turn') tt.angle += c.v;
  else applyInstant(tt, c);
}
function drawCmds(ctx, cmds, style) { const tt = newTurtle(); for (const c of cmds) doCmd(ctx, tt, c, style); }
function drawTurtle() {
  tctx.clearRect(0, 0, DW, DH);
  tctx.save(); tctx.translate(turtle.x, turtle.y); tctx.rotate(turtle.angle * Math.PI / 180);
  tctx.fillStyle = '#2e7d32'; tctx.beginPath(); tctx.moveTo(0, -12); tctx.lineTo(9, 9); tctx.lineTo(-9, 9); tctx.closePath(); tctx.fill();
  tctx.restore();
}
function draw() { drawTurtle(); }
// せんの ピクセルを くらべる（index.html と おなじ はんてい）
function coverage(thinCmds, thickCmds) {
  const make = (cmds, width) => {
    const cv = document.createElement('canvas'); cv.width = DW; cv.height = DH;
    const ctx = cv.getContext('2d'); drawCmds(ctx, cmds, { color: '#000', width });
    return ctx.getImageData(0, 0, DW, DH).data;
  };
  const thin = make(thinCmds, 2), thick = make(thickCmds, 12);
  let total = 0, hit = 0;
  for (let p = 3; p < thin.length; p += 4) if (thin[p] > 0) { total++; if (thick[p] > 0) hit++; }
  return total ? hit / total : 0;
}
class Stop { constructor(kind, text, why) { this.kind = kind; this.text = text; this.why = why; } }
// プログラムを うごかして めいれいの リストを つくり、お手本と くらべる
function runTurtle(code, withJudge) {
  const frames = []; let blockId = null, loops = 0;
  const push = (c) => { if (frames.length >= MAX_CMDS) throw new Stop('ng', t('tooMany')); frames.push({ ...c, id: blockId, event: c.t }); };
  const api = {
    highlight: (id) => { blockId = id; },
    loopGuard: () => { if (++loops > MAX_LOOPS) throw new Stop('ng', t('endless')); },
    forward: (d) => push({ t: 'move', v: Number(d) || 0 }),
    turn: (a) => push({ t: 'turn', v: Number(a) || 0 }),
    home: () => push({ t: 'home' }),
    penColor: (c) => push({ t: 'color', v: c }),
    penWidth: (w) => push({ t: 'width', v: Math.max(1, Math.min(50, Number(w) || 1)) }),
    pen: (d) => push({ t: 'pen', v: d })
  };
  try { new Function(...Object.keys(api), code)(...Object.values(api)); }
  catch (e) { return { frames, result: e instanceof Stop ? e : new Stop('ng', /^\w*Error/.test(e.message) ? e.message : '⚠ ' + e.message) }; }
  if (!withJudge) return { frames, result: new Stop('ok', '') };
  const a = coverage(goalCmds, frames), b = coverage(frames, goalCmds);
  if (a >= 0.95 && b >= 0.95) return { frames, result: new Stop('ok', t('correct')) };
  return { frames, result: new Stop('ng', a >= 0.6 ? t('close', Math.floor(a * 100), b < 0.95) : t('wrong'), 'shape') };
}
function simulate(code) { return runTurtle(code, true); }

// こうかおん（ブロックでおえかき・めいろと おなじ 8ビットの おと）
const Sound = {
  ctx: null, master: null, muted: (() => { try { return localStorage.getItem(SAVE_KEY + '-muted') === '1'; } catch (_) { return false; } })(), stepFoot: 0,
  // ブラウザは ボタンを おすまで おとを ならせないので、さいしょの クリックで じゅんび
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.25;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  // 1つの おと：type=なみの かたち, f1→f2 に たかさを かえる, len=びょう
  tone(type, f1, f2, len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + len + 0.02);
  },
  noise(len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * len), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain(), lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.buffer = buf; src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t);
  },
  notes(list, type = 'square', vol = 0.6) {   // list: [[ヘルツ, はじまり(びょう), ながさ(びょう)], ...]
    for (const [f, at, len] of list) this.tone(type, f, f, len, at, vol);
  },

  // --- つかう おと ---
  step() {                                   // あしおと（ひだり・みぎで すこし たかさを かえる）
    this.stepFoot ^= 1;
    this.noise(0.07, 0, 0.5);
    this.tone('square', this.stepFoot ? 330 : 294, this.stepFoot ? 220 : 196, 0.07, 0, 0.35);
  },
  turnRight() { this.tone('triangle', 520, 880, 0.12, 0, 0.7); },   // ひゅっ↑
  turnLeft()  { this.tone('triangle', 880, 520, 0.12, 0, 0.7); },   // ひゅっ↓
  crash() {                                  // ゴンッ
    this.noise(0.35, 0, 1);
    this.tone('square', 140, 50, 0.35, 0, 0.8);
  },
  clear() {                                  // ステージ クリア：ドミソド〜
    this.notes([[523, 0, .12], [659, .12, .12], [784, .24, .12], [1047, .36, .45]]);
    this.notes([[392, .36, .45], [659, .36, .45]], 'triangle', 0.5);
  },
  goalSoSo() { this.notes([[784, 0, .12], [1047, .14, .25]]); },      // ゴールしたけど めやすオーバー
  fail()  { this.notes([[392, 0, .16], [330, .18, .16], [262, .36, .35]], 'square', 0.5); },  // ざんねん
  grandClear() {                             // チュートリアル ぜんぶ クリア
    const m = [[523, 0, .1], [523, .12, .1], [523, .24, .1], [523, .36, .3], [415, .7, .3], [466, 1.0, .3], [523, 1.3, .15], [466, 1.5, .1], [523, 1.62, .7]];
    this.notes(m);
    this.notes([[262, 1.3, 1.0], [330, 1.3, 1.0], [392, 1.3, 1.0]], 'triangle', 0.4);
  },
  toggle() {
    this.muted = !this.muted; try { localStorage.setItem(SAVE_KEY + '-muted', this.muted ? '1' : '0'); } catch (_) {}
    return this.muted;
  }
};
let lastSfx = 0;
function cueSound(c) {   // すすむ・まわる ときの おと（なりすぎない ように 0.045びょう あける）
  const now = performance.now();
  if (now - lastSfx < 45) return;
  lastSfx = now;
  if (c.t === 'move') Sound.step();
  else if (c.t === 'turn') { if (c.v > 0) Sound.turnRight(); else Sound.turnLeft(); }
}
