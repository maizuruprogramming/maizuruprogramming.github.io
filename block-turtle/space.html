<!DOCTYPE html>
<html lang="ja">
<head>

<script>

const t = makeT(STR);
const L = (item, k) => (LANG === 'en' && item.en && item.en[k] !== undefined) ? item.en[k] : item[k];

/* ========== 1. オリジナルのブロック ========== */
const DIRS = [[t('dirF'), 'F'], [t('dirR'), 'R'], [t('dirL'), 'L']];
const COL = { move: '#2a8fbd', pick: '#c99a06', loop: '#7b52c7', iff: '#c2185b' };

Blockly.common.defineBlocksWithJsonArray([
  { type: 'sp_forward', message0: t('bForward'), previousStatement: null, nextStatement: null, colour: COL.move },
  { type: 'sp_right', message0: t('bRight'), previousStatement: null, nextStatement: null, colour: COL.move },
  { type: 'sp_left', message0: t('bLeft'), previousStatement: null, nextStatement: null, colour: COL.move },
  { type: 'sp_pickup', message0: t('bPick'), previousStatement: null, nextStatement: null, colour: COL.pick },
  { type: 'sp_if_star', message0: t('bIfStar'),
    message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
    previousStatement: null, nextStatement: null, colour: COL.pick },
  { type: 'sp_until_mission', message0: t('bUntil'),
    message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
    previousStatement: null, nextStatement: null, colour: COL.loop },
  { type: 'sp_ifelse', message0: t('bIf'),
    args0: [{ type: 'field_dropdown', name: 'DIR', options: DIRS }],
    message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
    message2: t('bElse'), args2: [{ type: 'input_statement', name: 'ELSE' }],
    previousStatement: null, nextStatement: null, colour: COL.iff }
]);

/* ========== 2. ブロック → JavaScript ========== */
const gen = javascript.javascriptGenerator;
gen.STATEMENT_PREFIX = 'highlight(%1);\n';   // いま うごいている ブロックを光らせる
gen.addReservedWords('highlight');
gen.forBlock['sp_forward'] = () => 'forward();\n';
gen.forBlock['sp_right']   = () => 'turnRight();\n';
gen.forBlock['sp_left']    = () => 'turnLeft();\n';
gen.forBlock['sp_pickup']  = () => 'pickUp();\n';
gen.forBlock['sp_if_star'] = (b, g) => `if (hasStar()) {\n${g.statementToCode(b, 'DO')}}\n`;
gen.forBlock['sp_until_mission'] = (b, g) => `while (!missionDone()) {\n  loopGuard();\n${g.statementToCode(b, 'DO')}}\n`;
gen.forBlock['sp_ifelse'] = (b, g) =>
  `if (isOpen('${b.getFieldValue('DIR')}')) {\n${g.statementToCode(b, 'DO')}} else {\n${g.statementToCode(b, 'ELSE')}}\n`;

/* ========== 3. ステージ ==========
   map の きごう：S=スタート  G=ゴール（ロケット）  *=ほし  #=いんせき  .=うちゅう
   dir（さいしょの むき）：0=うえ 1=みぎ 2=した 3=ひだり */
const MOVE = ['sp_forward', 'sp_right', 'sp_left'];
const ALL  = [...MOVE, 'sp_pickup', 'controls_repeat_ext', 'sp_if_star', 'sp_until_mission', 'sp_ifelse'];

const LEVELS = [
  { title: 'ステージ1　ほしを ひろおう',
    en: { title: 'Stage 1: Pick up a star', text: 'Pick up every star ⭐, then board the rocket 🚀! Use "pick up star" on a star square.', hint: 'Forward 2 → pick up star → forward 2' },
    text: 'ほし ⭐ を ぜんぶ ひろってから、ロケット 🚀 に のりこもう！ ほしの マスで「ほしを ひろう」を つかうよ。',
    hint: '2マス すすむ → ほしを ひろう → 2マス すすむ',
    map: ['#####', '#####', 'S.*.G', '#####', '#####'], dir: 1, blocks: ['sp_forward', 'sp_pickup'] },
  { title: 'ステージ2　まがって あつめよう',
    en: { title: 'Stage 2: Turn and collect', text: 'There are 2 stars. Be careful where you turn.', hint: 'Forward 2 and pick up → forward 1 → turn right → forward 1 and pick up → forward 1' },
    text: 'ほしが 2こ あるよ。まがる ところに きを つけよう。',
    hint: '2マス すすんで ひろう → 1マス すすむ → みぎを むく → 1マス すすんで ひろう → 1マス すすむ',
    map: ['S.*.#', '###*#', '###G#', '#####', '#####'], dir: 1, blocks: [...MOVE, 'sp_pickup'] },
  { title: 'ステージ3　くりかえしで あつめよう',
    en: { title: 'Stage 3: Collect with a loop', text: 'The stars are in a row. Put "move → pick up" into a loop.', hint: '"repeat 3 (move forward → pick up star)" → "move forward"' },
    text: 'ほしが ならんでいるよ。「すすむ → ひろう」を くりかえしで まとめよう。',
    hint: '「3かい くりかえす（まえに すすむ → ほしを ひろう）」→「まえに すすむ」',
    map: ['#####', '#####', 'S***G', '#####', '#####'], dir: 1, blocks: [...MOVE, 'sp_pickup', 'controls_repeat_ext'], limit: 4 },
  { title: 'ステージ4　ほしの かいだん',
    en: { title: 'Stage 4: Star stairs', text: 'There are stars on the stairs. Find the set of moves that repeats.', hint: 'Repeat "forward → turn right → forward → pick up → turn left". You finish when you reach the rocket.' },
    text: 'かいだんの とちゅうに ほしが あるよ。くりかえす セットを みつけよう。',
    hint: '「すすむ → みぎを むく → すすむ → ひろう → ひだりを むく」を くりかえす。さいごは ロケットに ついた ところで おわるよ。',
    map: ['###.G', '##.*#', '#.*##', '.*###', 'S####'], dir: 0, blocks: [...MOVE, 'sp_pickup', 'controls_repeat_ext'], limit: 6 },
  { title: 'ステージ5　もし ほしが あったら',
    en: { title: 'Stage 5: If there is a star', text: 'Some squares have stars and some don\'t. Picking up where there is no star is a mistake! Let the explorer check first.', hint: '"repeat 4: move forward → if there is a star here, pick it up"' },
    text: 'ほしが ある マスと ない マスが あるよ。ない ところで「ひろう」と しっぱい！ たんけんかに しらべさせよう。',
    hint: '「4かい くりかえす：まえに すすむ → もし ここに ほしが あったら ひろう」',
    map: ['#####', '#####', 'S*.*G', '#####', '#####'], dir: 1,
    blocks: [...MOVE, 'sp_pickup', 'controls_repeat_ext', 'sp_if_star'], limit: 4 },
  { title: 'ステージ6　ミッション クリアまで',
    en: { title: 'Stage 6: Until mission complete', text: 'Stars are scattered around a spiral. Use "repeat until mission complete" and check as you go.', hint: 'Inside the loop: if there is a star, pick it up → if front is open, move forward, else turn right' },
    text: 'うずまきの うちゅうに ほしが ちらばっているよ。「ミッション クリアまで くりかえす」で、しらべながら すすもう。',
    hint: 'くりかえしの なかで：もし ほしが あったら ひろう → もし まえが あいていたら すすむ、そうでなければ みぎを むく',
    map: ['S..*.', '####.', '.*G#.', '.###*', '.*...'], dir: 1,
    blocks: [...MOVE, 'sp_pickup', 'sp_if_star', 'sp_until_mission', 'sp_ifelse'], limit: 6 },
  { title: 'ステージ7　どんな うちゅうでも！',
    en: { title: 'Stage 7: Any space!', text: 'Final challenge! Your program is tested in 30 random spaces. Collect all the stars and board the rocket to clear!', hint: 'Use the "right-hand rule" to follow the walls, and pick up stars when you find them. It\'s OK to pass the rocket — keep walking until you have every star.' },
    text: 'さいごの ちょうせん！ ランダムな うちゅう 30こで テストするよ。ほしを ぜんぶ あつめて ロケットに のれたら クリア！',
    hint: '「みぎての ほうそく」で かべに そって すすみながら、ほしが あったら ひろおう。ロケットを とおりすぎても だいじょうぶ。ほしを ぜんぶ ひろうまで あるきつづけよう。',
    mode: 'test', blocks: ALL },
  { title: 'じゆうモード　ランダムうちゅう',
    en: { title: 'Free mode: Random space', text: 'Play freely in random spaces. 🎲 makes a new space.', hint: '' },
    text: 'ランダムな うちゅうで じゆうに あそぼう。🎲で あたらしい うちゅうが でるよ。',
    hint: '', mode: 'free', blocks: ALL }

/* ---------- ステージの こたえ（先生モード ?sensei で よみこめる） ---------- */
{
  const chain = (list) => list.reduceRight((next, b) => next ? { ...b, next: { block: next } } : b, null);
  const f = () => ({ type: 'sp_forward' }), r = () => ({ type: 'sp_right' }), l = () => ({ type: 'sp_left' }), p = () => ({ type: 'sp_pickup' });
  const repeat = (n, body) => ({ type: 'controls_repeat_ext',
    inputs: { TIMES: { shadow: { type: 'math_number', fields: { NUM: n } } }, DO: { block: chain(body) } } });
  const ifStar = (body) => ({ type: 'sp_if_star', inputs: { DO: { block: chain(body) } } });
  const until = (body) => ({ type: 'sp_until_mission', inputs: { DO: { block: chain(body) } } });
  const ifElse = (dir, yes, no) => ({ type: 'sp_ifelse', fields: { DIR: dir }, inputs: { DO: { block: chain(yes) }, ELSE: { block: chain(no) } } });
  const program = (body) => ({ blocks: { languageVersion: 0, blocks: [{ ...chain(body), x: 30, y: 30 }] } });
  const RIGHT_HAND = [until([ifStar([p()]), ifElse('R', [r(), f()], [ifElse('F', [f()], [l()])])])];
  const ANSWERS = [
    program([f(), f(), p(), f(), f()]),
    program([f(), f(), p(), f(), r(), f(), p(), f()]),
    program([repeat(3, [f(), p()]), f()]),
    program([repeat(4, [f(), r(), f(), p(), l()])]),
    program([repeat(4, [f(), ifStar([p()])])]),
    program([until([ifStar([p()]), ifElse('F', [f()], [r()])])]),
    program(RIGHT_HAND),
    program(RIGHT_HAND)
  ];
  LEVELS.forEach((lv, i) => { lv.answer = ANSWERS[i]; });
}

/* ========== 4. ワークスペース ========== */
const flyout = (types) => ({
  kind: 'flyoutToolbox',
  contents: types.map((t) => t === 'controls_repeat_ext'
    ? { kind: 'block', type: t, inputs: { TIMES: { shadow: { type: 'math_number', fields: { NUM: 3 } } } } }
    : { kind: 'block', type: t })
});

const spaceTheme = Blockly.Theme.defineTheme('space', {
  base: Blockly.Themes.Classic,
  blockStyles: {
    loop_blocks: { colourPrimary: COL.loop, colourSecondary: '#9a7ae0', colourTertiary: '#4e2f8f' },
    math_blocks: { colourPrimary: '#5a5f8f', colourSecondary: '#7a80b0', colourTertiary: '#353a66' }
  },
  componentStyles: {
    workspaceBackgroundColour: '#0d1130', toolboxBackgroundColour: '#1a1f4d', flyoutBackgroundColour: '#20265a',
    flyoutOpacity: 1, scrollbarColour: '#6a74d8', insertionMarkerColour: '#ffe066'
  },
  fontStyle: { family: 'DotGothic16, monospace', size: 12 }
});

const workspace = Blockly.inject('blocklyDiv', {
  toolbox: flyout(ALL), renderer: 'zelos', theme: spaceTheme, trashcan: true,
  grid: { spacing: 24, length: 2, colour: '#3a4290', snap: true },
  zoom: { controls: true, wheel: true, startScale: 0.95 },
  move: { scrollbars: true, drag: true, wheel: false }
});

const SAVE_KEY = 'block-space';
const store = {
  get(k)    { try { return JSON.parse(localStorage.getItem(SAVE_KEY + k)); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(SAVE_KEY + k, JSON.stringify(v)); } catch (_) {} }
};

let levelIndex = 0, loading = false;
workspace.addChangeListener((e) => {
  if (e.isUiEvent || loading) return;
  store.set('-ws-' + levelIndex, Blockly.serialization.workspaces.save(workspace));
  updateInfo();
});

/* ========== 5. うちゅうの めいろ ========== */
const N = 5, CELL = 80;
const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];   // 0:うえ 1:みぎ 2:した 3:ひだり
let rocks = [], stars = [], START = { r: 0, c: 0, dir: 1 }, GOAL = { r: 4, c: 4 };
const key = (r, c) => r * N + c;

function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }
function free(r, c)   { return inside(r, c) && !rocks[r][c]; }

function loadMap(map, dir) {
  stars = [];
  rocks = map.map((row, r) => [...row].map((ch, c) => {
    if (ch === 'S') START = { r, c, dir };
    if (ch === 'G') GOAL = { r, c };
    if (ch === '*') stars.push(key(r, c));
    return ch === '#';
  }));
}

function solvable(rk) {
  const ok = (r, c) => inside(r, c) && !rk[r][c];
  const seen = new Set([0]); const q = [[0, 0]];
  while (q.length) {
    const [r, c] = q.shift();
    if (r === N - 1 && c === N - 1) return true;
    for (let d = 0; d < 4; d++) {
      const nr = r + DR[d], nc = c + DC[d];
      if (ok(nr, nc) && !seen.has(key(nr, nc))) { seen.add(key(nr, nc)); q.push([nr, nc]); }
    }
  }
  return false;
}

// みぎての ほうそくで とおる マス（ほしを おく ばしょの こうほ）
function wallFollowCells(rk) {
  const ok = (r, c) => inside(r, c) && !rk[r][c];
  let s = { r: 0, c: 0, dir: 1 };
  const cells = new Set(), seenState = new Set();
  for (let i = 0; i < 400; i++) {
    const st = s.r * 100 + s.c * 10 + s.dir;
    if (seenState.has(st)) break;
    seenState.add(st); cells.add(key(s.r, s.c));
    const rd = (s.dir + 1) % 4;
    if (ok(s.r + DR[rd], s.c + DC[rd])) { s.dir = rd; s.r += DR[rd]; s.c += DC[rd]; }
    else if (ok(s.r + DR[s.dir], s.c + DC[s.dir])) { s.r += DR[s.dir]; s.c += DC[s.dir]; }
    else s.dir = (s.dir + 3) % 4;
  }
  return [...cells];
}

// ランダムな うちゅう：スタート ひだりうえ・みぎむき、ロケット みぎした、ほし 3こ
function randomSpace(k) {
  for (;;) {
    const rk = Array.from({ length: N }, () => Array(N).fill(false));
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (r + c > 1 && !(r === N - 1 && c === N - 1)) cells.push([r, c]);
    for (let i = 0; i < k; i++) {
      const [r, c] = cells.splice(Math.floor(Math.random() * cells.length), 1)[0];
      rk[r][c] = true;
    }
    if (!solvable(rk)) continue;
    const cand = wallFollowCells(rk).filter((x) => x !== key(0, 0) && x !== key(N - 1, N - 1));
    if (cand.length < 3) continue;
    const st = [];
    while (st.length < 3) st.push(cand.splice(Math.floor(Math.random() * cand.length), 1)[0]);
    return { rocks: rk, stars: st };
  }
}

function setRandomSpace(sp) {
  rocks = sp.rocks; stars = sp.stars.slice(); START = { r: 0, c: 0, dir: 1 }; GOAL = { r: N - 1, c: N - 1 };
  store.set('-random', sp);
  resetRobot();
}

/* ========== 6. プログラムを しらべて、うごきの きろくを つくる ========== */
const MAX_MOVES = 400, MAX_LOOPS = 2000;
class Stop { constructor(kind, text, why) { this.kind = kind; this.text = text; this.why = why; } }

function simulate(code) {
  const s = { ...START };
  const left = new Set(stars);
  const frames = [];
  let blockId = null, loops = 0;
  const atGoal = () => s.r === GOAL.r && s.c === GOAL.c;
  const rec = (event, extra) => {
    frames.push({ r: s.r, c: s.c, dir: s.dir, id: blockId, event, ...extra });
    if (frames.length > MAX_MOVES) throw new Stop('ng', t('tooManyMoves', MAX_MOVES));
  };
  const api = {
    highlight: (id) => { blockId = id; },
    forward: () => {
      const nr = s.r + DR[s.dir], nc = s.c + DC[s.dir];
      if (!free(nr, nc)) { rec('crash'); throw new Stop('ng', t('crash'), 'crash'); }
      s.r = nr; s.c = nc; rec('move');
      if (atGoal() && left.size === 0) throw new Stop('ok', 'goal');
    },
    turnRight: () => { s.dir = (s.dir + 1) % 4; rec('turn'); },
    turnLeft:  () => { s.dir = (s.dir + 3) % 4; rec('turn'); },
    pickUp: () => {
      const k = key(s.r, s.c);
      if (!left.has(k)) { rec('miss'); throw new Stop('ng', t('noStar'), 'miss'); }
      left.delete(k); rec('pick', { star: k, remain: left.size });
    },
    hasStar: () => left.has(key(s.r, s.c)),
    isOpen: (which) => {
      const d = (s.dir + { F: 0, R: 1, L: 3 }[which]) % 4;
      return free(s.r + DR[d], s.c + DC[d]);
    },
    missionDone: () => atGoal() && left.size === 0,
    loopGuard: () => { if (++loops > MAX_LOOPS) throw new Stop('ng', t('endless')); }
  };
  let result;
  try {
    new Function(...Object.keys(api), code)(...Object.values(api));
    if (atGoal() && left.size === 0) result = new Stop('ok', 'goal');
    else if (atGoal()) result = new Stop('ng', t('starsLeft', left.size));
    else if (left.size === 0) result = new Stop('ng', t('goRocket'));
    else result = new Stop('ng', t('noRocket', left.size));
  } catch (e) {
    result = e instanceof Stop ? e : new Stop('ng', '⚠ ' + e.message);
  }
  return { frames, result };
}

/* ========== 7. えを かく（ドット絵） ========== */
const ctx = document.getElementById('board').getContext('2d');
ctx.imageSmoothingEnabled = false;
const PX = CELL / 16;
let robot = { ...START }, trail = [], crashed = false, timer = null, shownStars = new Set(), launched = 0, tick = 0;

function rand(r, c, i) {
  let h = (r * 73856093) ^ (c * 19349663) ^ (i * 83492791);
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function dot(x, y, px, py, color) { ctx.fillStyle = color; ctx.fillRect(x + px * PX, y + py * PX, PX, PX); }
function sprite(x, y, rows, colors) {
  rows.forEach((row, py) => [...row].forEach((ch, px) => { if (colors[ch]) dot(x, y, px, py, colors[ch]); }));
}

// うちゅう（こまかい ほしが またたく）
function spaceTile(x, y, r, c, walked) {
  ctx.fillStyle = walked ? '#141a45' : '#0b0f2a'; ctx.fillRect(x, y, CELL, CELL);
  for (let k = 0; k < 5; k++) {
    const px = Math.floor(rand(r, c, k) * 16), py = Math.floor(rand(r, c, k + 9) * 16);
    const tw = (Math.floor(tick / 20) + k + r + c) % 4 === 0;
    dot(x, y, px, py, tw ? '#ffffff' : (k % 2 ? '#5d6ab0' : '#8f9be0'));
  }
  if (walked) { dot(x, y, 7, 7, '#2fd1ff55'); dot(x, y, 8, 8, '#2fd1ff55'); }
}
// いんせき
function asteroidTile(x, y, r, c) {
  spaceTile(x, y, r, c, false);
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++) {
    const dx = px - 7.5, dy = py - 7.5, d = Math.hypot(dx, dy * 1.1);
    if (d < 6.8 + rand(r, c, px * 16 + py) * 0.9) {
      const shade = dx + dy < -2 ? '#a89a8c' : dx + dy > 4 ? '#5e5248' : '#857565';
      dot(x, y, px, py, shade);
    }
  }
  [[5, 5, 2], [9, 9, 2], [10, 4, 1]].forEach(([cx, cy, s]) => {
    for (let i = 0; i < s; i++) for (let j = 0; j < s; j++) dot(x, y, cx + i, cy + j, '#4a4038');
  });
}
// スタートの はっしゃだい
function padTile(x, y, r, c) {
  ctx.fillStyle = '#5a6070'; ctx.fillRect(x, y, CELL, CELL);
  for (let i = 0; i < 16; i++) {
    const col = Math.floor(i / 2) % 2 ? '#ffd23f' : '#222';
    dot(x, y, i, 0, col); dot(x, y, i, 15, col); dot(x, y, 0, i, col); dot(x, y, 15, i, col);
  }
  ctx.fillStyle = '#7a8090'; ctx.fillRect(x + PX * 3, y + PX * 3, PX * 10, PX * 10);
}
const STAR = [
  '................', '.......Y........', '......YYY.......', '......YWY.......', '.....YYYYY......',
  'YYYYYYYYYYYYYYY.', '.YYYYYYWYYYYYY..', '..YYYYYYYYYYY...', '...YYYYYYYYY....', '...YYYYYYYYY....',
  '..YYYYY.YYYYY...', '..YYYY...YYYY...', '.YYY.......YYY..', '.YY.........YY..', '................', '................'];
const ROCKET = [
  '.......RR.......', '......RRRR......', '......WWWW......', '.....WWWWWW.....', '.....WWBBWW.....',
  '.....WBCCBW.....', '.....WBCCBW.....', '.....WWBBWW.....', '.....WWWWWW.....', '....RWWWWWWR....',
  '...RRWWWWWWRR...', '...RR.WWWW.RR...', '......GGGG......', '.....F.FF.F.....', '......FOOF......', '.......FF.......'];
const ASTRONAUT = [
  '................', '................', '......CCCC......', '.....CCCCCC.....', '.....HHHHHH.....',
  '....HHHHHHHH....', '..WWHHHHHHHHWW..', '.SWWHHHHHHHHWWS.', '.SWWWHHHHHHWWWS.', '.SWWWWWWWWWWWWS.',
  '..WWWPPPPPPWWW..', '..WWWPPPPPPWWW..', '...WWPPPPPPWW...', '....WWWWWWWW....', '................', '................'];

function drawStar(x, y) {
  const bob = Math.round(Math.sin(tick / 12 + x) * 1);
  const tw = Math.floor(tick / 15) % 2;
  ctx.save(); ctx.translate(0, bob * PX);
  sprite(x, y, STAR, { Y: '#ffd54f', W: tw ? '#ffffff' : '#fff3b0' });
  ctx.restore();
}
function drawRocket(x, y, ready) {
  ctx.fillStyle = 'rgba(80,120,255,.18)'; ctx.fillRect(x, y, CELL, CELL);
  const lift = launched ? Math.min(launched * 4, 400) : 0;
  sprite(x, y - lift, ROCKET, { R: '#e53935', W: '#eceff1', B: '#1565c0', C: '#4dd0e1', G: '#78909c',
    F: ready ? '#ff9800' : null, O: ready ? (tick % 10 < 5 ? '#ffeb3b' : '#fff') : null });
}
function drawAstronaut() {
  if (launched) return;   // ロケットに のりこんだ
  const cx = robot.c * CELL + CELL / 2, cy = robot.r * CELL + CELL / 2;
  const col = crashed
    ? { C: '#ff5252', H: '#ffcdd2', W: '#ef9a9a', S: '#c62828', P: '#b71c1c' }
    : { C: '#4dd0e1', H: '#ffffff', W: '#cfd8dc', S: '#ff9800', P: '#607d8b' };
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(robot.dir * Math.PI / 2);
  ctx.fillStyle = 'rgba(77,208,225,.28)';    // ヘルメットの ライト（まえの むき）
  ctx.beginPath(); ctx.moveTo(-PX * 2, -PX * 6); ctx.lineTo(PX * 2, -PX * 6);
  ctx.lineTo(PX * 5, -CELL * 0.75); ctx.lineTo(-PX * 5, -CELL * 0.75); ctx.fill();
  ASTRONAUT.forEach((row, py) => [...row].forEach((ch, px) => {
    if (col[ch]) { ctx.fillStyle = col[ch]; ctx.fillRect((px - 8) * PX, (py - 8) * PX, PX, PX); }
  }));
  ctx.restore();
}

function draw() {
  tick++;
  ctx.clearRect(0, 0, 400, 400);
  const walked = new Set(trail.map(([r, c]) => key(r, c)));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = c * CELL, y = r * CELL;
    if (rocks[r][c]) asteroidTile(x, y, r, c);
    else if (r === START.r && c === START.c) padTile(x, y, r, c);
    else spaceTile(x, y, r, c, walked.has(key(r, c)));
  }
  ctx.strokeStyle = 'rgba(120,140,255,.18)'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(400, i * CELL + .5); ctx.stroke();
  }
  for (const k of shownStars) drawStar((k % N) * CELL, Math.floor(k / N) * CELL);
  drawRocket(GOAL.c * CELL, GOAL.r * CELL, shownStars.size === 0);
  drawAstronaut();
  // あつめた ほしの かず
  const total = stars.length, got = total - shownStars.size, sc = document.getElementById('starCount');
  sc.textContent = got === total ? t('allGot', got, total) : t('got', got, total);
  sc.className = got === total ? 'done' : '';
}
// ほしの きらきらを うごかす
setInterval(() => { if (!timer && !launched) draw(); }, 100);

/* ========== 8. 効果音（Web Audio で その場で つくる） ========== */
const Sound = {
  ctx: null, master: null, muted: !!store.get('-muted'), foot: 0,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.25; this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(type, f1, f2, len, delay = 0, vol = 1) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + len + 0.02);
  },
  noise(len, delay = 0, vol = 1, freq = 900) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * len), this.ctx.sampleRate);
    const d = buf.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain(), lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.buffer = buf; src.connect(lp); lp.connect(g); g.connect(this.master); src.start(t);
  },
  notes(list, type = 'square', vol = 0.6) { for (const [f, at, len] of list) this.tone(type, f, f, len, at, vol); },
  step()      { this.foot ^= 1; this.tone('sine', this.foot ? 300 : 260, this.foot ? 200 : 180, 0.08, 0, 0.6); this.noise(0.05, 0, 0.25, 2500); },  // ぽよん（むじゅうりょく）
  turnRight() { this.tone('triangle', 520, 880, 0.12, 0, 0.7); },
  turnLeft()  { this.tone('triangle', 880, 520, 0.12, 0, 0.7); },
  pick()      { this.notes([[988, 0, .07], [1319, .07, .18]], 'square', 0.5); },       // ピロン
  allStars()  { this.notes([[1047, 0, .08], [1319, .08, .08], [1568, .16, .08], [2093, .24, .25]], 'square', 0.4); },
  miss()      { this.tone('square', 200, 150, 0.25, 0, 0.6); },
  crash()     { this.noise(0.4, 0, 1); this.tone('square', 140, 50, 0.35, 0, 0.8); },
  launch()    { this.noise(1.6, 0, 0.9, 600); this.tone('sawtooth', 80, 600, 1.6, 0, 0.35); },          // ゴゴゴ…
  clear()     { this.notes([[523, 1.0, .12], [659, 1.12, .12], [784, 1.24, .12], [1047, 1.36, .45]]); this.notes([[392, 1.36, .45], [659, 1.36, .45]], 'triangle', 0.5); },
  goalSoSo()  { this.notes([[784, 1.0, .12], [1047, 1.14, .25]]); },
  fail()      { this.notes([[392, 0, .16], [330, .18, .16], [262, .36, .35]], 'square', 0.5); },
  grandClear(){ this.notes([[523, 1.0, .1], [523, 1.12, .1], [523, 1.24, .1], [523, 1.36, .3], [415, 1.7, .3], [466, 2.0, .3], [523, 2.3, .15], [466, 2.5, .1], [523, 2.62, .7]]);
                this.notes([[262, 2.3, 1.0], [330, 2.3, 1.0], [392, 2.3, 1.0]], 'triangle', 0.4); },
  toggle() { this.muted = !this.muted; store.set('-muted', this.muted); return this.muted; }
};

/* ========== 9. ステージの きりかえ ========== */
const msg = document.getElementById('msg');
const levelSelect = document.getElementById('levelSelect');
const clearDialog = document.getElementById('clearDialog');
let cleared = store.get('-cleared') || [];

function refreshLevelList() {
  levelSelect.innerHTML = '';
  LEVELS.forEach((lv, i) => levelSelect.add(new Option((cleared[i] ? '✅ ' : '') + L(lv, 'title'), i)));
  levelSelect.value = levelIndex;
}

function setLevel(i) {
  levelIndex = i;
  const lv = LEVELS[i];
  store.set('-level', i);
  refreshLevelList();
  document.getElementById('lessonText').textContent = L(lv, 'text');
  document.getElementById('limitText').textContent = lv.limit ? t('limit', lv.limit) : '';
  const hint = document.getElementById('hintText');
  hint.textContent = L(lv, 'hint'); hint.style.display = 'none';
  document.getElementById('hintBtn').style.display = L(lv, 'hint') ? '' : 'none';
  document.getElementById('randomRow').style.display = lv.mode ? 'flex' : 'none';

  loading = true;
  workspace.updateToolbox(flyout(lv.blocks));
  workspace.clear();
  const saved = store.get('-ws-' + i);
  if (saved) { try { Blockly.serialization.workspaces.load(saved, workspace); } catch (_) {} }
  loading = false;

  if (lv.mode) {
    const sp = store.get('-random');
    if (sp && Array.isArray(sp.rocks) && sp.rocks.length === N && Array.isArray(sp.stars) && solvable(sp.rocks)) setRandomSpace(sp);
    else setRandomSpace(randomSpace(Number(document.getElementById('rockCount').value)));
  } else {
    loadMap(lv.map, lv.dir);
    resetRobot();
  }
  updateInfo();
}

function showClearDialog() {
  const next = LEVELS[levelIndex + 1];
  document.getElementById('dlgQuestion').innerHTML =
    `${t('dlgQuestion')}<br><span style="font-size:15px">${LANG === 'en' ? '(' : '（'}${L(next, 'title')}${LANG === 'en' ? ')' : '）'}</span>`;
  clearDialog.classList.add('show');
  document.getElementById('dlgYes').focus();
}
let dialogTimer = null;
function hideClearDialog() { clearTimeout(dialogTimer); dialogTimer = null; clearDialog.classList.remove('show'); }

// ぜんぶの ステージ（じゆうモード いがい）を クリアしたか
function allStagesCleared() { return LEVELS.every((lv, i) => lv.mode === 'free' || cleared[i]); }

// 📜 しゅうりょうしょう（とじたら、つぎの ステージの かくにんを だす）
function showCertificate(thenNext) {
  Certificate.show({ app: t('appTitle'), icons: ['🚀', '⭐'],
    onClose: thenNext && levelIndex < LEVELS.length - 1 ? showClearDialog : null });
}

function markCleared() {
  const wasAll = allStagesCleared();
  cleared[levelIndex] = true;
  store.set('-cleared', cleared);
  refreshLevelList();
  if (!wasAll && allStagesCleared()) {   // いま ぜんぶ クリアに なった！
    dialogTimer = setTimeout(() => showCertificate(true), 2200);
    return;
  }
  if (levelIndex < LEVELS.length - 1) dialogTimer = setTimeout(showClearDialog, 2200);   // ロケットが とんでから
}

/* ========== 10. じっこう ========== */
function resetRobot() {
  if (timer) clearTimeout(timer);
  timer = null; launched = 0;
  robot = { ...START }; trail = [[START.r, START.c]]; crashed = false;
  shownStars = new Set(stars);
  msg.textContent = ''; msg.className = '';
  hideClearDialog();
  workspace.highlightBlock(null);
  draw();
}

function blockCount() { return workspace.getAllBlocks(false).filter((b) => !b.isShadow()).length; }
function updateInfo(moves) {
  document.getElementById('info').textContent =
    t('used', blockCount()) + (moves != null ? t('moves', moves) : '');
}

// ステージ7：ランダムな うちゅう 30こで テスト
function testOnRandomSpaces(code, times) {
  const keep = { rocks, stars, START, GOAL };
  const k = Number(document.getElementById('rockCount').value);
  let ok = 0;
  START = { r: 0, c: 0, dir: 1 }; GOAL = { r: N - 1, c: N - 1 };
  for (let t = 0; t < times; t++) {
    const sp = randomSpace(k);
    rocks = sp.rocks; stars = sp.stars;
    if (simulate(code).result.kind === 'ok') ok++;
  }
  ({ rocks, stars, START, GOAL } = keep);
  return ok;
}

// ロケット はっしゃの アニメーション
function launchRocket() {
  launched = 1; Sound.launch();
  const fly = () => { launched++; draw(); if (launched < 110) requestAnimationFrame(fly); };
  requestAnimationFrame(fly);
}

function finish(result, moves, code) {
  const lv = LEVELS[levelIndex];
  updateInfo(moves);
  if (result.kind !== 'ok') {
    msg.className = 'ng'; msg.textContent = result.text;
    if (result.why !== 'crash' && result.why !== 'miss') Sound.fail();
    return;
  }
  launchRocket();
  msg.className = 'ok';
  const n = blockCount();
  if (lv.mode === 'test') {
    const ok = testOnRandomSpaces(code, 30);
    if (ok === 30) { msg.textContent = t('grand'); markCleared(); Sound.grandClear(); }
    else { msg.className = 'ng'; msg.textContent = t('testPartial', ok); Sound.goalSoSo(); }
  } else if (lv.mode === 'free') {
    msg.textContent = t('freeGoal'); Sound.clear();
  } else if (lv.limit && n > lv.limit) {
    msg.textContent = t('overLimit', n, lv.limit); Sound.goalSoSo();
  } else {
    msg.textContent = t('stageClear'); markCleared(); Sound.clear();
  }
}

function run() {
  Sound.unlock();
  resetRobot();
  const code = gen.workspaceToCode(workspace);
  const { frames, result } = simulate(code);
  let i = 0;
  const step = () => {
    if (i < frames.length) {
      const f = frames[i++];
      robot = { r: f.r, c: f.c, dir: f.dir };
      if (f.event === 'move') { trail.push([f.r, f.c]); Sound.step(); }
      if (f.event === 'turn') {
        const prev = i > 1 ? frames[i - 2].dir : START.dir;
        if ((prev + 1) % 4 === f.dir) Sound.turnRight(); else Sound.turnLeft();
      }
      if (f.event === 'pick') { shownStars.delete(f.star); if (f.remain === 0) Sound.allStars(); else Sound.pick(); }
      if (f.event === 'miss') Sound.miss();
      if (f.event === 'crash') { crashed = true; Sound.crash(); }
      workspace.highlightBlock(f.id);
      draw();
      const speed = Number(document.getElementById('speed').value);
      timer = setTimeout(step, 650 - speed * 60);
    } else {
      timer = null;
      workspace.highlightBlock(null);
      finish(result, frames.filter((f) => f.event === 'move' || f.event === 'turn').length, code);
    }
  };
  step();
}

levelSelect.addEventListener('change', () => setLevel(Number(levelSelect.value)));
document.getElementById('hintBtn').addEventListener('click', () => {
  const h = document.getElementById('hintText');
  h.style.display = h.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('dlgYes').addEventListener('click', () => { hideClearDialog(); setLevel(levelIndex + 1); });
document.getElementById('dlgNo').addEventListener('click', () => {
  hideClearDialog(); resetRobot();
  msg.className = 'ok'; msg.textContent = t('retry');
});
document.addEventListener('keydown', (e) => {
  if (clearDialog.classList.contains('show') && e.key === 'Escape') document.getElementById('dlgNo').click();
});
window.addEventListener('resize', () => Blockly.svgResize(workspace));

// ヘッダー：ボタンの ことば・アプリの リンク・ことばの きりかえ
setLabel(document.getElementById('run'), '▶', t('run'));
setLabel(document.getElementById('reset'), '↺', t('reset'));
setLabel(document.getElementById('answerBtn'), '📖', t('answer'));
buildNav(document.getElementById('nav'));
applyI18n(t);

setLevel(Math.min(Number(store.get('-level')) || 0, LEVELS.length - 1));

// 先生モード：URL の さいごに ?sensei を つけると「こたえ」ボタンが でる
const answerBtn = document.getElementById('answerBtn');
if (new URLSearchParams(location.search).has('sensei')) answerBtn.style.display = '';
answerBtn.addEventListener('click', () => {
  resetRobot(); workspace.clear();
  Blockly.serialization.workspaces.load(LEVELS[levelIndex].answer, workspace);
  msg.className = ''; msg.textContent = t('answerLoaded');
});

// つぎの ひとへ：ぜんぶの ステージの ブロック・クリアきろく・ランダムうちゅうを けして ステージ1へ
function resetForNextPerson() {
  try {
    Object.keys(localStorage)
      .filter((k) => k.startsWith(SAVE_KEY + '-ws-') || [SAVE_KEY + '-cleared', SAVE_KEY + '-level', SAVE_KEY + '-random'].includes(k))
      .forEach((k) => localStorage.removeItem(k));
  } catch (_) {}
  cleared = [];
  Certificate.clearName();
  loading = true; workspace.clear(); loading = false;
  setLevel(0);
  msg.className = 'ok'; msg.textContent = t('resetDone');
}

// ⚙ きのう メニュー：おと・ことば・つぎの ひとへ（リセット）
let resetArmed = null;
const fnMenu = FnMenu(document.getElementById('fnBtn'), [
  { icon: () => Sound.muted ? '🔇' : '🔊',
    label: () => Sound.muted ? t('soundOff') : t('soundOn'),
    onClick: (m) => { Sound.unlock(); Sound.toggle(); m.render(); if (!Sound.muted) Sound.pick(); } },
  langMenuItem(),
  nightMenuItem(),
  calmMenuItem(),
  { icon: () => '📜', label: () => t('certItem'), visible: allStagesCleared,
    onClick: (m) => { m.close(); showCertificate(false); } },
  { icon: () => resetArmed ? '⚠' : '🔄',
    label: () => resetArmed ? t('armedItem') : t('nextPerson'),
    warn: () => !!resetArmed,
    onClick: (m) => {
      if (!resetArmed) {   // 2かい おして かくにん（まちがえて けさないように）
        msg.className = 'ng'; msg.textContent = t('armedMsg');
        resetArmed = setTimeout(() => { resetArmed = null; m.render(); }, 4000);
        m.render();
        return;
      }
      clearTimeout(resetArmed); resetArmed = null;
      m.close();
      resetForNextPerson();
    } }
]);
</script>
</body>
</html>
