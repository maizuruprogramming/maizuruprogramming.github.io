<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かいせつ どうが / Explanation Videos</title>
<script src="i18n.js"></script>  <!-- にほんご／English（ここでは Blockly は つかわない） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* ===== テーマ：えいがかん ===== */
  :root {
    --page-bg: #1b1b24 repeating-conic-gradient(rgba(0,0,0,.2) 0 25%, transparent 0 50%) 0 0 / 32px 32px;
    --hdr-bg: linear-gradient(#e0b64a 0 10px, #a8862e 10px 14px, #3a3040 14px);
    --hdr-border: #0c0c10; --title-shadow: #000; --link: #ffd966; --fn: #6a4a8a;
  }
  html, body { height: auto; min-height: 100%; }
  #wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
  .app { margin-bottom: 26px; }
  .app h2 { color: #fff; font-weight: normal; font-size: 24px; text-shadow: 2px 2px 0 #000; margin: 10px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { width: auto; padding: 8px; }
  .card video { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; }
  .card .t { margin-top: 6px; font-size: 15px; line-height: 1.4; }
  .card a { color: inherit; }
  .viewBar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 22px; }
  .viewBar .vl { color: #fff; text-shadow: 2px 2px 0 #000; font-size: 15px; }
  .viewBar button { font-size: 15px; padding: 6px 12px; background: #3d4352; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .viewBar button small { font-size: 12px; opacity: .85; }
  .viewBar button[aria-pressed="true"] { background: #306998; border-color: #ffd43b; outline: 3px solid #ffd43b; }
  body.view-blk section.app[data-kind="py"], body.view-py section.app[data-kind="blk"] { display: none; }
  #note { color: #ddd; text-shadow: 1px 1px 0 #000; line-height: 1.7; margin: 4px 0 12px; }
</style>
</head>
<body>
<header>
  <h1><span class="ico">🎬</span><span class="lbl" id="title"></span></h1>
  <nav class="nav" id="nav"></nav>
  <button id="fnBtn" class="sub2"></button>
</header>
<div id="wrap">
  <div id="note"></div>
  <div id="list"></div>
</div>
<script>
// 動画の いちらん（videos/ja/〜.mp4、videos/en/〜.mp4）
const APPS = [
  { key: 'draw', icon: '🐢', ja: 'ブロックでおえかき', en: 'Block Drawing', page: 'index.html', odai: true, titles: {
      ja: ['① 六角形（ろっかくけい） ★', '② ほし ★★', '③ まる ★★', '④ まど ★★★', '⑤ はな ★★★', '⑥ しかくい うずまき ★★★★', '⑦ ならんだ たかくけい ★★★★', '⑧ ゆきの けっしょう ★★★★★', '⑨ ほしの うずまき ★★★★★'],
      en: ['① Hexagon ★', '② Star ★★', '③ Circle ★★', '④ Window ★★★', '⑤ Flower ★★★', '⑥ Square spiral ★★★★', '⑦ Polygons in a row ★★★★', '⑧ Snowflake ★★★★★', '⑨ Star spiral ★★★★★'] } },
  { key: 'maze',  icon: '⛏', ja: 'ブロックでめいろ', en: 'Block Maze', page: 'maze.html', titles: {
      ja: ['まっすぐ すすもう', 'まがってみよう', 'ながい みち', 'くりかえしを つかおう', 'かいだんを のぼろう', 'もし〜なら', 'みぎ？ ひだり？', 'どんな めいろでも ゴール！'],
      en: ['Go straight', "Let's turn", 'A long path', 'Use a loop', 'Climb the stairs', 'If…', 'Right? Left?', 'Any maze!'] } },
  { key: 'mazejr', icon: '🧭', ja: 'やじるしの めいろ', en: 'Arrow Maze', page: 'maze-junior.html', titles: {
      ja: ["みぎへ すすもう", "したへ まがろう", "かいだん", "うえへ のぼろう", "ぐるっと まわろう", "くりかえしを つかおう"],
      en: ["Go right", "Go down", "Stairs", "Go up", "Go around", "Use repeat"] } },
  { key: 'mazekey', icon: '🗝', ja: 'かぎと とびらの めいろ', en: 'Keys & Doors Maze', page: 'maze-key.html', titles: {
      ja: ["かぎを ひろって とびらを あけよう", "かぎは どこ？", "とびらが 2つ", "じぶんで かんがえる たんけんか"],
      en: ["Pick up the key, open the door", "Where is the key?", "Two doors", "A thinking explorer"] } },
  { key: 'mazeenemy', icon: '👾', ja: 'てきを よける めいろ', en: 'Dodge the Slime Maze', page: 'maze-enemy.html', titles: {
      ja: ["まって よけよう", "あぶなかったら まつ", "おおきな めいろ", "うずまきの めいろ"],
      en: ["Wait and dodge", "Wait if it is dangerous", "A bigger maze", "The spiral maze"] } },
  { key: 'space', icon: '🚀', ja: 'うちゅうで ほしあつめ', en: 'Space Star Hunt', page: 'space.html', titles: {
      ja: ['ほしを ひろおう', 'まがって あつめよう', 'くりかえしで あつめよう', 'ほしの かいだん', 'もし ほしが あったら', 'ミッション クリアまで', 'どんな うちゅうでも！'],
      en: ['Pick up a star', 'Turn and collect', 'Collect with a loop', 'Star stairs', 'If there is a star', 'Until mission complete', 'Any space!'] } },
  { key: 'craft', icon: '🧱', ja: 'こわして つくる ぼうけん', en: 'Break & Build Quest', page: 'craft.html', titles: {
      ja: ['こわして すすもう', 'はしを かけよう', 'くりかえして こわそう', 'ながい はし', 'もし いしが あったら', 'いしと みず', 'うずまきの どうくつ'],
      en: ['Break and go', 'Build a bridge', 'Break with a loop', 'A long bridge', 'If there is stone', 'Stone and water', 'Spiral cave'] } },
  { key: 'pydraw', icon: '🐍', ja: 'Pythonで おえかき', en: 'Python Drawing', page: 'python-draw.html', odai: true, titles: {
      ja: ["① 六角形（ろっかくけい） ★", "② ほし ★★", "③ まる ★★", "④ まど ★★★", "⑤ はな ★★★", "⑥ しかくい うずまき ★★★★", "⑦ ならんだ たかくけい ★★★★", "⑧ ゆきの けっしょう ★★★★★", "⑨ ほしの うずまき ★★★★★"],
      en: ["① Hexagon ★", "② Star ★★", "③ Circle ★★", "④ Window ★★★", "⑤ Flower ★★★", "⑥ Square spiral ★★★★", "⑦ Polygons in a row ★★★★", "⑧ Snowflake ★★★★★", "⑨ Star spiral ★★★★★"] } },
  { key: 'pymaze', icon: '🐍', ja: 'Pythonで めいろ', en: 'Python Maze', page: 'python.html', titles: {
      ja: ["まっすぐ すすもう", "まがってみよう", "for で くりかえそう", "while と if", "elif で 3つに わけよう"],
      en: ["Go straight", "Let's turn", "Repeat with for", "while and if", "Three choices with elif"] } },
  { key: 'pyspace', icon: '🐍', ja: 'Pythonで うちゅう', en: 'Python Space', page: 'python-space.html', titles: {
      ja: ["ほしを ひろおう", "まがって あつめよう", "for で あつめよう", "ほしの かいだん", "if has_star():", "while not mission_done():"],
      en: ["Pick up a star", "Turn and collect", "Collect with for", "Star stairs", "if has_star():", "while not mission_done():"] } },
  { key: 'pycraft', icon: '🐍', ja: 'Pythonで こわす・おく', en: 'Python Break & Build', page: 'python-craft.html', titles: {
      ja: ["こわして すすもう", "はしを かけよう", "for で こわそう", "ながい はし", "if front_is('stone'):", "elif で いしと みず", "うずまきの どうくつ"],
      en: ["Break and go", "Build a bridge", "Break with for", "A long bridge", "if front_is('stone'):", "Stone and water with elif", "Spiral cave"] } },
  { key: 'pymazejr', icon: '🐍', ja: 'Pythonで やじるし めいろ', en: 'Python Arrow Maze', page: 'python-maze-junior.html', titles: {
      ja: ["right() で すすもう", "down() で したへ", "かいだん", "up() で うえへ", "left() も つかおう", "for で くりかえそう"],
      en: ["Go with right()", "Go down with down()", "Stairs", "Go up with up()", "Use left() too", "Repeat with for"] } },
  { key: 'pymazekey', icon: '🐍', ja: 'Pythonで かぎと とびら', en: 'Python Keys & Doors', page: 'python-maze-key.html', titles: {
      ja: ["pick_up() と open_door()", "かぎは どこ？", "for で とびら 2つ", "key_here() と door_ahead()"],
      en: ["pick_up() and open_door()", "Where is the key?", "Two doors with for", "key_here() and door_ahead()"] } },
  { key: 'pymazeenemy', icon: '🐍', ja: 'Pythonで てきを よける', en: 'Python Slime Maze', page: 'python-maze-enemy.html', titles: {
      ja: ["wait() で まとう", "if danger_ahead():", "elif で おおきな めいろ", "うずまきの めいろ"],
      en: ["wait()", "if danger_ahead():", "A bigger maze with elif", "The spiral maze"] } }
];
const J = LANG === 'ja';
document.getElementById('title').textContent = J ? 'かいせつ どうが' : 'Explanation Videos';
document.title = J ? 'かいせつ どうが' : 'Explanation Videos';
document.getElementById('note').textContent = J
  ? 'ステージごとの かいせつ どうがです（じまく＋こうかおん、1ぽん 30〜60びょう）。🐍 Python版は、こたえの コードと うごいている ぎょうを みせます。▶ を おすと はじまります。'
  : 'One short video for each stage (captions + sound effects, 30–60 seconds). 🐍 Python videos show the answer code and the line that is running. Press ▶ to play.';
const list = document.getElementById('list');
// はじめに：あそびかたの しょうかい どうが
{
  const sec = document.createElement('section'); sec.className = 'app';
  const h = document.createElement('h2'); h.innerHTML = `🎮 <a href="howto.html" style="color:inherit">${J ? 'あそびかた・べんきょうの しかた' : 'How to play and learn'}</a>`;
  const grid = document.createElement('div'); grid.className = 'grid';
  const card = document.createElement('div'); card.className = 'panel card';
  const v = document.createElement('video'); v.src = `videos/${LANG}/howto.mp4`; v.controls = true; v.preload = 'metadata'; v.playsInline = true;
  const cap = document.createElement('div'); cap.className = 't'; cap.textContent = J ? 'はじめに：1ぷんで わかる あそびかた' : 'Start here: how to play in 1 minute';
  card.append(v, cap); grid.append(card);
  // 🎬 この システムの しょうかい（先生・保護者 むけ、スライドから つくった 2ふんの どうが）
  const card2 = document.createElement('div'); card2.className = 'panel card';
  const v2 = document.createElement('video'); v2.src = `videos/${LANG}/intro.mp4`; v2.controls = true; v2.preload = 'metadata'; v2.playsInline = true;
  const cap2 = document.createElement('div'); cap2.className = 't'; cap2.textContent = J ? 'この システムの しょうかい（先生・保護者むけ、2ふん）' : 'System overview (for teachers and parents, 2 min)';
  card2.append(v2, cap2); grid.append(card2);
  sec.append(h, grid); list.append(sec);
}
// 📚 すべて ／ 🧩 Blockly版 ／ 🐍 Python版 の きりかえ（かいせつしょと おなじ。えらんだ ものは おぼえておく）
const kindOf = (k) => (/^py/.test(k) ? 'py' : 'blk');
{
  const cnt = (k) => APPS.filter((a) => !k || kindOf(a.key) === k).reduce((n, a) => n + a.titles[LANG].length, 0);
  const apps = (k) => APPS.filter((a) => !k || kindOf(a.key) === k).length;
  const unit = (k) => J ? `（${apps(k)}アプリ・${cnt(k)}ほん）` : ` (${apps(k)} apps, ${cnt(k)} videos)`;
  const bar = document.createElement('div'); bar.id = 'viewBar'; bar.className = 'viewBar'; bar.setAttribute('role', 'group');
  bar.innerHTML = `<span class="vl">${J ? 'みる ものを えらぶ：' : 'Show:'}</span>` +
    [['all', '📚 すべてを みる', '📚 Show all', ''], ['blk', '🧩 Blockly版を みる', '🧩 Show Blockly', 'blk'], ['py', '🐍 Python版を みる', '🐍 Show Python', 'py']]
      .map(([v, ja, en, k]) => `<button type="button" data-view="${v}" aria-pressed="false">${J ? ja : en}<small>${unit(k)}</small></button>`).join('');
  list.append(bar);
}

for (const a of APPS) {
  const sec = document.createElement('section'); sec.className = 'app'; sec.dataset.kind = kindOf(a.key);
  const h = document.createElement('h2'); h.innerHTML = `${a.icon} <a href="${a.page}" style="color:inherit">${J ? a.ja : a.en}</a>`;
  const grid = document.createElement('div'); grid.className = 'grid';
  a.titles[LANG].forEach((t, i) => {
    const n = String(i + 1).padStart(2, '0');
    const card = document.createElement('div'); card.className = 'panel card';
    const v = document.createElement('video');
    v.src = `videos/${LANG}/${a.key}-${n}.mp4`; v.controls = true; v.preload = 'metadata'; v.playsInline = true;
    const cap = document.createElement('div'); cap.className = 't';
    cap.textContent = (a.odai ? '' : (J ? `ステージ${i + 1}　` : `Stage ${i + 1}: `)) + t;
    card.append(v, cap); grid.append(card);
  });
  sec.append(h, grid); list.append(sec);
}
{
  const bar = document.getElementById('viewBar');
  const setView = (v, save) => {
    if (!['all', 'blk', 'py'].includes(v)) v = 'all';
    document.body.classList.remove('view-all', 'view-blk', 'view-py'); document.body.classList.add('view-' + v);
    bar.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    // かくれた どうがは とめる
    document.querySelectorAll('section.app video').forEach((vd) => { if (!vd.offsetParent && !vd.paused) vd.pause(); });
    if (save) { try { localStorage.setItem('videos-view', v); } catch (e) {} }
  };
  let v = new URLSearchParams(location.search).get('view');
  if (!v) { try { v = localStorage.getItem('videos-view'); } catch (e) {} }
  setView(v || 'all', false);
  bar.addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view, true); });
}
buildNav(document.getElementById('nav'));
FnMenu(document.getElementById('fnBtn'), [langMenuItem(), nightMenuItem(), calmMenuItem()]);
</script>
</body>
</html>
